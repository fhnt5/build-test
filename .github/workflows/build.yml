  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      kernel_ref: ${{ steps.resolve.outputs.kernel_ref }}
    steps:
      - name: 解析内核版本引用
        id: resolve
        run: |
          set -euo pipefail
          INPUT_REF="${{ inputs.kernel_ref }}"
          REPO="${{ inputs.kernel_repo }}"

          if [ -n "$INPUT_REF" ]; then
            echo "kernel_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 一次性读入 git 输出，避免下游 head 关闭管道导致上游 SIGPIPE。
          # set -o pipefail 下 sort 收到 SIGPIPE 会以非零码退出，表现为
          #   sort: write failed: 'standard output': Broken pipe
          #   sort: write error
          # 进而让整个 step 失败。
          RAW="$(git ls-remote --tags --refs "$REPO" 2>/dev/null || true)"

          # 从 RAW 里按正则过滤出所有 tag，版本序排序，取最新一条。
          # 关键：sort -o 直接写回文件，不经过管道，彻底规避 SIGPIPE。
          pick_latest() {
            local pat="$1" tmp
            tmp="$(mktemp)"
            printf '%s\n' "$RAW" \
              | awk -F/ '{print $NF}' \
              | grep -E "$pat" > "$tmp" || true
            if [ -s "$tmp" ]; then
              sort -Vr -o "$tmp" "$tmp"
              head -1 "$tmp"
            fi
            rm -f "$tmp"
          }

          # 官方 stable 仓库：只认纯上游三段版本号
          if echo "$REPO" | grep -Eq '(^|/)linux-stable(\.git)?$'; then
            TAG="$(pick_latest '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
            if [ -n "$TAG" ]; then
              echo "kernel_ref=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "无法定位 stable 最新标签" >&2
            exit 1
          fi

          # 通用仓库：允许 v6.12.5 / v6.12.5-zen1 / 6.12.5-xanmod1 / 6.12.5-1-cachyos
          PAT='^v?[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z._-]+)?$'
          LATEST="$(pick_latest "$PAT" || true)"

          # 兜底 1：没有符合模式的 tag（比如 Liquorix 只维护分支）→ 取默认分支
          if [ -z "$LATEST" ]; then
            LATEST="$(git ls-remote --symref "$REPO" HEAD 2>/dev/null \
              | awk '/^ref:/ {sub("refs/heads/","",$2); print $2; exit}')"
          fi

          # 兜底 2：HEAD 是 detached，直接拿 SHA
          if [ -z "$LATEST" ]; then
            LATEST="$(git ls-remote "$REPO" HEAD 2>/dev/null | awk '{print $1; exit}')"
          fi

          if [ -z "$LATEST" ]; then
            echo "无法解析版本引用: $REPO" >&2
            exit 1
          fi
          echo "kernel_ref=$LATEST" >> "$GITHUB_OUTPUT"
