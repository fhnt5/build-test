name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      x86_64_deb:   { description: 'x86_64  ›  deb', type: boolean, default: true }
      x86_64_rpm:   { description: 'x86_64  ›  rpm', type: boolean, default: false }
      x86_64_tarxz: { description: 'x86_64  ›  tar.xz（全发行版通用 + install/uninstall）', type: boolean, default: false }
      x86_64_pkg:   { description: 'x86_64  ›  pkg.tar.zst（Arch 包）', type: boolean, default: false }
      arm64_deb:    { description: 'arm64   ›  deb', type: boolean, default: false }
      arm64_rpm:    { description: 'arm64   ›  rpm', type: boolean, default: false }
      arm64_tarxz:  { description: 'arm64   ›  tar.xz（全发行版通用 + install/uninstall）', type: boolean, default: false }
      arm64_pkg:    { description: 'arm64   ›  pkg.tar.zst（Arch 包）', type: boolean, default: false }
      config_choice:
        description: '内核配置来源：内核自带目标 / 仓库 configs/* / make:<target> / 发行版'
        type: choice
        required: true
        default: 'default'
        options:
          - 'default'
          - 'allyesconfig'
          - 'allmodconfig'
          - 'allnoconfig'
          - 'tinyconfig'
          - 'configs/G40_45.config'
          - 'alma'
          - 'alpine'
          - 'arch'
          - 'centos'
          - 'debian'
          - 'fedora'
          - 'gentoo'
          - 'kali'
          - 'manjaro'
          - 'nixos'
          - 'opensuse'
          - 'rhel'
          - 'rocky'
          - 'ubuntu'
          - 'void'
      config_custom:
        description: '（可选）自定义配置：仓库内路径 / http(s):// URL / make:<target>。填了则覆盖上面的选择'
        type: string
        required: false
        default: ''
      respect_config:
        description: '严格尊重仓库中的 .config：不执行 olddefconfig、不做 CONFIG_* 修补（仓库自带 config 请保持 true）'
        type: boolean
        required: false
        default: true
      kernel_repo:
        description: '内核源码仓库 URL'
        required: true
        default: 'https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git'
      kernel_ref:
        description: '分支或 tag（如 v6.12.6 / v6.12.5-zen1）。留空则自动取该仓库最新 stable 版本'
        required: false
        default: ''
      release_tag:
        description: '（可选）完成后发布到该 tag 的 Release，留空则不发布'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: gen
        run: |
          set -uo pipefail
          MATRIX='{"include":[]}'

          X86_FORMATS="[]"
          [ "${{ inputs.x86_64_deb }}"   = "true" ] && X86_FORMATS=$(echo "$X86_FORMATS" | jq -c '. + ["deb"]')   || true
          [ "${{ inputs.x86_64_rpm }}"   = "true" ] && X86_FORMATS=$(echo "$X86_FORMATS" | jq -c '. + ["rpm"]')   || true
          [ "${{ inputs.x86_64_tarxz }}" = "true" ] && X86_FORMATS=$(echo "$X86_FORMATS" | jq -c '. + ["tarxz"]') || true
          [ "${{ inputs.x86_64_pkg }}"   = "true" ] && X86_FORMATS=$(echo "$X86_FORMATS" | jq -c '. + ["pkg"]')   || true
          if [ "$(echo "$X86_FORMATS" | jq 'length')" -gt 0 ]; then
            MATRIX=$(echo "$MATRIX" | jq -c --argjson f "$X86_FORMATS" \
              '.include += [{arch:"x86_64", formats:$f}]')
          fi

          ARM_FORMATS="[]"
          [ "${{ inputs.arm64_deb }}"   = "true" ] && ARM_FORMATS=$(echo "$ARM_FORMATS" | jq -c '. + ["deb"]')   || true
          [ "${{ inputs.arm64_rpm }}"   = "true" ] && ARM_FORMATS=$(echo "$ARM_FORMATS" | jq -c '. + ["rpm"]')   || true
          [ "${{ inputs.arm64_tarxz }}" = "true" ] && ARM_FORMATS=$(echo "$ARM_FORMATS" | jq -c '. + ["tarxz"]') || true
          [ "${{ inputs.arm64_pkg }}"   = "true" ] && ARM_FORMATS=$(echo "$ARM_FORMATS" | jq -c '. + ["pkg"]')   || true
          if [ "$(echo "$ARM_FORMATS" | jq 'length')" -gt 0 ]; then
            MATRIX=$(echo "$MATRIX" | jq -c --argjson f "$ARM_FORMATS" \
              '.include += [{arch:"arm64", formats:$f}]')
          fi

          COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "MATRIX = $MATRIX"
          [ "$COUNT" -eq 0 ] && { echo "No build target selected." >&2; exit 1; }
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      kernel_ref: ${{ steps.resolve.outputs.kernel_ref }}
    steps:
      - name: Resolve kernel ref
        id: resolve
        run: |
          set -uo pipefail
          INPUT_REF="${{ inputs.kernel_ref }}"
          REPO="${{ inputs.kernel_repo }}"

          # 1) 显式指定：直接用
          if [ -n "$INPUT_REF" ]; then
            echo "kernel_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Auto-detecting latest ref from: $REPO"

          # 2) 官方 stable 仓库：只认严格的稳定版 tag vX.Y.Z
          #    linux-stable.git 同时含 mainline / rc / next 等 tag，
          #    若按版本排序会错误地取到 v7.0-rcN 之类的主线版本。
          if echo "$REPO" | grep -Eq '(^|/)linux-stable(\.git)?$'; then
            echo "==> Stable repo detected: only vX.Y.Z tags are candidates"

            STABLE=$(git ls-remote --tags --refs "$REPO" 2>/dev/null \
              | awk -F/ '{print $NF}' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -Vr \
              | head -1 || true)

            if [ -n "$STABLE" ]; then
              echo "Resolved stable ref: $STABLE"
              echo "kernel_ref=$STABLE" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "ERROR: no stable vX.Y.Z tag found in $REPO" >&2
            exit 1
          fi

          # 3) 下游仓库（zen / xanmod / cachyos 等）：允许带后缀的版本号
          PATTERN='^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z._]+)?$'

          LATEST=$(git ls-remote --tags --refs "$REPO" 2>/dev/null \
            | awk -F/ '{print $NF}' \
            | grep -E "$PATTERN" \
            | sort -Vr \
            | head -1 || true)

          # 兜底 1：无任何版本 tag（如只推分支的仓库）→ 取默认分支
          if [ -z "$LATEST" ]; then
            echo "WARNING: no version-like tags found, falling back to default branch" >&2
            LATEST=$(git ls-remote --symref "$REPO" HEAD 2>/dev/null \
              | awk '/^ref:/ {sub("refs/heads/","",$2); print $2; exit}')
          fi

          # 兜底 2：HEAD detached，直接取 SHA
          if [ -z "$LATEST" ]; then
            LATEST=$(git ls-remote "$REPO" HEAD 2>/dev/null | awk '{print $1; exit}')
          fi

          [ -z "$LATEST" ] && { echo "ERROR: failed to resolve ref for $REPO" >&2; exit 1; }
          echo "Resolved ref: $LATEST"
          echo "kernel_ref=$LATEST" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, resolve-ref]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - name: Show build target
      run: |
        echo "Arch:       ${{ matrix.arch }}"
        echo "Formats:     ${{ join(matrix.formats, ', ') }}"
        echo "Repo:        ${{ inputs.kernel_repo }}"
        echo "Ref:         ${{ needs.resolve-ref.outputs.kernel_ref }}"
        echo "Respect cfg: ${{ inputs.respect_config }}"
        echo "Runner:      ${{ runner.os }} / ${{ runner.arch }}"

    - name: Set arch variables
      id: arch
      run: |
        case "${{ matrix.arch }}" in
          x86_64|amd64)
            echo "karch=x86_64"       >> "$GITHUB_OUTPUT"
            echo "deb_arch=amd64"     >> "$GITHUB_OUTPUT"
            echo "rpm_arch=x86_64"    >> "$GITHUB_OUTPUT"
            echo "arch_boot=arch/x86/boot/bzImage" >> "$GITHUB_OUTPUT"
            ;;
          arm64|aarch64)
            echo "karch=arm64"        >> "$GITHUB_OUTPUT"
            echo "deb_arch=arm64"     >> "$GITHUB_OUTPUT"
            echo "rpm_arch=aarch64"   >> "$GITHUB_OUTPUT"
            echo "arch_boot=arch/arm64/boot/Image" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "Unsupported arch" >&2
            exit 1
            ;;
        esac

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
        df -h /

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libncurses-dev bison flex \
          libssl-dev libelf-dev libdw-dev elfutils \
          bc dwarves zstd cpio rsync kmod xz-utils \
          dpkg-dev rpm \
          git jq curl

    - name: Clone kernel source
      run: |
        set -euo pipefail
        REF="${{ needs.resolve-ref.outputs.kernel_ref }}"
        REPO="${{ inputs.kernel_repo }}"
        echo "Cloning $REPO @ $REF ..."
        if ! git clone --depth 1 --branch "$REF" "$REPO" kernel-source; then
          echo "WARNING: shallow clone failed, retrying with full clone ..." >&2
          rm -rf kernel-source
          git clone --branch "$REF" "$REPO" kernel-source
        fi

    - name: Resolve and apply config
      run: |
        set -euo pipefail
        CHOICE="${{ inputs.config_choice }}"
        CUSTOM="${{ inputs.config_custom }}"
        KARCH="${{ steps.arch.outputs.karch }}"
        CONFIG_OUT="/tmp/kernel.config"

        if [ -n "$CUSTOM" ]; then
          CHOICE="$CUSTOM"
        fi

        if [[ "$CHOICE" == http://* ]] || [[ "$CHOICE" == https://* ]]; then
          echo "==> Source: URL: $CHOICE"
          curl -fSL "$CHOICE" -o "$CONFIG_OUT" || { echo "ERROR: download $CHOICE failed" >&2; exit 1; }
        elif [[ "$CHOICE" == make:* ]]; then
          TARGET="${CHOICE#make:}"
          echo "==> Source: kernel make target: make $TARGET"
          ( cd kernel-source && make ARCH="$KARCH" "$TARGET" && cp .config "$CONFIG_OUT" )
        elif [ -f "$CHOICE" ]; then
          echo "==> Source: repo file: $CHOICE"
          cp "$CHOICE" "$CONFIG_OUT"
        elif [ -f "configs/$CHOICE" ]; then
          echo "==> Source: repo file: configs/$CHOICE"
          cp "configs/$CHOICE" "$CONFIG_OUT"
        elif [[ "$CHOICE" =~ ^(default|allyesconfig|allmodconfig|allnoconfig|tinyconfig)$ ]]; then
          echo "==> Source: kernel built-in target: make $CHOICE"
          cd kernel-source
          make ARCH="$KARCH" "$CHOICE"
          cp .config "$CONFIG_OUT"
          cd ..
        else
          case "$CHOICE" in
            alma)     URL='https://git.almalinux.org/rpms/kernel/-/raw/c9/f/kernel-x86_64-fedora.config' ;;
            alpine)   URL='https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/linux-lts/config-lts.x86_64' ;;
            arch)     URL='https://gitlab.archlinux.org/archlinux/packaging/packages/linux/-/raw/main/config' ;;
            centos)   URL='https://gitlab.com/redhat/centos-stream/rpms/kernel/-/raw/c9s/f/kernel-x86_64-fedora.config' ;;
            debian)   URL='https://salsa.debian.org/kernel-team/linux/-/raw/debian/latest/debian/config/config' ;;
            fedora)   URL='https://src.fedoraproject.org/rpms/kernel/raw/rawhide/f/kernel-x86_64-fedora.config' ;;
            gentoo)   URL='https://gitweb.gentoo.org/proj/gentoo-kernel.git/plain/default_config' ;;
            kali)     URL='https://gitlab.com/kalilinux/packages/linux/-/raw/kali/master/debian/config/config' ;;
            manjaro)  URL='https://gitlab.manjaro.org/packages/core/linux/-/raw/master/config' ;;
            nixos)    URL='https://raw.githubusercontent.com/NixOS/nixpkgs/master/pkgs/os-specific/linux/kernel/common-config.nix' ;;
            opensuse) URL='https://raw.githubusercontent.com/openSUSE/kernel-source/master/config/x86_64/default' ;;
            rhel)     URL='https://gitlab.com/redhat/centos-stream/rpms/kernel/-/raw/c9s/f/kernel-x86_64-fedora.config' ;;
            rocky)    URL='https://git.rockylinux.org/rocky/kernel/-/raw/r9/f/kernel-x86_64-fedora.config' ;;
            ubuntu)   URL='https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/jammy/plain/debian.master/config/amd64/config.flavour.generic' ;;
            void)     URL='https://raw.githubusercontent.com/void-linux/void-packages/master/srcpkgs/linux/files/x86_64-dotconfig' ;;
            *) echo "Unknown config_choice: $CHOICE" >&2; exit 1 ;;
          esac

          # arm64 覆盖：只在明确提供时生效；否则保留原行为并给出警告
          if [ "$KARCH" = "arm64" ]; then
            ARCH_URL=""
            case "$CHOICE" in
              alma)     ARCH_URL='https://git.almalinux.org/rpms/kernel/-/raw/c9/f/kernel-aarch64-fedora.config' ;;
              alpine)   ARCH_URL='https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/linux-lts/config-lts.aarch64' ;;
              centos)   ARCH_URL='https://gitlab.com/redhat/centos-stream/rpms/kernel/-/raw/c9s/f/kernel-aarch64-fedora.config' ;;
              fedora)   ARCH_URL='https://src.fedoraproject.org/rpms/kernel/raw/rawhide/f/kernel-aarch64-fedora.config' ;;
              opensuse) ARCH_URL='https://raw.githubusercontent.com/openSUSE/kernel-source/master/config/arm64/default' ;;
              rhel)     ARCH_URL='https://gitlab.com/redhat/centos-stream/rpms/kernel/-/raw/c9s/f/kernel-aarch64-fedora.config' ;;
              rocky)    ARCH_URL='https://git.rockylinux.org/rocky/kernel/-/raw/r9/f/kernel-aarch64-fedora.config' ;;
              ubuntu)   ARCH_URL='https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/jammy/plain/debian.master/config/arm64/config.flavour.generic' ;;
              void)     ARCH_URL='https://raw.githubusercontent.com/void-linux/void-packages/master/srcpkgs/linux/files/aarch64-dotconfig' ;;
              *) ARCH_URL="" ;;
            esac
            if [ -n "$ARCH_URL" ]; then
              echo "==> arm64 override for '$CHOICE': $ARCH_URL"
              URL="$ARCH_URL"
            else
              echo "WARNING: no arm64-specific config for '$CHOICE'; using x86_64 config as-is" >&2
            fi
          fi

          echo "==> Source: distro '$CHOICE' -> $URL"
          curl -fSL "$URL" -o "$CONFIG_OUT" || { echo "ERROR: download $URL failed" >&2; exit 1; }
        fi

        [ -s "$CONFIG_OUT" ] || { echo "ERROR: empty config" >&2; exit 1; }
        echo "config lines (source): $(wc -l < "$CONFIG_OUT")"

        cd kernel-source
        cp "$CONFIG_OUT" .config

        # respect_config=true（默认）：
        #   仓库自带 / 用户提供的 .config 已经是完整且经过验证的，
        #   任何 olddefconfig 都会把未显式声明的选项按默认值展开，
        #   导致大量 =m 被悄悄打开 → 包体积从 ~50MB 膨胀到 ~200MB。
        #   因此这里什么都不做，编译时 make 会按需提示缺失项。
        #
        # respect_config=false：
        #   用于「发行版碎片 config / 跨版本 config」等不完整来源，
        #   此时才允许 olddefconfig 补全 + ld orphan 警告降级。
        if [ "${{ inputs.respect_config }}" != "true" ]; then
          echo "==> [compat] running olddefconfig (respect_config=false)"
          sed -i '/^CONFIG_LD_ORPHAN_WARN_LEVEL=/d' .config
          echo 'CONFIG_LD_ORPHAN_WARN_LEVEL="warn"' >> .config
          make ARCH="$KARCH" olddefconfig </dev/null
        else
          echo "==> [strict] .config is used as-is, no mutation"
        fi

        echo ""
        echo "════════ .config summary ════════"
        echo "config lines final : $(wc -l < .config)"
        echo "modules (=m)       : $(grep -c '=m$' .config || true)"
        echo "built-ins (=y)     : $(grep -c '=y$' .config || true)"
        echo "════════ end ══════"

    - name: Compile kernel
      run: |
        cd kernel-source
        KARCH="${{ steps.arch.outputs.karch }}"
        echo "Compiling kernel with -j$(nproc) ..."
        make ARCH="$KARCH" -j$(nproc)

    - name: Stage kernel artifacts
      id: stage
      run: |
        set -euo pipefail
        cd kernel-source
        KARCH="${{ steps.arch.outputs.karch }}"
        KIMAGE="${{ steps.arch.outputs.arch_boot }}"

        KVER="$(make ARCH="$KARCH" -s kernelrelease)"
        echo "Kernel release: $KVER"
        [ -n "$KVER" ] || { echo "ERROR: empty KERNELRELEASE" >&2; exit 1; }

        STAGE="$(mktemp -d)"
        echo "STAGE=$STAGE" >> "$GITHUB_ENV"
        echo "KVER=$KVER"   >> "$GITHUB_ENV"

        mkdir -p "$STAGE/boot"
        [ -f "$KIMAGE" ] || { echo "ERROR: image not found: $KIMAGE" >&2; exit 1; }
        cp "$KIMAGE"   "$STAGE/boot/vmlinuz-${KVER}"
        cp System.map  "$STAGE/boot/System.map-${KVER}"
        cp .config     "$STAGE/boot/config-${KVER}"

        make ARCH="$KARCH" modules_install INSTALL_MOD_PATH="$STAGE"
        rm -f "$STAGE/lib/modules/${KVER}/build" "$STAGE/lib/modules/${KVER}/source"

        echo ""
        echo "──── STAGE layout ────"
        find "$STAGE" -maxdepth 3 -type d | sort > /tmp/stage-list.txt 2>&1 || true
        head -30 /tmp/stage-list.txt || true
        echo "──── boot/ ────"
        ls -la "$STAGE/boot"

    - name: Stage headers
      id: headers
      run: |
        set -euo pipefail
        cd kernel-source
        KARCH="${{ steps.arch.outputs.karch }}"
        KVER="$KVER"

        HDR_STAGE="$(mktemp -d)"
        echo "HDR_STAGE=$HDR_STAGE" >> "$GITHUB_ENV"

        HDR_DIR="$HDR_STAGE/usr/src/linux-headers-${KVER}"
        mkdir -p "$HDR_DIR"

        echo "==> Copying headers ..."
        # 外部模块编译的硬依赖
        cp -a include "$HDR_DIR/"
        cp -a scripts "$HDR_DIR/"
        cp Makefile .config "$HDR_DIR/"
        [ -d arch ] && cp -a arch "$HDR_DIR/"

        # 补齐散落在源码树中的 arch/ 相关头文件（部分模块需要）
        find . -path './arch/*/include/*' -name '*.h' -exec cp --parents {} "$HDR_DIR/" \; 2>/dev/null || true

        echo "──── headers size ────"
        du -sh "$HDR_DIR"

    # ==================== deb：拆成 image + headers ====================
    - name: Package as deb
      if: contains(matrix.formats, 'deb')
      run: |
        set -euo pipefail
        DEB_ARCH="${{ steps.arch.outputs.deb_arch }}"
        KVER="$KVER"

        mkdir -p dist/deb

        # ---------- linux-image-<kver>：vmlinuz + System.map + config + modules ----------
        IMG_DIR="$(mktemp -d)/linux-image-${KVER}"
        mkdir -p "$IMG_DIR/DEBIAN"
        cp -a "$STAGE/boot" "$IMG_DIR/"
        cp -a "$STAGE/lib"  "$IMG_DIR/"

        cat > "$IMG_DIR/DEBIAN/control" <<EOF
        Package: linux-image-${KVER}
        Version: 1
        Section: kernel
        Priority: optional
        Architecture: ${DEB_ARCH}
        Maintainer: CI <ci@example.com>
        Description: Linux kernel ${KVER} (image + modules)
         Custom built kernel image, System.map, config and loadable modules.
        EOF

        cat > "$IMG_DIR/DEBIAN/postinst" <<'EOF'
        #!/bin/sh
        set -e
        KVER="$(basename "$(readlink -f /boot/vmlinuz-*)" | sed 's/^vmlinuz-//')"
        for v in $(ls /lib/modules 2>/dev/null); do
            depmod "$v" >/dev/null 2>&1 || :
        done
        if command -v update-initramfs >/dev/null 2>&1; then
            update-initramfs -c -k "${KVER}" >/dev/null 2>&1 || :
        fi
        EOF
        chmod 755 "$IMG_DIR/DEBIAN/postinst"

        ( cd "$IMG_DIR" && \
          find . -type f ! -path './DEBIAN/*' -exec md5sum {} + \
            | sed 's| \./| |' > DEBIAN/md5sums )

        dpkg-deb --root-owner-group --build "$IMG_DIR" \
          "dist/deb/linux-image-${KVER}_1_${DEB_ARCH}.deb"

        # ---------- linux-headers-<kver>：headers + scripts + Makefile ----------
        HDR_DIR_DEB="$(mktemp -d)/linux-headers-${KVER}"
        mkdir -p "$HDR_DIR_DEB/DEBIAN"
        cp -a "$HDR_STAGE/usr" "$HDR_DIR_DEB/usr"

        cat > "$HDR_DIR_DEB/DEBIAN/control" <<EOF
        Package: linux-headers-${KVER}
        Version: 1
        Section: kernel
        Priority: optional
        Architecture: ${DEB_ARCH}
        Maintainer: CI <ci@example.com>
        Description: Linux kernel headers for ${KVER}
         Header files required to build out-of-tree kernel modules.
        EOF

        ( cd "$HDR_DIR_DEB" && \
          find . -type f ! -path './DEBIAN/*' -exec md5sum {} + \
            | sed 's| \./| |' > DEBIAN/md5sums )

        dpkg-deb --root-owner-group --build "$HDR_DIR_DEB" \
          "dist/deb/linux-headers-${KVER}_1_${DEB_ARCH}.deb"

        echo "──── deb artifacts ────"
        ls -lh dist/deb/

    # ==================== rpm：拆成 image + headers ====================
    - name: Package as rpm
      if: contains(matrix.formats, 'rpm')
      run: |
        set -euo pipefail
        RPM_ARCH="${{ steps.arch.outputs.rpm_arch }}"
        KVER="$KVER"
        RPM_VERSION="$(echo "$KVER" | tr '-' '.')"

        RPM_DIR="$(mktemp -d)"
        mkdir -p "$RPM_DIR"/{BUILD,RPMS,SOURCES,SPECS,BUILDROOT}

        # ---------- kernel-image ----------
        cat > "$RPM_DIR/SPECS/kernel-image.spec" <<EOF
        Name:           kernel-image
        Version:        ${RPM_VERSION}
        Release:        1
        Summary:        Linux kernel ${KVER} (image + modules)
        License:        GPL-2.0-only
        AutoReqProv:    no
        BuildArch:      ${RPM_ARCH}

        %global __strip /bin/true
        %global __os_install_post %{nil}

        %description
        Custom Linux kernel ${KVER}: vmlinuz, System.map, config and modules.

        %install
        mkdir -p %{buildroot}
        cp -a ${STAGE}/. %{buildroot}/

        %files
        /boot/vmlinuz-*
        /boot/System.map-*
        /boot/config-*
        /lib/modules/*

        %post
        for v in $(ls /lib/modules 2>/dev/null); do
            /sbin/depmod "$v" >/dev/null 2>&1 || :
        done
        EOF

        rpmbuild --define "_topdir $RPM_DIR" -bb "$RPM_DIR/SPECS/kernel-image.spec"

        # ---------- kernel-headers ----------
        cat > "$RPM_DIR/SPECS/kernel-headers.spec" <<EOF
        Name:           kernel-headers
        Version:        ${RPM_VERSION}
        Release:        1
        Summary:        Linux kernel headers for ${KVER}
        License:        GPL-2.0-only
        AutoReqProv:    no
        BuildArch:      ${RPM_ARCH}

        %global __strip /bin/true
        %global __os_install_post %{nil}

        %description
        Header files required to build out-of-tree kernel modules
        against kernel ${KVER}.

        %install
        mkdir -p %{buildroot}
        cp -a ${HDR_STAGE}/. %{buildroot}/

        %files
        /usr/src/linux-headers-${KVER}
        EOF

        rpmbuild --define "_topdir $RPM_DIR" -bb "$RPM_DIR/SPECS/kernel-headers.spec"

        mkdir -p dist/rpm
        find "$RPM_DIR/RPMS" -name '*.rpm' -exec cp {} dist/rpm/ \;

        echo "──── rpm artifacts ────"
        ls -lh dist/rpm/

    # ==================== tar.xz：保持通用单包 + 安装/卸载脚本 ====================
    - name: Prepare tarxz helper templates
      if: contains(matrix.formats, 'tarxz')
      run: |
        mkdir -p /tmp/tarxz-helpers

        cat > /tmp/tarxz-helpers/install.sh.tpl <<'TPL_INSTALL_EOF'
        #!/bin/sh
        # Auto-generated installer for kernel __KVER__
        # POSIX-compatible: sh, bash, dash, ash, ksh, zsh

        set -e

        KVER="__KVER__"
        SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"

        usage() {
            echo "Usage: $0 [options]"
            echo ""
            echo "Install kernel $KVER to /boot and /lib/modules."
            echo ""
            echo "Options:"
            echo "  -h, --help    Show this help"
            exit 0
        }

        for arg in "$@"; do
            case "$arg" in
                -h|--help) usage ;;
                *) echo "Unknown option: $arg" >&2; usage ;;
            esac
        done

        if [ "$(id -u)" != "0" ]; then
            echo "ERROR: this script must be run as root" >&2
            echo "Try: sudo $0" >&2
            exit 1
        fi

        if [ ! -d "$SCRIPT_DIR/boot" ]; then
            echo "ERROR: $SCRIPT_DIR/boot not found" >&2
            exit 1
        fi

        echo "==> Installing boot files to /boot ..."
        mkdir -p /boot
        for f in "$SCRIPT_DIR"/boot/*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            echo "    /boot/$name"
            cp -a "$f" "/boot/$name"
        done

        MODSRC="$SCRIPT_DIR/lib/modules/$KVER"
        if [ -d "$MODSRC" ]; then
            echo "==> Installing modules to /lib/modules/$KVER ..."
            mkdir -p /lib/modules
            rm -rf "/lib/modules/$KVER"
            cp -a "$MODSRC" "/lib/modules/$KVER"
            if command -v depmod >/dev/null 2>&1; then
                depmod "$KVER" || echo "WARNING: depmod failed" >&2
            fi
        fi

        echo "==> Updating bootloader (best-effort) ..."
        if command -v update-grub >/dev/null 2>&1; then
            update-grub || true
        elif command -v grub-mkconfig >/dev/null 2>&1; then
            grub-mkconfig -o /boot/grub/grub.cfg || true
        elif command -v grub2-mkconfig >/dev/null 2>&1; then
            grub2-mkconfig -o /boot/grub2/grub.cfg || true
        elif [ -d /boot/loader/entries ] && command -v bootctl >/dev/null 2>&1; then
            bootctl update || true
        fi

        echo ""
        echo "==> Kernel $KVER installed successfully."
        TPL_INSTALL_EOF

        cat > /tmp/tarxz-helpers/uninstall.sh.tpl <<'TPL_UNINSTALL_EOF'
        #!/bin/sh
        # Auto-generated uninstaller for kernel __KVER__
        # POSIX-compatible: sh, bash, dash, ash, ksh, zsh

        set -e

        KVER="__KVER__"
        SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"

        usage() {
            echo "Usage: $0 [options]"
            echo ""
            echo "Remove kernel $KVER from /boot and /lib/modules."
            echo ""
            echo "Options:"
            echo "  -h, --help    Show this help"
            echo "  -y, --yes     Do not ask for confirmation"
            exit 0
        }

        ASSUME_YES=0
        for arg in "$@"; do
            case "$arg" in
                -h|--help) usage ;;
                -y|--yes) ASSUME_YES=1 ;;
                *) echo "Unknown option: $arg" >&2; usage ;;
            esac
        done

        if [ "$(id -u)" != "0" ]; then
            echo "ERROR: this script must be run as root" >&2
            echo "Try: sudo $0" >&2
            exit 1
        fi

        CURRENT="$(uname -r)"
        case "$CURRENT" in
            "$KVER"|"$KVER".*)
                echo "WARNING: you are currently running kernel $CURRENT" >&2
                if [ "$ASSUME_YES" != "1" ]; then
                    printf "Continue removing kernel %s? [y/N] " "$KVER" >&2
                    read -r answer
                    case "$answer" in
                        y|Y|yes|YES) ;;
                        *) echo "Aborted."; exit 1 ;;
                    esac
                fi
                ;;
        esac

        if [ -d "$SCRIPT_DIR/boot" ]; then
            for f in "$SCRIPT_DIR"/boot/*; do
                [ -f "$f" ] || continue
                name="$(basename "$f")"
                if [ -f "/boot/$name" ]; then
                    echo "    /boot/$name"
                    rm -f "/boot/$name"
                fi
            done
        fi

        if [ -d "/lib/modules/$KVER" ]; then
            echo "==> Removing /lib/modules/$KVER"
            rm -rf "/lib/modules/$KVER"
        fi

        if command -v update-grub >/dev/null 2>&1; then
            update-grub || true
        elif command -v grub-mkconfig >/dev/null 2>&1; then
            grub-mkconfig -o /boot/grub/grub.cfg || true
        elif command -v grub2-mkconfig >/dev/null 2>&1; then
            grub2-mkconfig -o /boot/grub2/grub.cfg || true
        elif [ -d /boot/loader/entries ] && command -v bootctl >/dev/null 2>&1; then
            bootctl update || true
        fi

        echo ""
        echo "==> Kernel $KVER uninstalled."
        TPL_UNINSTALL_EOF

        cat > /tmp/tarxz-helpers/README.md.tpl <<'TPL_README_EOF'
        # Linux Kernel __KVER__ (__ARCH__)

        ## Content

            boot/vmlinuz-__KVER__
            boot/System.map-__KVER__
            boot/config-__KVER__
            lib/modules/__KVER__/
            install-__KVER__.sh
            uninstall-__KVER__.sh
            README.md

        ## Install

            sudo ./install-__KVER__.sh

        ## Uninstall

            sudo ./uninstall-__KVER__.sh
            # or skip confirmation
            sudo ./uninstall-__KVER__.sh -y

        **Never touches any other kernel.**
        TPL_README_EOF

        ls -la /tmp/tarxz-helpers/

    - name: Package as tar.xz
      if: contains(matrix.formats, 'tarxz')
      run: |
        set -euo pipefail
        ARCH="${{ matrix.arch }}"
        KVER="$KVER"

        STAGE_PARENT="$(mktemp -d)"
        PKG_DIR="linux-${KVER}-${ARCH}"
        PKG_ROOT="$STAGE_PARENT/$PKG_DIR"
        mkdir -p "$PKG_ROOT"

        cp -a "$STAGE/boot" "$PKG_ROOT/"
        cp -a "$STAGE/lib"  "$PKG_ROOT/"

        TPL_DIR=/tmp/tarxz-helpers
        [ -d "$TPL_DIR" ] || { echo "FATAL: templates not found" >&2; exit 1; }

        sed "s/__KVER__/${KVER}/g" "$TPL_DIR/install.sh.tpl"   > "$PKG_ROOT/install-${KVER}.sh"
        sed "s/__KVER__/${KVER}/g" "$TPL_DIR/uninstall.sh.tpl" > "$PKG_ROOT/uninstall-${KVER}.sh"
        sed -e "s/__KVER__/${KVER}/g" -e "s/__ARCH__/${ARCH}/g" \
          "$TPL_DIR/README.md.tpl" > "$PKG_ROOT/README.md"

        chmod 755 "$PKG_ROOT/install-${KVER}.sh" "$PKG_ROOT/uninstall-${KVER}.sh"

        mkdir -p dist/tarxz
        OUTNAME="linux-${KVER}-${ARCH}.tar.xz"
        ( cd "$STAGE_PARENT" && tar --owner=0 --group=0 -cJf "$OLDPWD/dist/tarxz/$OUTNAME" "$PKG_DIR" )

        echo "──── tar.xz contents (first 20 entries) ────"
        tar -tJf "dist/tarxz/$OUTNAME" > /tmp/tarxz-list.txt 2>&1 || true
        head -20 /tmp/tarxz-list.txt || true
        ls -lh "dist/tarxz/$OUTNAME"

    # ==================== pkg.tar.zst：拆成 image + headers ====================
    - name: Package as pkg.tar.zst
      if: contains(matrix.formats, 'pkg')
      run: |
        set -euo pipefail
        ARCH="${{ matrix.arch }}"
        KVER="$KVER"

        mkdir -p dist/pkg

        # ---------- linux-image ----------
        IMG_ROOT="$(mktemp -d)"
        cp -a "$STAGE/boot" "$IMG_ROOT/"
        cp -a "$STAGE/lib"  "$IMG_ROOT/"

        cat > "$IMG_ROOT/.PKGINFO" <<EOF
        pkgname = linux-image
        pkgbase = linux
        pkgver = ${KVER}-1
        pkgdesc = Linux kernel ${KVER} (image + modules)
        url = https://kernel.org
        builddate = $(date +%s)
        packager = CI <ci@example.com>
        size = $(du -sb "$IMG_ROOT" | cut -f1)
        arch = ${ARCH}
        license = GPL-2.0-only
        EOF

        cat > "$IMG_ROOT/.INSTALL" <<EOF
        post_install() {
            for v in $(ls /lib/modules 2>/dev/null); do
                /sbin/depmod "$v" >/dev/null 2>&1 || :
            done
        }
        post_upgrade() { post_install; }
        EOF

        ( cd "$IMG_ROOT" && tar --owner=0 --group=0 -cf - . \
          | zstd -T0 -19 -o "$OLDPWD/dist/pkg/linux-image-${KVER}-1-${ARCH}.pkg.tar.zst" -f )

        # ---------- linux-headers ----------
        HDR_ROOT="$(mktemp -d)"
        cp -a "$HDR_STAGE/usr" "$HDR_ROOT/usr"

        cat > "$HDR_ROOT/.PKGINFO" <<EOF
        pkgname = linux-headers
        pkgbase = linux
        pkgver = ${KVER}-1
        pkgdesc = Linux kernel headers for ${KVER}
        url = https://kernel.org
        builddate = $(date +%s)
        packager = CI <ci@example.com>
        size = $(du -sb "$HDR_ROOT" | cut -f1)
        arch = ${ARCH}
        license = GPL-2.0-only
        EOF

        ( cd "$HDR_ROOT" && tar --owner=0 --group=0 -cf - . \
          | zstd -T0 -19 -o "$OLDPWD/dist/pkg/linux-headers-${KVER}-1-${ARCH}.pkg.tar.zst" -f )

        echo "──── pkg.tar.zst artifacts ────"
        ls -lh dist/pkg/

    - name: Collect artifacts
      if: always() && !cancelled()
      run: |
        echo "──── dist tree ────"
        find dist -type f 2>/dev/null || echo "(empty)"

    - name: Upload deb artifacts
      if: always() && !cancelled() && contains(matrix.formats, 'deb') && hashFiles('dist/deb/**') != ''
      uses: actions/upload-artifact@v4
      with:
        name: kernel-deb-${{ matrix.arch }}
        path: dist/deb/*
        if-no-files-found: warn
        retention-days: 7

    - name: Upload rpm artifacts
      if: always() && !cancelled() && contains(matrix.formats, 'rpm') && hashFiles('dist/rpm/**') != ''
      uses: actions/upload-artifact@v4
      with:
        name: kernel-rpm-${{ matrix.arch }}
        path: dist/rpm/*
        if-no-files-found: warn
        retention-days: 7

    - name: Upload tar.xz artifacts
      if: always() && !cancelled() && contains(matrix.formats, 'tarxz') && hashFiles('dist/tarxz/**') != ''
      uses: actions/upload-artifact@v4
      with:
        name: kernel-tarxz-${{ matrix.arch }}
        path: dist/tarxz/*
        if-no-files-found: warn
        retention-days: 7

    - name: Upload pkg.tar.zst artifacts
      if: always() && !cancelled() && contains(matrix.formats, 'pkg') && hashFiles('dist/pkg/**') != ''
      uses: actions/upload-artifact@v4
      with:
        name: kernel-pkg-${{ matrix.arch }}
        path: dist/pkg/*
        if-no-files-found: warn
        retention-days: 7

  publish:
    needs: build
    if: inputs.release_tag != '' && !cancelled()
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kernel-*
          merge-multiple: true
      - run: |
          ls -lh dist/
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: dist/*
          generate_release_notes: true
          overwrite_files: true
