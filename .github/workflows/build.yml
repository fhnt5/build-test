name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      x86_64_deb:   { description: 'x86_64  ›  deb', type: boolean, default: true }
      x86_64_rpm:   { description: 'x86_64  ›  rpm', type: boolean, default: false }
      x86_64_tarxz: { description: 'x86_64  ›  tar.xz（自带 install/uninstall/README，无容器）', type: boolean, default: false }
      arm64_deb:    { description: 'arm64   ›  deb', type: boolean, default: false }
      arm64_rpm:    { description: 'arm64   ›  rpm', type: boolean, default: false }
      arm64_tarxz:  { description: 'arm64   ›  tar.xz（自带 install/uninstall/README，无容器）', type: boolean, default: false }
      config_choice:
        description: '内核配置来源：内核自带目标 / 仓库 configs/* / 发行版'
        type: choice
        required: true
        default: 'default'
        options:
          - 'default'
          - 'allyesconfig'
          - 'allmodconfig'
          - 'allnoconfig'
          - 'tinyconfig'
          - 'configs/G40_45.config'
          - 'alma'
          - 'alpine'
          - 'arch'
          - 'centos'
          - 'debian'
          - 'fedora'
          - 'gentoo'
          - 'kali'
          - 'manjaro'
          - 'nixos'
          - 'opensuse'
          - 'rhel'
          - 'rocky'
          - 'ubuntu'
          - 'void'
      config_custom:
        description: '（可选）自定义配置：仓库内路径 / http(s):// URL。填了则覆盖上面的选择'
        type: string
        required: false
        default: ''
      kernel_repo:
        description: '内核源码仓库 URL'
        required: true
        default: 'https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git'
      kernel_ref:
        description: '分支或 tag（如 v7.2.6 / master）。留空则自动使用最新 stable 版本'
        required: false
        default: ''
      release_tag:
        description: '（可选）完成后发布到该 tag 的 Release，留空则不发布'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: gen
        run: |
          MATRIX='{"include":[]}'
          add() {
            MATRIX=$(echo "$MATRIX" | jq -c --arg a "$1" --arg f "$2" \
              '.include += [{arch:$a, format:$f}]')
          }
          [ "${{ inputs.x86_64_deb }}"   = "true" ] && add x86_64 deb
          [ "${{ inputs.x86_64_rpm }}"   = "true" ] && add x86_64 rpm
          [ "${{ inputs.x86_64_tarxz }}" = "true" ] && add x86_64 tarxz
          [ "${{ inputs.arm64_deb }}"    = "true" ] && add arm64  deb
          [ "${{ inputs.arm64_rpm }}"    = "true" ] && add arm64  rpm
          [ "${{ inputs.arm64_tarxz }}"  = "true" ] && add arm64  tarxz
          COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "MATRIX = $MATRIX"
          [ "$COUNT" -eq 0 ] && { echo "No build target selected." >&2; exit 1; }
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      kernel_ref: ${{ steps.resolve.outputs.kernel_ref }}
    steps:
      - name: Resolve kernel ref
        id: resolve
        run: |
          INPUT_REF="${{ inputs.kernel_ref }}"
          if [ -n "$INPUT_REF" ]; then
            echo "kernel_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else
            LATEST=$(git ls-remote --tags --refs --sort=-v:refname \
              https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git \
              | awk -F/ '{print $NF}' \
              | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | head -1)
            [ -z "$LATEST" ] && { echo "ERROR: failed to detect" >&2; exit 1; }
            echo "kernel_ref=$LATEST" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [prepare, resolve-ref]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - name: Show build target
      run: |
        echo "Arch:   ${{ matrix.arch }}"
        echo "Format: ${{ matrix.format }}"
        echo "Ref:    ${{ needs.resolve-ref.outputs.kernel_ref }}"
        echo "Runner: ${{ runner.os }} / ${{ runner.arch }}"

    - name: Set arch variables
      id: arch
      run: |
        case "${{ matrix.arch }}" in
          x86_64|amd64)
            echo "karch=x86_64"   >> "$GITHUB_OUTPUT"
            echo "deb_arch=amd64" >> "$GITHUB_OUTPUT"
            echo "carch=x86_64"   >> "$GITHUB_OUTPUT"
            ;;
          arm64|aarch64)
            echo "karch=arm64"    >> "$GITHUB_OUTPUT"
            echo "deb_arch=arm64" >> "$GITHUB_OUTPUT"
            echo "carch=aarch64"  >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "Unsupported arch" >&2
            exit 1
            ;;
        esac

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
        df -h /

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libncurses-dev bison flex \
          libssl-dev libelf-dev libdw-dev elfutils \
          bc dwarves zstd cpio rsync kmod xz-utils \
          git jq curl
        case "${{ matrix.format }}" in
          deb) sudo apt-get install -y debhelper fakeroot ;;
          rpm) sudo apt-get install -y rpm rpm2cpio cpio ;;
        esac

    - name: Clone kernel source
      run: |
        git clone --depth 1 --branch "${{ needs.resolve-ref.outputs.kernel_ref }}" \
          "${{ inputs.kernel_repo }}" kernel-source

    - name: Resolve and apply config
      run: |
        CHOICE="${{ inputs.config_choice }}"
        CUSTOM="${{ inputs.config_custom }}"
        KARCH="${{ steps.arch.outputs.karch }}"
        CONFIG_OUT="/tmp/kernel.config"

        [ -n "$CUSTOM" ] && CHOICE="$CUSTOM"

        if [[ "$CHOICE" == http://* ]] || [[ "$CHOICE" == https://* ]]; then
          echo "==> Source: URL: $CHOICE"
          curl -fSL "$CHOICE" -o "$CONFIG_OUT"
          echo "CONFIG_SOURCE=$CHOICE" >> "$GITHUB_ENV"

        elif [ -f "$CHOICE" ]; then
          echo "==> Source: repo file: $CHOICE"
          cp "$CHOICE" "$CONFIG_OUT"
          echo "CONFIG_SOURCE=$CHOICE" >> "$GITHUB_ENV"

        elif [ -f "configs/$CHOICE" ]; then
          echo "==> Source: repo file: configs/$CHOICE"
          cp "configs/$CHOICE" "$CONFIG_OUT"
          echo "CONFIG_SOURCE=configs/$CHOICE" >> "$GITHUB_ENV"

        elif [[ "$CHOICE" =~ ^(default|allyesconfig|allmodconfig|allnoconfig|tinyconfig)$ ]]; then
          echo "==> Source: kernel built-in target: make $CHOICE"
          cd kernel-source
          make ARCH="$KARCH" "$CHOICE"
          cp .config "$CONFIG_OUT"
          cd ..
          echo "CONFIG_SOURCE=kernel built-in: $CHOICE" >> "$GITHUB_ENV"

        else
          case "$CHOICE" in
            alma)     URL='https://git.almalinux.org/rpms/kernel/-/raw/c9/f/kernel-x86_64-fedora.config' ;;
            alpine)   URL='https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/linux-lts/config-lts.x86_64' ;;
            arch)     URL='https://gitlab.archlinux.org/archlinux/packaging/packages/linux/-/raw/main/config' ;;
            centos)   URL='https://gitlab.com/redhat/centos-stream/rpms/kernel/-/raw/c9s/f/kernel-x86_64-fedora.config' ;;
            debian)   URL='https://salsa.debian.org/kernel-team/linux/-/raw/debian/latest/debian/config/config' ;;
            fedora)   URL='https://src.fedoraproject.org/rpms/kernel/raw/rawhide/f/kernel-x86_64-fedora.config' ;;
            gentoo)   URL='https://gitweb.gentoo.org/proj/gentoo-kernel.git/plain/default_config' ;;
            kali)     URL='https://gitlab.com/kalilinux/packages/linux/-/raw/kali/master/debian/config/config' ;;
            manjaro)  URL='https://gitlab.manjaro.org/packages/core/linux/-/raw/master/config' ;;
            nixos)    URL='https://raw.githubusercontent.com/NixOS/nixpkgs/master/pkgs/os-specific/linux/kernel/common-config.nix' ;;
            opensuse) URL='https://raw.githubusercontent.com/openSUSE/kernel-source/master/config/x86_64/default' ;;
            rhel)     URL='https://gitlab.com/redhat/centos-stream/rpms/kernel/-/raw/c9s/f/kernel-x86_64-fedora.config' ;;
            rocky)    URL='https://git.rockylinux.org/rocky/kernel/-/raw/r9/f/kernel-x86_64-fedora.config' ;;
            ubuntu)   URL='https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/jammy/plain/debian.master/config/amd64/config.flavour.generic' ;;
            void)     URL='https://raw.githubusercontent.com/void-linux/void-packages/master/srcpkgs/linux/files/x86_64-dotconfig' ;;
            *) echo "Unknown config_choice: $CHOICE" >&2; exit 1 ;;
          esac
          echo "==> Source: distro '$CHOICE' -> $URL"
          curl -fSL "$URL" -o "$CONFIG_OUT" || { echo "ERROR: download $URL failed" >&2; exit 1; }
          echo "CONFIG_SOURCE=$CHOICE ($URL)" >> "$GITHUB_ENV"
        fi

        [ -s "$CONFIG_OUT" ] || { echo "ERROR: empty config" >&2; exit 1; }
        echo "config lines: $(wc -l < "$CONFIG_OUT")"

        cd kernel-source
        cp "$CONFIG_OUT" .config
        make ARCH="$KARCH" olddefconfig

    - name: Build kernel packages (deb / rpm)
      if: matrix.format == 'deb' || matrix.format == 'rpm'
      run: |
        cd kernel-source
        case "${{ matrix.format }}" in
          deb)
            make ARCH=${{ steps.arch.outputs.karch }} \
                 KDEB_ARCH=${{ steps.arch.outputs.deb_arch }} \
                 KDEB_OPTS="-a${{ steps.arch.outputs.deb_arch }}" \
                 DEB_EXCLUDE_PKG="linux-libc-dev linux-image-%-dbg" \
                 -j$(nproc) bindeb-pkg
            ;;
          rpm)
            make ARCH=${{ steps.arch.outputs.karch }} \
                 KCFLAGS="-g0" \
                 RPM_BUILD_NCPUS=$(nproc) \
                 RPMOPTS="--define '_topdir $PWD/rpmbuild'" \
                 -j$(nproc) binrpm-pkg
            ;;
        esac

    - name: Prepare tarxz helper templates
      if: matrix.format == 'tarxz'
      run: |
        mkdir -p /tmp/tarxz-helpers

        cat > /tmp/tarxz-helpers/install.sh.tpl <<'TPL_INSTALL_EOF'
        #!/bin/sh
        # Auto-generated installer for kernel __KVER__
        # Works with any POSIX-compatible shell: sh, bash, dash, ash, ksh, zsh

        set -e

        KVER="__KVER__"
        SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"

        usage() {
            echo "Usage: $0 [options]"
            echo ""
            echo "Install kernel $KVER to /boot and /lib/modules."
            echo ""
            echo "Options:"
            echo "  -h, --help    Show this help"
            exit 0
        }

        for arg in "$@"; do
            case "$arg" in
                -h|--help) usage ;;
                *) echo "Unknown option: $arg" >&2; usage ;;
            esac
        done

        if [ "$(id -u)" != "0" ]; then
            echo "ERROR: this script must be run as root" >&2
            echo "Try: sudo $0" >&2
            exit 1
        fi

        if [ ! -d "$SCRIPT_DIR/boot" ]; then
            echo "ERROR: $SCRIPT_DIR/boot not found" >&2
            exit 1
        fi

        echo "==> Installing boot files to /boot ..."
        mkdir -p /boot
        for f in "$SCRIPT_DIR"/boot/*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            echo "    /boot/$name"
            cp -a "$f" "/boot/$name"
        done

        MODSRC="$SCRIPT_DIR/lib/modules/$KVER"
        if [ -d "$MODSRC" ]; then
            echo "==> Installing modules to /lib/modules/$KVER ..."
            mkdir -p /lib/modules
            rm -rf "/lib/modules/$KVER"
            cp -a "$MODSRC" "/lib/modules/$KVER"
            if command -v depmod >/dev/null 2>&1; then
                depmod "$KVER" || echo "WARNING: depmod failed" >&2
            fi
        fi

        echo "==> Updating bootloader (best-effort) ..."
        if command -v update-grub >/dev/null 2>&1; then
            update-grub || true
        elif command -v grub-mkconfig >/dev/null 2>&1; then
            grub-mkconfig -o /boot/grub/grub.cfg || true
        elif command -v grub2-mkconfig >/dev/null 2>&1; then
            grub2-mkconfig -o /boot/grub2/grub.cfg || true
        elif [ -d /boot/loader/entries ] && command -v bootctl >/dev/null 2>&1; then
            bootctl update || true
        fi

        echo ""
        echo "==> Kernel $KVER installed successfully."
        TPL_INSTALL_EOF

        cat > /tmp/tarxz-helpers/uninstall.sh.tpl <<'TPL_UNINSTALL_EOF'
        #!/bin/sh
        # Auto-generated uninstaller for kernel __KVER__
        # Works with any POSIX-compatible shell: sh, bash, dash, ash, ksh, zsh

        set -e

        KVER="__KVER__"
        SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"

        usage() {
            echo "Usage: $0 [options]"
            echo ""
            echo "Remove kernel $KVER from /boot and /lib/modules."
            echo ""
            echo "Options:"
            echo "  -h, --help    Show this help"
            echo "  -y, --yes     Do not ask for confirmation"
            exit 0
        }

        ASSUME_YES=0
        for arg in "$@"; do
            case "$arg" in
                -h|--help) usage ;;
                -y|--yes) ASSUME_YES=1 ;;
                *) echo "Unknown option: $arg" >&2; usage ;;
            esac
        done

        if [ "$(id -u)" != "0" ]; then
            echo "ERROR: this script must be run as root" >&2
            echo "Try: sudo $0" >&2
            exit 1
        fi

        CURRENT="$(uname -r)"
        case "$CURRENT" in
            "$KVER"|"$KVER".*)
                echo "WARNING: you are currently running kernel $CURRENT" >&2
                if [ "$ASSUME_YES" != "1" ]; then
                    printf "Continue removing kernel %s? [y/N] " "$KVER" >&2
                    read -r answer
                    case "$answer" in
                        y|Y|yes|YES) ;;
                        *) echo "Aborted."; exit 1 ;;
                    esac
                fi
                ;;
        esac

        if [ -d "$SCRIPT_DIR/boot" ]; then
            for f in "$SCRIPT_DIR"/boot/*; do
                [ -f "$f" ] || continue
                name="$(basename "$f")"
                if [ -f "/boot/$name" ]; then
                    echo "    /boot/$name"
                    rm -f "/boot/$name"
                fi
            done
        fi

        if [ -d "/lib/modules/$KVER" ]; then
            echo "==> Removing /lib/modules/$KVER"
            rm -rf "/lib/modules/$KVER"
        fi

        if command -v update-grub >/dev/null 2>&1; then
            update-grub || true
        elif command -v grub-mkconfig >/dev/null 2>&1; then
            grub-mkconfig -o /boot/grub/grub.cfg || true
        elif command -v grub2-mkconfig >/dev/null 2>&1; then
            grub2-mkconfig -o /boot/grub2/grub.cfg || true
        elif [ -d /boot/loader/entries ] && command -v bootctl >/dev/null 2>&1; then
            bootctl update || true
        fi

        echo ""
        echo "==> Kernel $KVER uninstalled."
        TPL_UNINSTALL_EOF

        cat > /tmp/tarxz-helpers/README.md.tpl <<'TPL_README_EOF'
        # Linux Kernel __KVER__ (__ARCH__)

        ## Content

            boot/vmlinuz-__KVER__
            boot/System.map-__KVER__
            boot/config-__KVER__
            lib/modules/__KVER__/
            install-__KVER__.sh
            uninstall-__KVER__.sh
            README.md

        ## Install

            sudo ./install-__KVER__.sh

        ## Uninstall

            sudo ./uninstall-__KVER__.sh
            # or skip confirmation
            sudo ./uninstall-__KVER__.sh -y

        **Never touches any other kernel.**
        TPL_README_EOF

        ls -la /tmp/tarxz-helpers/

    - name: Build kernel packages (tar.xz)
      if: matrix.format == 'tarxz'
      run: |
        set -euo pipefail
        cd kernel-source

        KARCH="${{ steps.arch.outputs.karch }}"
        ARCH="${{ matrix.arch }}"

        KCONF_ENABLE="CONFIG_DEBUG_KERNEL CONFIG_DEBUG_INFO CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT CONFIG_DEBUG_INFO_COMPRESSED_NONE CONFIG_DEBUG_INFO_BTF CONFIG_DEBUG_INFO_BTF_MODULES CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL CONFIG_EXPERT"
        KCONF_DISABLE="CONFIG_DEBUG_INFO_NONE CONFIG_DEBUG_INFO_SPLIT CONFIG_DEBUG_INFO_REDUCED CONFIG_DEBUG_INFO_COMPRESSED_ZLIB CONFIG_DEBUG_INFO_COMPRESSED_ZSTD CONFIG_GCC_PLUGIN_RANDSTRUCT CONFIG_WERROR"
        KCONF_GREP='DEBUG_INFO|BTF|RANDSTRUCT|WERROR|ORPHAN_WARN|DEBUG_KERNEL|EXPERT|KALLSYMS|PAHOLE'

        fix_kconfig() {
          local f="$1"
          for opt in $KCONF_ENABLE; do
            sed -i "/^# ${opt} is not set/d" "$f"
            sed -i "/^${opt}=/d" "$f"
            echo "${opt}=y" >> "$f"
          done
          for opt in $KCONF_DISABLE; do
            sed -i "/^${opt}=/d" "$f"
            sed -i "/^# ${opt} is not set/d" "$f"
            echo "# ${opt} is not set" >> "$f"
          done
          sed -i '/^CONFIG_LD_ORPHAN_WARN_LEVEL=/d' "$f"
          echo 'CONFIG_LD_ORPHAN_WARN_LEVEL="warn"' >> "$f"
        }

        check_kconfig() {
          local f="$1" fail=0
          for opt in CONFIG_DEBUG_KERNEL CONFIG_DEBUG_INFO CONFIG_DEBUG_INFO_BTF; do
            grep -q "^${opt}=y" "$f" || { echo "MISSING: ${opt}=y" >&2; fail=1; }
          done
          for opt in $KCONF_DISABLE; do
            grep -q "^${opt}=y" "$f" && { echo "BAD: ${opt}=y" >&2; fail=1; }
          done
          grep -q '^CONFIG_LD_ORPHAN_WARN_LEVEL="error"' "$f" && { echo "BAD: LD_ORPHAN_WARN_LEVEL=error" >&2; fail=1; }
          return $fail
        }

        cp /tmp/kernel.config .config
        fix_kconfig .config

        echo "════════ .config AFTER fix (BTF/DEBUG lines) ════════"
        grep -nE "$KCONF_GREP" .config || echo "(no matches)"

        if ! check_kconfig .config; then
          echo "FATAL: kconfig check failed before olddefconfig" >&2
          exit 1
        fi

        grep -E "$KCONF_GREP" .config | sort > /tmp/kconfig-before.txt

        echo ""
        echo "════════ make olddefconfig (non-interactive) ════════"
        make ARCH="$KARCH" olddefconfig </dev/null

        grep -E "$KCONF_GREP" .config | sort > /tmp/kconfig-after.txt

        echo ""
        echo "════════ DIFF: olddefconfig BEFORE vs AFTER ════════"
        if diff /tmp/kconfig-before.txt /tmp/kconfig-after.txt; then
          echo "(no differences)"
        fi
        echo "════════ end diff ════════"

        echo ""
        echo "════════ PAHOLE / BTF dependency diagnostics ════════"
        echo "[A] scripts/pahole* files:"
        ls -la scripts/pahole* 2>/dev/null || echo "(no pahole* files in scripts/)"
        echo ""
        echo "[B] scripts/pahole-version.sh content:"
        if [ -f scripts/pahole-version.sh ]; then
          cat scripts/pahole-version.sh
        else
          echo "(file not found)"
        fi
        echo ""
        echo "[C] Direct call of scripts/pahole-version.sh:"
        if [ -f scripts/pahole-version.sh ]; then
          bash scripts/pahole-version.sh pahole 2>&1 || echo "(call failed)"
        fi
        echo ""
        echo "[D] .config PAHOLE lines:"
        grep -n "PAHOLE" .config || echo "(not found)"
        echo ""
        echo "[E] lib/Kconfig.debug: config DEBUG_INFO_BTF + 30 lines after:"
        grep -n -A 30 '^config DEBUG_INFO_BTF$' lib/Kconfig.debug 2>/dev/null || echo "(not found)"
        echo ""
        echo "[E2] lib/Kconfig.debug: config DEBUG_INFO_BTF_MODULES + 30 lines after:"
        grep -n -A 30 '^config DEBUG_INFO_BTF_MODULES$' lib/Kconfig.debug 2>/dev/null || echo "(not found)"
        echo ""
        echo "[F] lib/Kconfig.debug: PAHOLE_VERSION references:"
        grep -n "PAHOLE_VERSION" lib/Kconfig.debug 2>/dev/null || echo "(not found)"
        echo "════════ end PAHOLE / BTF diagnostics ════════"

        if ! check_kconfig .config; then
          echo "FATAL: BTF config was stripped by olddefconfig" >&2
          grep -nE "$KCONF_GREP" .config >&2
          exit 1
        fi
        echo "kconfig OK after olddefconfig."

        KVER="$(make ARCH="$KARCH" -s kernelrelease)"
        echo "Kernel release: $KVER"
        [ -n "$KVER" ] || { echo "ERROR: empty KERNELRELEASE" >&2; exit 1; }

        echo ""
        echo "════════ make tarxz-pkg ════════"
        make ARCH="$KARCH" tarxz-pkg -j$(nproc)

        TARBALL="linux-${KVER}.tar.xz"
        [ -f "$TARBALL" ] || { echo "ERROR: tarball not found: $TARBALL" >&2; ls -la *.tar* 2>/dev/null || true; exit 1; }
        echo "Generated: $TARBALL"

        STAGE_PARENT="$(mktemp -d)"
        PKG_DIR="linux-${KVER}-${ARCH}"
        STAGE="$STAGE_PARENT/$PKG_DIR"
        mkdir -p "$STAGE"
        tar -xJf "$TARBALL" -C "$STAGE"

        echo ""
        echo "──── package content preview (before scripts) ────"
        ls -la "$STAGE"

        TPL_DIR=/tmp/tarxz-helpers
        [ -d "$TPL_DIR" ] || { echo "FATAL: templates not found in $TPL_DIR" >&2; exit 1; }

        sed "s/__KVER__/${KVER}/g" "$TPL_DIR/install.sh.tpl" > "$STAGE/install-${KVER}.sh"
        chmod 755 "$STAGE/install-${KVER}.sh"

        sed "s/__KVER__/${KVER}/g" "$TPL_DIR/uninstall.sh.tpl" > "$STAGE/uninstall-${KVER}.sh"
        chmod 755 "$STAGE/uninstall-${KVER}.sh"

        sed -e "s/__KVER__/${KVER}/g" -e "s/__ARCH__/${ARCH}/g" \
          "$TPL_DIR/README.md.tpl" > "$STAGE/README.md"

        mkdir -p dist
        OUTNAME="linux-${KVER}-${ARCH}.tar.xz"
        ( cd "$STAGE_PARENT" && tar -cJf "$OLDPWD/dist/$OUTNAME" "$PKG_DIR" )
        rm -rf "$STAGE_PARENT"

        echo ""
        echo "════════ tar.xz package ════════"
        ls -lh "dist/$OUTNAME"
        echo "──── content (top 20) ────"
        tar -tJf "dist/$OUTNAME" | head -20
        echo "──── end ────"

        test -n "$(find dist -maxdepth 1 -name '*.tar.xz' -print -quit)"

    - name: Collect artifacts
      run: |
        mkdir -p dist
        case "${{ matrix.format }}" in
          deb)
            find kernel-source/.. -maxdepth 1 -type f -name 'linux-image-*.deb' \
              ! -name '*-dbg_*.deb' -exec mv {} dist/ \;
            find kernel-source/.. -maxdepth 1 -type f -name 'linux-headers-*.deb' -exec mv {} dist/ \;
            ;;
          rpm)
            find kernel-source/rpmbuild/RPMS -type f -name '*.rpm' -exec mv {} dist/ \;
            ;;
          tarxz)
            ;;
        esac
        ls -lh dist/
        test -n "$(find dist -maxdepth 1 -type f -print -quit)"

    - uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ matrix.format }}-${{ matrix.arch }}
        path: dist/*
        if-no-files-found: error
        retention-days: 7

  publish:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kernel-*
          merge-multiple: true
      - run: ls -lh dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: dist/*
          generate_release_notes: true
          overwrite_files: true
