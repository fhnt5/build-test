name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: '内核源码仓库'
        type: string
        default: 'https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git'
      kernel_ref:
        description: '内核版本/分支/tag/commit'
        type: string
        required: true
      arch:
        description: '目标架构'
        type: choice
        options: ['x86_64', 'arm64', 'both']
        default: 'x86_64'
      formats:
        description: '打包格式（逗号分隔）'
        type: string
        default: 'deb,rpm,tarxz,pkg'
      config_choice:
        description: '配置预设'
        type: choice
        options:
          - 'default'
          - 'debian'
          - 'ubuntu'
          - 'fedora'
          - 'centos'
          - 'rhel'
          - 'rocky'
          - 'alma'
          - 'alpine'
          - 'arch'
          - 'manjaro'
          - 'gentoo'
          - 'opensuse'
          - 'kali'
          - 'nixos'
          - 'void'
        default: 'default'
      config_custom:
        description: '自定义配置（URL / make:target / 文件路径，留空则用上方预设）'
        type: string
        default: ''
      respect_config:
        description: '尊重原配置（不改调优/LTO）'
        type: boolean
        default: true
      tune_profile:
        description: '调优预设（仅 respect_config=false 时生效）'
        type: choice
        options: ['none', 'performance', 'lowlatency', 'minimal', 'debugoff', 'default']
        default: 'none'
      lto_mode:
        description: 'LTO 模式（仅 respect_config=false 时生效）'
        type: choice
        options: ['none', 'thin', 'full']
        default: 'none'
      include_headers:
        description: '打包 headers'
        type: boolean
        default: true
      headers_full_tree:
        description: 'headers 完整树（false 则仅 include+scripts+arch）'
        type: boolean
        default: true
      strip_modules:
        description: 'strip 内核模块'
        type: boolean
        default: false
      tarxz_include_headers:
        description: 'tar.xz 内包含 headers'
        type: boolean
        default: true
      ccache:
        description: '启用 ccache'
        type: boolean
        default: true
      parallel_jobs:
        description: '并行 jobs（auto / 数字）'
        type: string
        default: 'auto'
      release_tag:
        description: '发布 tag（留空则不创建 release）'
        type: string
        default: ''

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      has_x86_64: ${{ steps.m.outputs.has_x86_64 }}
      has_arm64: ${{ steps.m.outputs.has_arm64 }}
      x86_64_formats: ${{ steps.m.outputs.x86_64_formats }}
      arm64_formats: ${{ steps.m.outputs.arm64_formats }}
    steps:
      - id: m
        run: |
          set -euo pipefail
          ARCH='${{ inputs.arch }}'
          FMT='${{ inputs.formats }}'

          case "$ARCH" in
            x86_64) BUILD_X86=1; BUILD_ARM=0 ;;
            arm64)  BUILD_X86=0; BUILD_ARM=1 ;;
            both)   BUILD_X86=1; BUILD_ARM=1 ;;
            *) echo "不支持的架构: $ARCH" >&2; exit 1 ;;
          esac

          echo "has_x86_64=$BUILD_X86" >> "$GITHUB_OUTPUT"
          echo "has_arm64=$BUILD_ARM"  >> "$GITHUB_OUTPUT"
          echo "x86_64_formats=$(printf '%s' "$FMT" | jq -R -s -c 'split(",")')" >> "$GITHUB_OUTPUT"
          echo "arm64_formats=$(printf '%s'  "$FMT" | jq -R -s -c 'split(",")')" >> "$GITHUB_OUTPUT"

          if [ "$BUILD_X86" = "1" ] && [ "$BUILD_ARM" = "1" ]; then
            MATRIX="$(jq -n -c --argjson f "$(printf '%s' "$FMT" | jq -R -s 'split(",")')" \
              '[{arch:"x86_64",deb_arch:"amd64",rpm_arch:"x86_64",arch_boot:"arch/x86/boot/bzImage",runner:"ubuntu-latest",formats:$f},{arch:"arm64",deb_arch:"arm64",rpm_arch:"aarch64",arch_boot:"arch/arm64/boot/Image",runner:"ubuntu-24.04-arm",formats:$f}]')"
          elif [ "$BUILD_X86" = "1" ]; then
            MATRIX="$(jq -n -c --argjson f "$(printf '%s' "$FMT" | jq -R -s 'split(",")')" \
              '[{arch:"x86_64",deb_arch:"amd64",rpm_arch:"x86_64",arch_boot:"arch/x86/boot/bzImage",runner:"ubuntu-latest",formats:$f}]')"
          else
            MATRIX="$(jq -n -c --argjson f "$(printf '%s' "$FMT" | jq -R -s 'split(",")')" \
              '[{arch:"arm64",deb_arch:"arm64",rpm_arch:"aarch64",arch_boot:"arch/arm64/boot/Image",runner:"ubuntu-24.04-arm",formats:$f}]')"
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  compile-x86_64:
    needs: prepare
    if: ${{ needs.prepare.outputs.has_x86_64 == 'true' }}
    uses: ./.github/workflows/compile-core.yml
    with:
      arch: x86_64
      arch_name: x86_64
      deb_arch: amd64
      rpm_arch: x86_64
      arch_boot: arch/x86/boot/bzImage
      runner: ubuntu-latest
      kernel_repo: ${{ inputs.kernel_repo }}
      kernel_ref: ${{ inputs.kernel_ref }}
      config_choice: ${{ inputs.config_choice }}
      config_custom: ${{ inputs.config_custom }}
      respect_config: ${{ inputs.respect_config }}
      tune_profile: ${{ inputs.tune_profile }}
      lto_mode: ${{ inputs.lto_mode }}
      include_headers: ${{ inputs.include_headers }}
      headers_full_tree: ${{ inputs.headers_full_tree }}
      strip_modules: ${{ inputs.strip_modules }}
      parallel_jobs: ${{ inputs.parallel_jobs }}
      ccache: ${{ inputs.ccache }}

  compile-arm64:
    needs: prepare
    if: ${{ needs.prepare.outputs.has_arm64 == 'true' }}
    uses: ./.github/workflows/compile-core.yml
    with:
      arch: arm64
      arch_name: arm64
      deb_arch: arm64
      rpm_arch: aarch64
      arch_boot: arch/arm64/boot/Image
      runner: ubuntu-24.04-arm
      kernel_repo: ${{ inputs.kernel_repo }}
      kernel_ref: ${{ inputs.kernel_ref }}
      config_choice: ${{ inputs.config_choice }}
      config_custom: ${{ inputs.config_custom }}
      respect_config: ${{ inputs.respect_config }}
      tune_profile: ${{ inputs.tune_profile }}
      lto_mode: ${{ inputs.lto_mode }}
      include_headers: ${{ inputs.include_headers }}
      headers_full_tree: ${{ inputs.headers_full_tree }}
      strip_modules: ${{ inputs.strip_modules }}
      parallel_jobs: ${{ inputs.parallel_jobs }}
      ccache: ${{ inputs.ccache }}

  package-x86_64-deb:
    needs: compile-x86_64
    if: ${{ contains(fromJSON(needs.prepare.outputs.x86_64_formats), 'deb') }}
    uses: ./.github/workflows/package-core.yml
    with:
      arch: x86_64
      arch_name: x86_64
      deb_arch: amd64
      rpm_arch: x86_64
      format: deb
      kver: ${{ needs.compile-x86_64.outputs.kver }}

  package-x86_64-rpm:
    needs: compile-x86_64
    if: ${{ contains(fromJSON(needs.prepare.outputs.x86_64_formats), 'rpm') }}
    uses: ./.github/workflows/package-core.yml
    with:
      arch: x86_64
      arch_name: x86_64
      deb_arch: amd64
      rpm_arch: x86_64
      format: rpm
      kver: ${{ needs.compile-x86_64.outputs.kver }}

  package-x86_64-tarxz:
    needs: compile-x86_64
    if: ${{ contains(fromJSON(needs.prepare.outputs.x86_64_formats), 'tarxz') }}
    uses: ./.github/workflows/package-core.yml
    with:
      arch: x86_64
      arch_name: x86_64
      deb_arch: amd64
      rpm_arch: x86_64
      format: tarxz
      kver: ${{ needs.compile-x86_64.outputs.kver }}

  package-x86_64-pkg:
    needs: compile-x86_64
    if: ${{ contains(fromJSON(needs.prepare.outputs.x86_64_formats), 'pkg') }}
    uses: ./.github/workflows/package-core.yml
    with:
      arch: x86_64
      arch_name: x86_64
      deb_arch: amd64
      rpm_arch: x86_64
      format: pkg
      kver: ${{ needs.compile-x86_64.outputs.kver }}

  package-arm64-deb:
    needs: compile-arm64
    if: ${{ contains(fromJSON(needs.prepare.outputs.arm64_formats), 'deb') }}
    uses: ./.github/workflows/package-core.yml
    with:
      arch: arm64
      arch_name: arm64
      deb_arch: arm64
      rpm_arch: aarch64
      format: deb
      kver: ${{ needs.compile-arm64.outputs.kver }}

  package-arm64-rpm:
    needs: compile-arm64
    if: ${{ contains(fromJSON(needs.prepare.outputs.arm64_formats), 'rpm') }}
    uses: ./.github/workflows/package-core.yml
    with:
      arch: arm64
      arch_name: arm64
      deb_arch: arm64
      rpm_arch: aarch64
      format: rpm
      kver: ${{ needs.compile-arm64.outputs.kver }}

  package-arm64-tarxz:
    needs: compile-arm64
    if: ${{ contains(fromJSON(needs.prepare.outputs.arm64_formats), 'tarxz') }}
    uses: ./.github/workflows/package-core.yml
    with:
      arch: arm64
      arch_name: arm64
      deb_arch: arm64
      rpm_arch: aarch64
      format: tarxz
      kver: ${{ needs.compile-arm64.outputs.kver }}

  package-arm64-pkg:
    needs: compile-arm64
    if: ${{ contains(fromJSON(needs.prepare.outputs.arm64_formats), 'pkg') }}
    uses: ./.github/workflows/package-core.yml
    with:
      arch: arm64
      arch_name: arm64
      deb_arch: arm64
      rpm_arch: aarch64
      format: pkg
      kver: ${{ needs.compile-arm64.outputs.kver }}

  publish:
    needs:
      - package-x86_64-deb
      - package-x86_64-rpm
      - package-x86_64-tarxz
      - package-x86_64-pkg
      - package-arm64-deb
      - package-arm64-rpm
      - package-arm64-tarxz
      - package-arm64-pkg
    if: ${{ inputs.release_tag != '' && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # 只下载最终成品（kernel-<arch>-<format>），
          # 排除编译中间产物（build-<arch>），避免重复与体积浪费
          pattern: kernel-*
          merge-multiple: true
          path: release
      - name: 生成 release
        run: |
          set -euo pipefail
          cd release
          ls -lh
          gh release create "${{ inputs.release_tag }}" \
            $(find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.xz' -o -name '*.pkg.tar.zst' \)) \
            --title "Kernel ${{ inputs.kernel_ref }}" \
            --notes "内核 ${{ inputs.kernel_ref }} 构建产物（${{ inputs.arch }} / ${{ inputs.formats }}）" \
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
