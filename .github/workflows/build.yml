name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      x86_64_deb:
        description: '构建 x86_64 deb'
        type: boolean
        default: true
      x86_64_rpm:
        description: '构建 x86_64 rpm'
        type: boolean
        default: false
      x86_64_tarxz:
        description: '构建 x86_64 tar.xz'
        type: boolean
        default: false
      x86_64_pkg:
        description: '构建 x86_64 pkg.tar.zst'
        type: boolean
        default: false
      arm64_deb:
        description: '构建 arm64 deb'
        type: boolean
        default: false
      arm64_rpm:
        description: '构建 arm64 rpm'
        type: boolean
        default: false
      arm64_tarxz:
        description: '构建 arm64 tar.xz'
        type: boolean
        default: false
      arm64_pkg:
        description: '构建 arm64 pkg.tar.zst'
        type: boolean
        default: false
      config_choice:
        description: '内核配置预设（有 config_custom 时此项被覆盖）'
        type: choice
        default: 'default'
        options:
          - 'default'
          - 'allyesconfig'
          - 'allmodconfig'
          - 'allnoconfig'
          - 'tinyconfig'
          - 'alma'
          - 'alpine'
          - 'arch'
          - 'centos'
          - 'debian'
          - 'fedora'
          - 'gentoo'
          - 'kali'
          - 'manjaro'
          - 'nixos'
          - 'opensuse'
          - 'rhel'
          - 'rocky'
          - 'ubuntu'
          - 'void'
      config_custom:
        description: '自定义配置路径或 URL（例如 configs/G40_45.config，或 http(s)://...）'
        type: string
        default: ''
      respect_config:
        description: '严格模式：原样使用 .config，跳过调优与 LTO 修改（含下面的两个 tune 选项）'
        type: boolean
        default: true
      include_headers:
        description: '同时构建 headers 包'
        type: boolean
        default: true
      headers_full_tree:
        description: 'headers 完整源码树（关闭=仅最小子集）'
        type: boolean
        default: true
      strip_modules:
        description: '剥离内核模块调试符号'
        type: boolean
        default: false
      parallel_jobs:
        description: '并行编译线程数'
        type: choice
        default: 'auto'
        options: ['auto', '1', '2', '4', '8', '16']
      lto_mode:
        description: 'LLVM 链接时优化（需 respect_config=false；与 minimal 不兼容）'
        type: choice
        default: 'none'
        options: ['none', 'full', 'thin']
      tune_profile:
        description: '调优预设：调试/体积（none=不修改；需 respect_config=false）'
        type: choice
        default: 'none'
        options: ['none', 'default', 'debugoff', 'minimal']
      tune_sched_profile:
        description: '调优预设：调度/延迟（none=不修改；需 respect_config=false）'
        type: choice
        default: 'none'
        options: ['none', 'lowlatency', 'performance']
      kernel_repo:
        description: '内核源码仓库 URL'
        type: string
        default: 'https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git'
      kernel_ref:
        description: 'git 分支或标签（留空=自动取最新 stable）'
        type: string
        default: ''
      release_tag:
        description: '发布标签（留空=仅保留 artifact，不创建 Release）'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      kernel_ref: ${{ steps.resolve.outputs.kernel_ref }}
    steps:
      - name: 解析内核版本引用
        id: resolve
        run: |
          set -euo pipefail
          INPUT_REF="${{ inputs.kernel_ref }}"
          REPO="${{ inputs.kernel_repo }}"

          if [ -n "$INPUT_REF" ]; then
            echo "kernel_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$REPO" | grep -Eq '(^|/)linux-stable(\.git)?$'; then
            STABLE_TAG="$(git ls-remote --tags --refs "$REPO" 2>/dev/null \
              | awk -F/ '{print $NF}' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -Vr \
              | head -1 || true)"
            if [ -n "$STABLE_TAG" ]; then
              echo "kernel_ref=$STABLE_TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          PATTERN='^v?[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z._-]+)?$'
          LATEST="$(git ls-remote --tags --refs --sort=-v:refname "$REPO" 2>/dev/null \
            | awk -F/ '{print $NF}' | grep -E "$PATTERN" | head -1 || true)"
          if [ -n "$LATEST" ]; then
            echo "kernel_ref=$LATEST" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DEFAULT_BRANCH="$(git ls-remote --symref "$REPO" HEAD 2>/dev/null \
            | awk '/^ref:/ {sub("refs/heads/","",$2); print $2; exit}' || true)"
          if [ -n "$DEFAULT_BRANCH" ]; then
            echo "kernel_ref=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHA="$(git ls-remote "$REPO" HEAD 2>/dev/null | awk '{print $1; exit}' || true)"
          if [ -z "$SHA" ]; then
            echo "ERROR: 无法解析仓库 $REPO 的版本引用" >&2
            exit 1
          fi
          echo "kernel_ref=$SHA" >> "$GITHUB_OUTPUT"

  compile-x86_64:
    needs: resolve-ref
    if: ${{ inputs.x86_64_deb == true || inputs.x86_64_rpm == true || inputs.x86_64_tarxz == true || inputs.x86_64_pkg == true }}
    uses: ./.github/workflows/compile-core.yml
    with:
      runner: ubuntu-latest
      arch: x86_64
      deb_arch: amd64
      rpm_arch: x86_64
      arch_boot: arch/x86/boot/bzImage
      config_choice: ${{ inputs.config_choice }}
      config_custom: ${{ inputs.config_custom }}
      respect_config: ${{ inputs.respect_config }}
      include_headers: ${{ inputs.include_headers }}
      headers_full_tree: ${{ inputs.headers_full_tree }}
      strip_modules: ${{ inputs.strip_modules }}
      parallel_jobs: ${{ inputs.parallel_jobs }}
      lto_mode: ${{ inputs.lto_mode }}
      tune_profile: ${{ inputs.tune_profile }}
      tune_sched_profile: ${{ inputs.tune_sched_profile }}
      kernel_repo: ${{ inputs.kernel_repo }}
      kernel_ref: ${{ needs.resolve-ref.outputs.kernel_ref }}

  compile-arm64:
    needs: resolve-ref
    if: ${{ inputs.arm64_deb == true || inputs.arm64_rpm == true || inputs.arm64_tarxz == true || inputs.arm64_pkg == true }}
    uses: ./.github/workflows/compile-core.yml
    with:
      runner: ubuntu-24.04-arm
      arch: arm64
      deb_arch: arm64
      rpm_arch: aarch64
      arch_boot: arch/arm64/boot/Image
      config_choice: ${{ inputs.config_choice }}
      config_custom: ${{ inputs.config_custom }}
      respect_config: ${{ inputs.respect_config }}
      include_headers: ${{ inputs.include_headers }}
      headers_full_tree: ${{ inputs.headers_full_tree }}
      strip_modules: ${{ inputs.strip_modules }}
      parallel_jobs: ${{ inputs.parallel_jobs }}
      lto_mode: ${{ inputs.lto_mode }}
      tune_profile: ${{ inputs.tune_profile }}
      tune_sched_profile: ${{ inputs.tune_sched_profile }}
      kernel_repo: ${{ inputs.kernel_repo }}
      kernel_ref: ${{ needs.resolve-ref.outputs.kernel_ref }}

  package-x86_64-deb:
    needs: compile-x86_64
    if: ${{ inputs.x86_64_deb == true }}
    uses: ./.github/workflows/package-core.yml
    with:
      arch: x86_64
      arch_name: x86_64
      deb_arch: amd64
      rpm_arch: x86_64
      format: deb

  package-x86_64-rpm:
    needs: compile-x86_64
    if: ${{ inputs.x86_64_rpm == true }}
    uses: ./.github/workflows/package-core.yml
    with:
      arch: x86_64
      arch_name: x86_64
      deb_arch: amd64
      rpm_arch: x86_64
      format: rpm

  package-x86_64-tarxz:
    needs: compile-x86_64
    if: ${{ inputs.x86_64_tarxz == true }}
    uses: ./.github/workflows/package-core.yml
    with:
      arch: x86_64
      arch_name: x86_64
      deb_arch: amd64
      rpm_arch: x86_64
      format: tarxz

  package-x86_64-pkg:
    needs: compile-x86_64
    if: ${{ inputs.x86_64_pkg == true }}
    uses: ./.github/workflows/package-core.yml
    with:
      arch: x86_64
      arch_name: x86_64
      deb_arch: amd64
      rpm_arch: x86_64
      format: pkg

  package-arm64-deb:
    needs: compile-arm64
    if: ${{ inputs.arm64_deb == true }}
    uses: ./.github/workflows/package-core.yml
    with:
      arch: arm64
      arch_name: aarch64
      deb_arch: arm64
      rpm_arch: aarch64
      format: deb

  package-arm64-rpm:
    needs: compile-arm64
    if: ${{ inputs.arm64_rpm == true }}
    uses: ./.github/workflows/package-core.yml
    with:
      arch: arm64
      arch_name: aarch64
      deb_arch: arm64
      rpm_arch: aarch64
      format: rpm

  package-arm64-tarxz:
    needs: compile-arm64
    if: ${{ inputs.arm64_tarxz == true }}
    uses: ./.github/workflows/package-core.yml
    with:
      arch: arm64
      arch_name: aarch64
      deb_arch: arm64
      rpm_arch: aarch64
      format: tarxz

  package-arm64-pkg:
    needs: compile-arm64
    if: ${{ inputs.arm64_pkg == true }}
    uses: ./.github/workflows/package-core.yml
    with:
      arch: arm64
      arch_name: aarch64
      deb_arch: arm64
      rpm_arch: aarch64
      format: pkg

  publish:
    needs:
      - package-x86_64-deb
      - package-x86_64-rpm
      - package-x86_64-tarxz
      - package-x86_64-pkg
      - package-arm64-deb
      - package-arm64-rpm
      - package-arm64-tarxz
      - package-arm64-pkg
    if: ${{ inputs.release_tag != '' && !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kernel-*
          merge-multiple: true
      - run: |
          ls -lh dist/
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: dist/*
          generate_release_notes: true
          overwrite_files: true
