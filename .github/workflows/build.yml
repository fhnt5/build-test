name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      # ─────────── x86_64 ───────────
      x86_64_deb:
        description: 'x86_64  ›  deb'
        type: boolean
        default: true
      x86_64_rpm:
        description: 'x86_64  ›  rpm'
        type: boolean
        default: false
      x86_64_pkg:
        description: 'x86_64  ›  pkg.tar.zst'
        type: boolean
        default: false
      # ─────────── arm64 ───────────
      arm64_deb:
        description: 'arm64   ›  deb'
        type: boolean
        default: false
      arm64_rpm:
        description: 'arm64   ›  rpm'
        type: boolean
        default: false
      arm64_pkg:
        description: 'arm64   ›  pkg.tar.zst（使用 Arch Linux ARM 容器）'
        type: boolean
        default: false
      # ─────────── 通用 ───────────
      kernel_repo:
        description: '内核源码仓库 URL'
        required: true
        default: 'https://github.com/zen-kernel/zen-kernel.git'
      kernel_ref:
        description: '分支或 tag（如 v7.2.6-lqx1 / master）'
        required: true
        default: 'v7.2.6-lqx1'
      config_file:
        description: '仓库中配置文件路径（如 configs/G40_45.config）'
        required: true
        default: 'configs/G40_45.config'
      release_tag:
        description: '（可选）完成后发布到该 tag 的 Release，留空则不发布'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 作业 1：根据勾选生成动态矩阵
  # ------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - name: Generate build matrix
        id: gen
        run: |
          MATRIX='{"include":[]}'
          add() {
            MATRIX=$(echo "$MATRIX" | jq -c --arg a "$1" --arg f "$2" \
              '.include += [{arch:$a, format:$f}]')
          }

          if [ "${{ inputs.x86_64_deb }}" = "true" ]; then add x86_64 deb;        fi
          if [ "${{ inputs.x86_64_rpm }}" = "true" ]; then add x86_64 rpm;        fi
          if [ "${{ inputs.x86_64_pkg }}" = "true" ]; then add x86_64 pkg.tar.zst; fi
          if [ "${{ inputs.arm64_deb }}"  = "true" ]; then add arm64  deb;        fi
          if [ "${{ inputs.arm64_rpm }}"  = "true" ]; then add arm64  rpm;        fi
          if [ "${{ inputs.arm64_pkg }}"  = "true" ]; then add arm64  pkg.tar.zst; fi

          COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "MATRIX = $MATRIX"
          echo "COUNT  = $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "No build target selected. Please tick at least one architecture/format combination." >&2
            exit 1
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT"   >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # 作业 2：按矩阵构建
  # ------------------------------------------------------------------
  build:
    needs: prepare
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Show build target
      run: |
        echo "Arch:    ${{ matrix.arch }}"
        echo "Format:  ${{ matrix.format }}"
        echo "Repo:    ${{ inputs.kernel_repo }}"
        echo "Ref:     ${{ inputs.kernel_ref }}"
        echo "Config:  ${{ inputs.config_file }}"
        echo "Runner:  ${{ runner.os }} / ${{ runner.arch }}"

    - name: Set arch variables
      id: arch
      run: |
        case "${{ matrix.arch }}" in
          x86_64|amd64)
            echo "karch=x86_64"    >> "$GITHUB_OUTPUT"
            echo "deb_arch=amd64"  >> "$GITHUB_OUTPUT"
            ;;
          arm64|aarch64)
            echo "karch=arm64"     >> "$GITHUB_OUTPUT"
            echo "deb_arch=arm64"  >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "Unsupported arch: ${{ matrix.arch }}" >&2
            exit 1
            ;;
        esac

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
        df -h /

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libncurses-dev bison flex \
          libssl-dev libelf-dev libdw-dev elfutils \
          bc dwarves zstd cpio rsync kmod \
          git jq

        case "${{ matrix.format }}" in
          deb)
            sudo apt-get install -y debhelper fakeroot
            ;;
          rpm)
            sudo apt-get install -y rpm rpm2cpio cpio
            ;;
        esac

    - name: Verify config file exists
      run: |
        if [ ! -f "${{ inputs.config_file }}" ]; then
          echo "Config file not found: ${{ inputs.config_file }}" >&2
          exit 1
        fi

    - name: Clone kernel source
      run: |
        git clone --depth 1 --branch "${{ inputs.kernel_ref }}" \
          "${{ inputs.kernel_repo }}" kernel-source

    - name: Apply config
      run: |
        cd kernel-source
        cp "../${{ inputs.config_file }}" .config
        make ARCH=${{ steps.arch.outputs.karch }} olddefconfig

    - name: Build kernel packages (deb / rpm)
      if: matrix.format != 'pkg.tar.zst'
      run: |
        cd kernel-source
        case "${{ matrix.format }}" in
          deb)
            make ARCH=${{ steps.arch.outputs.karch }} \
                 KDEB_ARCH=${{ steps.arch.outputs.deb_arch }} \
                 KDEB_OPTS="-a${{ steps.arch.outputs.deb_arch }}" \
                 DEB_EXCLUDE_PKG="linux-libc-dev linux-image-%-dbg" \
                 -j$(nproc) bindeb-pkg
            ;;
          rpm)
            # KCFLAGS="-g0" 阻止生成 debuginfo 文件，
            # 避免 6.x 之后 binrpm-pkg 报 "Installed (but unpackaged) file(s) found"
            make ARCH=${{ steps.arch.outputs.karch }} \
                 KCFLAGS="-g0" \
                 RPM_BUILD_NCPUS=$(nproc) \
                 -j$(nproc) binrpm-pkg
            ;;
        esac

    - name: Build kernel packages (pkg.tar.zst)
      if: matrix.format == 'pkg.tar.zst'
      run: |
        # 根据目标架构选择 Arch 容器镜像
        case "${{ matrix.arch }}" in
          x86_64)
            ARCH_IMAGE="archlinux:latest"
            ;;
          arm64)
            ARCH_IMAGE="menci/archlinuxarm:base-devel"
            ;;
        esac
        echo "Using Arch container image: $ARCH_IMAGE"

        docker run --rm \
          -v "$PWD:/workspace" \
          -w /workspace \
          "$ARCH_IMAGE" \
          bash -c '
            set -e

            # 基础构建工具（base-devel 已包含在 base-devel 镜像中）
            pacman -Sy --noconfirm --needed \
              base-devel git libarchive jq \
              bc rsync kmod inetutils \
              elfutils debugedit zstd

            # 非 root 用户，makepkg 不允许 root 运行
            useradd -m builder
            chown -R builder:builder /workspace

            # 克隆 Arch 官方打包仓库
            git clone --depth 1 \
              https://gitlab.archlinux.org/archlinux/packaging/packages/linux.git \
              arch-pkg
            cd arch-pkg

            # 修改包名并把内核配置复制进打包仓库
            sed -i "s/^pkgbase=.*/pkgbase=linux-custom/" PKGBUILD
            cp "/workspace/kernel-source/${{ inputs.config_file }}" config

            # 以 builder 用户执行 makepkg
            su builder -c "makepkg -s --noconfirm --nodeps --ignorearch"
          '

    - name: Collect artifacts
      run: |
        mkdir -p dist

        case "${{ matrix.format }}" in
          deb)
            find kernel-source/.. -maxdepth 1 -type f -name 'linux-image-*.deb' \
              ! -name '*-dbg_*.deb' -exec mv {} dist/ \;
            find kernel-source/.. -maxdepth 1 -type f -name 'linux-headers-*.deb' \
              -exec mv {} dist/ \;
            ;;
          rpm)
            find kernel-source/.. -maxdepth 1 -type f \
              \( -name 'kernel-*.rpm' -o -name 'linux-*.rpm' \) \
              -exec mv {} dist/ \;
            ;;
          pkg.tar.zst)
            find . -maxdepth 2 -type f -name '*.pkg.tar.zst' \
              -exec mv {} dist/ \;
            ;;
        esac

        echo "---- collected ----"
        ls -lh dist/
        test -n "$(find dist -maxdepth 1 -type f -print -quit)"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ matrix.format }}-${{ matrix.arch }}
        path: dist/*
        if-no-files-found: error

  # ------------------------------------------------------------------
  # 作业 3：发布 Release
  # ------------------------------------------------------------------
  publish:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kernel-*
          merge-multiple: true

      - name: List collected files
        run: |
          ls -lh dist/
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: dist/*
          generate_release_notes: true
