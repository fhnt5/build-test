name: Build Arch Linux Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64, arm64 ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare kernel config
        run: |
          # 这里假设 kernel.config 已经在仓库里，或由前一步生成
          # 如果它在仓库根目录，直接复制到 /tmp
          cp kernel.config /tmp/kernel.config

      - name: Build in Arch container
        shell: bash
        env:
          CONFIG_SOURCE: kernel defconfig
        run: |
          set -e

          case "${{ matrix.arch }}" in
            x86_64) ARCH_IMAGE="archlinux:latest" ;;
            arm64)  ARCH_IMAGE="menci/archlinuxarm:base-devel" ;;
          esac
          echo "Using Arch container image: $ARCH_IMAGE"

          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/in" "$STAGE/out"
          cp /tmp/kernel.config "$STAGE/in/kernel.config"

          cat > "$STAGE/in/build.sh" <<'BUILD_EOF'
          set -e

          # pacman 7.0+ 默认启用 Landlock 沙盒
          sed -i "s/^#DisableSandbox/DisableSandbox/" /etc/pacman.conf

          pacman -Sy --noconfirm --needed --disable-sandbox \
            base-devel git libarchive jq bc rsync kmod inetutils \
            elfutils debugedit zstd pahole

          # ── BTF 注入：直接改 /tmp/kernel.config ──
          echo "---- Injecting BTF config into /tmp/kernel.config ----"
          CFG=/tmp/kernel.config
          sed -i -E '/^(# )?CONFIG_DEBUG_INFO_BTF(=| |_)/d' "$CFG"
          sed -i -E '/^(# )?CONFIG_DEBUG_INFO_REDUCED(=| )/d' "$CFG"
          sed -i -E '/^(# )?CONFIG_DEBUG_INFO_SPLIT(=| )/d' "$CFG"
          sed -i -E '/^(# )?CONFIG_DEBUG_INFO_DWARF4(=| )/d' "$CFG"
          sed -i -E '/^(# )?CONFIG_DEBUG_INFO_DWARF5(=| )/d' "$CFG"
          {
            echo "CONFIG_DEBUG_INFO=y"
            echo "CONFIG_DEBUG_INFO_DWARF5=y"
            echo "# CONFIG_DEBUG_INFO_REDUCED is not set"
            echo "# CONFIG_DEBUG_INFO_SPLIT is not set"
            echo "CONFIG_DEBUG_INFO_BTF=y"
            echo "CONFIG_DEBUG_INFO_BTF_MODULES=y"
          } >> "$CFG"
          echo "---- BTF config injected ----"

          # makepkg 不允许 root 运行
          useradd -m builder
          chmod 644 "$CFG"

          # ── builder 阶段：clone + 构建 ──
          su - builder -c '
          set -e
          cd ~
          git clone --depth 1 \
            https://gitlab.archlinux.org/archlinux/packaging/packages/linux.git \
            arch-pkg
          cd arch-pkg
          sed -i "s/^pkgbase=.*/pkgbase=linux-custom/" PKGBUILD

          echo "---- PKGBUILD config line (before) ----"
          grep -nE "cp[[:space:]]+.*config" PKGBUILD || true
          sed -i -E "s|cp[[:space:]]+\.\./config\.[^[:space:]]+[[:space:]]+\.config|cp /tmp/kernel.config .config|" PKGBUILD
          echo "---- PKGBUILD config line (after) ----"
          grep -nE "cp[[:space:]]+.*config" PKGBUILD || true

          cp /tmp/kernel.config config

          makepkg -s --noconfirm --nodeps --ignorearch --skipinteg
          '
          BUILD_EOF

          CID=$(docker run -d "$ARCH_IMAGE" sleep infinity)
          echo "Container: $CID"

          # ── 用 tar 管道复制文件，并在容器内直接解包为 root:root ──
          # docker cp 没有 --chown 选项，任何版本都不支持，会直接报
          # "unknown flag: --chown"。改用 tar 流式传输：宿主机打包，
          # 容器内以 root 身份解包，并用 --owner/--group 指定属主，
          # 不依赖 docker cp 的权限行为，兼容所有 Docker 版本。
          tar -C "$STAGE/in" -cf - build.sh kernel.config \
            | docker exec -i "$CID" tar -xf - -C /tmp --owner=root --group=root

          docker exec "$CID" bash /tmp/build.sh

          docker cp "$CID:/home/builder/arch-pkg/." "$STAGE/out/"
          docker rm -f "$CID"

          sudo chown -R "$(id -u):$(id -g)" "$STAGE/out"

          mkdir -p dist
          find "$STAGE/out" -maxdepth 1 -type f -name '*.pkg.tar.zst' \
            -exec mv {} dist/ \;
          rm -rf "$STAGE"

          echo "---- pkg artifacts ----"
          ls -lh dist/
          test -n "$(find dist -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arch-kernel-${{ matrix.arch }}
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
