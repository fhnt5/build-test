name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      x86_64_deb:   { description: 'x86_64  ›  deb', type: boolean, default: true }
      x86_64_rpm:   { description: 'x86_64  ›  rpm', type: boolean, default: false }
      x86_64_tarxz: { description: 'x86_64  ›  tar.xz（全发行版通用 + install/uninstall）', type: boolean, default: false }
      x86_64_pkg:   { description: 'x86_64  ›  pkg.tar.zst（Arch 包）', type: boolean, default: false }
      arm64_deb:    { description: 'arm64   ›  deb', type: boolean, default: false }
      arm64_rpm:    { description: 'arm64   ›  rpm', type: boolean, default: false }
      arm64_tarxz:  { description: 'arm64   ›  tar.xz（全发行版通用 + install/uninstall）', type: boolean, default: false }
      arm64_pkg:    { description: 'arm64   ›  pkg.tar.zst（Arch 包）', type: boolean, default: false }
      config_choice:
        description: '内核配置来源：内核自带目标 / 仓库 configs/* / make:<target> / 发行版'
        type: choice
        required: true
        default: 'default'
        options:
          - 'default'
          - 'allyesconfig'
          - 'allmodconfig'
          - 'allnoconfig'
          - 'tinyconfig'
          - 'configs/G40_45.config'
          - 'alma'
          - 'alpine'
          - 'arch'
          - 'centos'
          - 'debian'
          - 'fedora'
          - 'gentoo'
          - 'kali'
          - 'manjaro'
          - 'nixos'
          - 'opensuse'
          - 'rhel'
          - 'rocky'
          - 'ubuntu'
          - 'void'
      config_custom:
        description: '（可选）自定义配置：仓库内路径 / http(s):// URL / make:<target>。填了则覆盖上面的选择'
        type: string
        required: false
        default: ''
      respect_config:
        description: '是否严格尊重仓库中的 .config，不做 olddefconfig / 兼容性修补'
        type: boolean
        required: false
        default: true
      kernel_repo:
        description: '内核源码仓库 URL'
        required: true
        default: 'https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git'
      kernel_ref:
        description: '分支或 tag（如 v7.2.6 / v6.12.5-zen1 / master）。留空则自动使用该仓库最新版本'
        required: false
        default: ''
      release_tag:
        description: '（可选）完成后发布到该 tag 的 Release，留空则不发布'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: gen
        run: |
          set -uo pipefail
          MATRIX='{"include":[]}'

          X86_FORMATS="[]"
          [ "${{ inputs.x86_64_deb }}"   = "true" ] && X86_FORMATS=$(echo "$X86_FORMATS" | jq -c '. + ["deb"]')   || true
          [ "${{ inputs.x86_64_rpm }}"   = "true" ] && X86_FORMATS=$(echo "$X86_FORMATS" | jq -c '. + ["rpm"]')   || true
          [ "${{ inputs.x86_64_tarxz }}" = "true" ] && X86_FORMATS=$(echo "$X86_FORMATS" | jq -c '. + ["tarxz"]') || true
          [ "${{ inputs.x86_64_pkg }}"   = "true" ] && X86_FORMATS=$(echo "$X86_FORMATS" | jq -c '. + ["pkg"]')   || true
          if [ "$(echo "$X86_FORMATS" | jq 'length')" -gt 0 ]; then
            MATRIX=$(echo "$MATRIX" | jq -c --argjson f "$X86_FORMATS" \
              '.include += [{arch:"x86_64", formats:$f}]')
          fi

          ARM_FORMATS="[]"
          [ "${{ inputs.arm64_deb }}"   = "true" ] && ARM_FORMATS=$(echo "$ARM_FORMATS" | jq -c '. + ["deb"]')   || true
          [ "${{ inputs.arm64_rpm }}"   = "true" ] && ARM_FORMATS=$(echo "$ARM_FORMATS" | jq -c '. + ["rpm"]')   || true
          [ "${{ inputs.arm64_tarxz }}" = "true" ] && ARM_FORMATS=$(echo "$ARM_FORMATS" | jq -c '. + ["tarxz"]') || true
          [ "${{ inputs.arm64_pkg }}"   = "true" ] && ARM_FORMATS=$(echo "$ARM_FORMATS" | jq -c '. + ["pkg"]')   || true
          if [ "$(echo "$ARM_FORMATS" | jq 'length')" -gt 0 ]; then
            MATRIX=$(echo "$MATRIX" | jq -c --argjson f "$ARM_FORMATS" \
              '.include += [{arch:"arm64", formats:$f}]')
          fi

          COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "MATRIX = $MATRIX"
          [ "$COUNT" -eq 0 ] && { echo "No build target selected." >&2; exit 1; }
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      kernel_ref: ${{ steps.resolve.outputs.kernel_ref }}
    steps:
      - name: Resolve kernel ref
        id: resolve
        run: |
          set -uo pipefail
          INPUT_REF="${{ inputs.kernel_ref }}"
          REPO="${{ inputs.kernel_repo }}"

          if [ -n "$INPUT_REF" ]; then
            echo "kernel_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Auto-detecting latest ref from: $REPO"

          # 官方 stable 仓库：严格匹配 vX.Y.Z，禁止 rc/next/后缀
          if echo "$REPO" | grep -Eq '(^|/)linux-stable(\.git)?$'; then
            echo "==> Detected stable kernel repository"
            STABLE_TAG=$(git ls-remote --tags --refs "$REPO" 2>/dev/null \
              | awk -F/ '{print $NF}' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -Vr \
              | head -1 || true)
            if [ -n "$STABLE_TAG" ]; then
              echo "Resolved stable ref: $STABLE_TAG"
              echo "kernel_ref=$STABLE_TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "ERROR: no stable vX.Y.Z tag found in $REPO" >&2
            exit 1
          fi

          # 非 stable 仓库：允许 rc / 下游 tag
          PATTERN='^v?[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z._-]+)?$'

          LATEST=$(git ls-remote --tags --refs --sort=-v:refname "$REPO" 2>/dev/null \
            | awk -F/ '{print $NF}' \
            | grep -E "$PATTERN" \
            | head -1 || true)

          if [ -z "$LATEST" ]; then
            echo "WARNING: no version-like tags found, falling back to default branch" >&2
            LATEST=$(git ls-remote --symref "$REPO" HEAD 2>/dev/null \
              | awk '/^ref:/ {sub("refs/heads/","",$2); print $2; exit}')
          fi

          if [ -z "$LATEST" ]; then
            LATEST=$(git ls-remote "$REPO" HEAD 2>/dev/null | awk '{print $1; exit}')
          fi

          [ -z "$LATEST" ] && { echo "ERROR: failed to resolve ref for $REPO" >&2; exit 1; }
          echo "Resolved ref: $LATEST"
          echo "kernel_ref=$LATEST" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, resolve-ref]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - name: Show build target
      run: |
        echo "Arch:    ${{ matrix.arch }}"
        echo "Formats: ${{ join(matrix.formats, ', ') }}"
        echo "Repo:    ${{ inputs.kernel_repo }}"
        echo "Ref:     ${{ needs.resolve-ref.outputs.kernel_ref }}"
        echo "Runner:  ${{ runner.os }} / ${{ runner.arch }}"

    - name: Set arch variables
      id: arch
      run: |
        case "${{ matrix.arch }}" in
          x86_64|amd64)
            echo "karch=x86_64"       >> "$GITHUB_OUTPUT"
            echo "deb_arch=amd64"     >> "$GITHUB_OUTPUT"
            echo "rpm_arch=x86_64"    >> "$GITHUB_OUTPUT"
            echo "arch_boot=arch/x86/boot/bzImage" >> "$GITHUB_OUTPUT"
            ;;
          arm64|aarch64)
            echo "karch=arm64"        >> "$GITHUB_OUTPUT"
            echo "deb_arch=arm64"     >> "$GITHUB_OUTPUT"
            echo "rpm_arch=aarch64"   >> "$GITHUB_OUTPUT"
            echo "arch_boot=arch/arm64/boot/Image" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "Unsupported arch" >&2
            exit 1
            ;;
        esac

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
        df -h /

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libncurses-dev bison flex \
          libssl-dev libelf-dev libdw-dev elfutils \
          bc dwarves zstd c
