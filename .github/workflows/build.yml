name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      x86_64_deb:  { description: 'x86_64  ›  deb', type: boolean, default: true }
      x86_64_rpm:  { description: 'x86_64  ›  rpm', type: boolean, default: false }
      x86_64_pkg:  { description: 'x86_64  ›  pkg.tar.zst', type: boolean, default: false }
      arm64_deb:   { description: 'arm64   ›  deb', type: boolean, default: false }
      arm64_rpm:   { description: 'arm64   ›  rpm', type: boolean, default: false }
      arm64_pkg:   { description: 'arm64   ›  pkg.tar.zst（使用 Arch Linux ARM 容器）', type: boolean, default: false }
      config_choice:
        description: '内核配置来源：default = 内核 defconfig；configs/* = 仓库文件；其他 = 发行版'
        type: choice
        required: true
        default: 'default'
        options:
          - 'default'
          - 'configs/G40_45.config'
          - 'alma'
          - 'alpine'
          - 'arch'
          - 'centos'
          - 'debian'
          - 'fedora'
          - 'gentoo'
          - 'kali'
          - 'manjaro'
          - 'nixos'
          - 'opensuse'
          - 'rhel'
          - 'rocky'
          - 'ubuntu'
          - 'void'
      config_custom:
        description: '（可选）自定义配置：仓库内路径 / http(s):// URL。填了则覆盖上面的选择'
        type: string
        required: false
        default: ''
      kernel_repo:
        description: '内核源码仓库 URL'
        required: true
        default: 'https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git'
      kernel_ref:
        description: '分支或 tag（如 v7.2.6 / master）。留空则自动使用最新 stable 版本'
        required: false
        default: ''
      release_tag:
        description: '（可选）完成后发布到该 tag 的 Release，留空则不发布'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: gen
        run: |
          MATRIX='{"include":[]}'
          add() {
            MATRIX=$(echo "$MATRIX" | jq -c --arg a "$1" --arg f "$2" \
              '.include += [{arch:$a, format:$f}]')
          }
          [ "${{ inputs.x86_64_deb }}" = "true" ] && add x86_64 deb
          [ "${{ inputs.x86_64_rpm }}" = "true" ] && add x86_64 rpm
          [ "${{ inputs.x86_64_pkg }}" = "true" ] && add x86_64 pkg.tar.zst
          [ "${{ inputs.arm64_deb }}"  = "true" ] && add arm64  deb
          [ "${{ inputs.arm64_rpm }}"  = "true" ] && add arm64  rpm
          [ "${{ inputs.arm64_pkg }}"  = "true" ] && add arm64  pkg.tar.zst
          COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "MATRIX = $MATRIX"
          [ "$COUNT" -eq 0 ] && { echo "No build target selected." >&2; exit 1; }
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      kernel_ref: ${{ steps.resolve.outputs.kernel_ref }}
    steps:
      - name: Resolve kernel ref
        id: resolve
        run: |
          INPUT_REF="${{ inputs.kernel_ref }}"
          if [ -n "$INPUT_REF" ]; then
            echo "kernel_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else
            LATEST=$(git ls-remote --tags --refs --sort=-v:refname \
              https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git \
              | awk -F/ '{print $NF}' \
              | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | head -1)
            [ -z "$LATEST" ] && { echo "ERROR: failed to detect" >&2; exit 1; }
            echo "kernel_ref=$LATEST" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [prepare, resolve-ref]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - name: Show build target
      run: |
        echo "Arch:   ${{ matrix.arch }}"
        echo "Format: ${{ matrix.format }}"
        echo "Ref:    ${{ needs.resolve-ref.outputs.kernel_ref }}"
        echo "Runner: ${{ runner.os }} / ${{ runner.arch }}"

    - name: Set arch variables
      id: arch
      run: |
        case "${{ matrix.arch }}" in
          x86_64|amd64)
            echo "karch=x86_64"   >> "$GITHUB_OUTPUT"
            echo "deb_arch=amd64" >> "$GITHUB_OUTPUT"
            echo "carch=x86_64"   >> "$GITHUB_OUTPUT"
            ;;
          arm64|aarch64)
            echo "karch=arm64"    >> "$GITHUB_OUTPUT"
            echo "deb_arch=arm64" >> "$GITHUB_OUTPUT"
            echo "carch=aarch64"  >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "Unsupported arch" >&2
            exit 1
            ;;
        esac

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
        df -h /

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libncurses-dev bison flex \
          libssl-dev libelf-dev libdw-dev elfutils \
          bc dwarves zstd cpio rsync kmod \
          git jq curl
        case "${{ matrix.format }}" in
          deb) sudo apt-get install -y debhelper fakeroot ;;
          rpm) sudo apt-get install -y rpm rpm2cpio cpio ;;
        esac

    - name: Clone kernel source
      run: |
        git clone --depth 1 --branch "${{ needs.resolve-ref.outputs.kernel_ref }}" \
          "${{ inputs.kernel_repo }}" kernel-source

    - name: Resolve and apply config
      run: |
        CHOICE="${{ inputs.config_choice }}"
        CUSTOM="${{ inputs.config_custom }}"
        KARCH="${{ steps.arch.outputs.karch }}"
        CONFIG_OUT="/tmp/kernel.config"
        [ -n "$CUSTOM" ] && CHOICE="$CUSTOM"

        if [ -z "$CHOICE" ] || [ "$CHOICE" = "default" ]; then
          cd kernel-source
          make ARCH="$KARCH" defconfig
          cp .config "$CONFIG_OUT"
          cd ..
        elif [[ "$CHOICE" == http://* ]] || [[ "$CHOICE" == https://* ]]; then
          curl -fSL "$CHOICE" -o "$CONFIG_OUT"
        elif [ -f "$CHOICE" ]; then
          cp "$CHOICE" "$CONFIG_OUT"
        elif [ -f "configs/$CHOICE" ]; then
          cp "configs/$CHOICE" "$CONFIG_OUT"
        else
          case "$CHOICE" in
            alma)     URL='https://git.almalinux.org/rpms/kernel/-/raw/c9/f/kernel-x86_64-fedora.config' ;;
            alpine)   URL='https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/linux-lts/config-lts.x86_64' ;;
            arch)     URL='https://gitlab.archlinux.org/archlinux/packaging/packages/linux/-/raw/main/config' ;;
            centos)   URL='https://gitlab.com/redhat/centos-stream/rpms/kernel/-/raw/c9s/f/kernel-x86_64-fedora.config' ;;
            debian)   URL='https://salsa.debian.org/kernel-team/linux/-/raw/debian/latest/debian/config/config' ;;
            fedora)   URL='https://src.fedoraproject.org/rpms/kernel/raw/rawhide/f/kernel-x86_64-fedora.config' ;;
            gentoo)   URL='https://gitweb.gentoo.org/proj/gentoo-kernel.git/plain/default_config' ;;
            kali)     URL='https://gitlab.com/kalilinux/packages/linux/-/raw/kali/master/debian/config/config' ;;
            manjaro)  URL='https://gitlab.manjaro.org/packages/core/linux/-/raw/master/config' ;;
            nixos)    URL='https://raw.githubusercontent.com/NixOS/nixpkgs/master/pkgs/os-specific/linux/kernel/common-config.nix' ;;
            opensuse) URL='https://raw.githubusercontent.com/openSUSE/kernel-source/master/config/x86_64/default' ;;
            rhel)     URL='https://gitlab.com/redhat/centos-stream/rpms/kernel/-/raw/c9s/f/kernel-x86_64-fedora.config' ;;
            rocky)    URL='https://git.rockylinux.org/rocky/kernel/-/raw/r9/f/kernel-x86_64-fedora.config' ;;
            ubuntu)   URL='https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/jammy/plain/debian.master/config/amd64/config.flavour.generic' ;;
            void)     URL='https://raw.githubusercontent.com/void-linux/void-packages/master/srcpkgs/linux/files/x86_64-dotconfig' ;;
            *) echo "Unknown config_choice: $CHOICE" >&2; exit 1 ;;
          esac
          curl -fSL "$URL" -o "$CONFIG_OUT" || { echo "ERROR: download $URL failed" >&2; exit 1; }
        fi

        [ -s "$CONFIG_OUT" ] || { echo "ERROR: empty config" >&2; exit 1; }
        echo "config lines: $(wc -l < "$CONFIG_OUT")"
        cd kernel-source
        cp "$CONFIG_OUT" .config
        make ARCH="$KARCH" olddefconfig

    - name: Build kernel packages (deb / rpm)
      if: matrix.format != 'pkg.tar.zst'
      run: |
        cd kernel-source
        case "${{ matrix.format }}" in
          deb)
            make ARCH=${{ steps.arch.outputs.karch }} \
                 KDEB_ARCH=${{ steps.arch.outputs.deb_arch }} \
                 KDEB_OPTS="-a${{ steps.arch.outputs.deb_arch }}" \
                 DEB_EXCLUDE_PKG="linux-libc-dev linux-image-%-dbg" \
                 -j$(nproc) bindeb-pkg
            ;;
          rpm)
            make ARCH=${{ steps.arch.outputs.karch }} \
                 KCFLAGS="-g0" \
                 RPM_BUILD_NCPUS=$(nproc) \
                 RPMOPTS="--define '_topdir $PWD/rpmbuild'" \
                 -j$(nproc) binrpm-pkg
            ;;
        esac

    - name: Build kernel packages (pkg.tar.zst)
      if: matrix.format == 'pkg.tar.zst'
      run: |
        set -euo pipefail

        case "${{ matrix.arch }}" in
          x86_64) ARCH_IMAGE="archlinux:latest" ;;
          arm64)  ARCH_IMAGE="menci/archlinuxarm:base-devel" ;;
        esac
        echo "Using Arch container image: $ARCH_IMAGE"

        STAGE="$(mktemp -d)"
        mkdir -p "$STAGE/out"
        cp /tmp/kernel.config "$STAGE/kernel.config"
        chmod 644 "$STAGE/kernel.config"

        cat > "$STAGE/root-part.sh" <<'ROOT_EOF'
        #!/bin/bash
        set -e

        sed -i "s/^#DisableSandbox/DisableSandbox/" /etc/pacman.conf

        pacman -Sy --noconfirm --needed --disable-sandbox \
          base-devel git libarchive jq bc rsync kmod inetutils \
          elfutils debugedit zstd pahole

        # 关掉 -Werror=format-security（bpftool bootstrap 编译用）
        sed -i 's/-Werror=format-security/-Wno-error=format-security/g' /etc/makepkg.conf
        echo "---- makepkg.conf CFLAGS after patch ----"
        grep -E '^(CFLAGS|CXXFLAGS)=' /etc/makepkg.conf || true
        echo "---- end ----"

        useradd -m builder 2>/dev/null || true

        cp /host-staging/kernel.config    /home/builder/kernel.config
        cp /host-staging/builder-part.sh  /home/builder/builder-part.sh
        chmod 644 /home/builder/kernel.config
        chmod 755 /home/builder/builder-part.sh
        chown -R builder:builder /home/builder/kernel.config /home/builder/builder-part.sh

        su - builder -s /bin/bash -c 'bash ~/builder-part.sh'
        ROOT_EOF
        chmod +x "$STAGE/root-part.sh"

        cat > "$STAGE/builder-part.sh" <<'BUILDER_EOF'
        #!/bin/bash
        set -uo pipefail
        cd "$HOME"

        KCONF_ENABLE="CONFIG_DEBUG_KERNEL CONFIG_DEBUG_INFO CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT CONFIG_DEBUG_INFO_BTF CONFIG_DEBUG_INFO_BTF_MODULES"
        KCONF_DISABLE="CONFIG_DEBUG_INFO_NONE CONFIG_DEBUG_INFO_SPLIT CONFIG_DEBUG_INFO_REDUCED CONFIG_GCC_PLUGIN_RANDSTRUCT CONFIG_WERROR CONFIG_LD_ORPHAN_WARN"

        fix_kconfig() {
          local f="$1"
          for opt in $KCONF_ENABLE; do
            sed -i "/^# ${opt} is not set/d" "$f"
            sed -i "/^${opt}=/d" "$f"
            echo "${opt}=y" >> "$f"
          done
          for opt in $KCONF_DISABLE; do
            sed -i "/^${opt}=/d" "$f"
            sed -i "/^# ${opt} is not set/d" "$f"
            echo "# ${opt} is not set" >> "$f"
          done
          sed -i '/^CONFIG_LD_ORPHAN_WARN_LEVEL=/d' "$f"
          echo 'CONFIG_LD_ORPHAN_WARN_LEVEL="warn"' >> "$f"
        }

        check_kconfig() {
          local f="$1" fail=0
          for opt in CONFIG_DEBUG_KERNEL CONFIG_DEBUG_INFO CONFIG_DEBUG_INFO_BTF; do
            grep -q "^${opt}=y" "$f" || { echo "MISSING: ${opt}=y" >&2; fail=1; }
          done
          for opt in $KCONF_DISABLE; do
            grep -q "^${opt}=y" "$f" && { echo "BAD: ${opt}=y" >&2; fail=1; }
          done
          grep -q '^CONFIG_LD_ORPHAN_WARN_LEVEL="error"' "$f" && { echo "BAD: LD_ORPHAN_WARN_LEVEL=error" >&2; fail=1; }
          return $fail
        }

        git clone --depth 1 \
          https://gitlab.archlinux.org/archlinux/packaging/packages/linux.git \
          arch-pkg
        cd arch-pkg

        sed -i "s/^pkgbase=.*/pkgbase=linux-custom/" PKGBUILD

        # 跳过 htmldocs（需 python-yaml + TeX Live 几 GB）
        sed -i 's/make htmldocs/: # htmldocs disabled/g' PKGBUILD
        echo "---- PKGBUILD htmldocs check ----"
        grep -q htmldocs PKGBUILD && { echo "WARN: htmldocs still present:"; grep -n htmldocs PKGBUILD; } || echo "OK: no htmldocs"
        echo "---- end ----"

        mkdir -p src
        CARCH_LOCAL="${CARCH:-$(uname -m)}"
        for name in config config.x86_64 config.aarch64 config.arm64 "config.${CARCH_LOCAL}"; do
          cp ~/kernel.config "src/$name"
        done
        cp ~/kernel.config config

        sed -i -E "s|cp[[:space:]]+(\"?\\\$\{srcdir\}/)?\.?\.?/?config\.[^[:space:]\"]+[[:space:]]+\.config|cp /tmp/kernel.config .config|g" PKGBUILD
        sed -i -E "s|cp[[:space:]]+\"?\\\$\{srcdir\}/config\"?[[:space:]]+\.config|cp /tmp/kernel.config .config|g" PKGBUILD

        echo ""
        echo "════════════ makepkg -o (prepare only) ════════════"
        makepkg -o --noconfirm --nodeps --ignorearch --skipinteg
        PREPARE_RC=$?
        echo "makepkg -o exit code: $PREPARE_RC"
        [ "$PREPARE_RC" -eq 0 ] || { echo "FATAL: prepare failed" >&2; exit $PREPARE_RC; }

        SRC_DIR=$(find "$HOME/arch-pkg/src" -maxdepth 1 -type d -name 'linux-*' | head -1)
        echo "SRC_DIR=$SRC_DIR"
        [ -n "$SRC_DIR" ] || { echo "FATAL: no source dir" >&2; exit 1; }

        cp ~/kernel.config "$SRC_DIR/.config"
        fix_kconfig "$SRC_DIR/.config"

        if ! check_kconfig "$SRC_DIR/.config"; then
          echo "FATAL: kconfig check failed" >&2
          grep -nE 'DEBUG_INFO|BTF|RANDSTRUCT|WERROR|ORPHAN' "$SRC_DIR/.config" >&2
          exit 1
        fi

        # ── 关键：手动跑一次 syncconfig，让 auto.conf 与 .config 一致 ──
        # 目的：避免 makepkg -e 里的 make 首次触发 syncconfig 时把 BTF 选项关掉。
        #      若 syncconfig 后 BTF 被关，说明 7.2.8 有新依赖我们没满足，立刻报错。
        case "$(uname -m)" in
          x86_64|amd64) KARCH_SYNC="x86_64" ;;
          aarch64|arm64) KARCH_SYNC="arm64" ;;
          *) KARCH_SYNC="$(uname -m)" ;;
        esac
        echo ""
        echo "════════════ make syncconfig ════════════"
        (cd "$SRC_DIR" && make ARCH="$KARCH_SYNC" syncconfig >/dev/null 2>&1) \
          || echo "WARN: syncconfig returned non-zero"
        echo ""
        echo "════════════ Verifying kconfig after syncconfig ════════════"
        if ! check_kconfig "$SRC_DIR/.config"; then
          echo "FATAL: BTF config was stripped by syncconfig (7.2.8 dependency missing)" >&2
          grep -nE 'DEBUG_INFO|BTF|RANDSTRUCT|WERROR|ORPHAN' "$SRC_DIR/.config" >&2
          exit 1
        fi
        echo "kconfig still OK after syncconfig."

        echo ""
        echo "════════════ makepkg -e (build only) ════════════"
        makepkg -e --noconfirm --nodeps --ignorearch --skipinteg
        BUILD_RC=$?
        echo "makepkg -e exit code: $BUILD_RC"

        # ── 诊断 ──
        echo ""
        echo "════════════ CONTAINER-SIDE DIAGNOSTICS ════════════"
        echo "[1] .config BTF/WERROR lines:"
        grep -nE 'DEBUG_INFO|BTF|RANDSTRUCT|WERROR|ORPHAN' "$SRC_DIR/.config" || echo "(none)"
        echo ""
        echo "[2] vmlinux files:"
        ls -la "$SRC_DIR"/vmlinux* 2>/dev/null || echo "(no vmlinux files)"
        echo ""
        echo "[3] vmlinux .BTF section:"
        if [ -f "$SRC_DIR/vmlinux" ]; then
          readelf -S "$SRC_DIR/vmlinux" 2>/dev/null | grep -i BTF || echo "(NO .BTF SECTION)"
        else
          echo "(no vmlinux)"
        fi
        echo ""
        echo "[4] .vmlinux.btf.cmd:"
        [ -f "$SRC_DIR/.vmlinux.btf.cmd" ] && cat "$SRC_DIR/.vmlinux.btf.cmd" || echo "(not found)"
        echo ""
        echo "[5] scripts/pahole-flags.sh:"
        if [ -f "$SRC_DIR/scripts/pahole-flags.sh" ]; then
          cat "$SRC_DIR/scripts/pahole-flags.sh"
        else
          echo "(file not found)"
        fi
        echo ""
        echo "[6] pahole version:"
        pahole --version 2>&1 || true
        echo "════════════════════════════════════════════════════"

        exit "${BUILD_RC:-1}"
        BUILDER_EOF
        chmod +x "$STAGE/builder-part.sh"

        CID=$(docker run -d -v "$STAGE:/host-staging:ro" "$ARCH_IMAGE" sleep infinity)
        docker exec -u 0 "$CID" bash -c '
          cp /host-staging/kernel.config   /tmp/kernel.config
          cp /host-staging/root-part.sh    /tmp/root-part.sh
          cp /host-staging/builder-part.sh /tmp/builder-part.sh
          chmod 644 /tmp/kernel.config
          chmod +x /tmp/root-part.sh /tmp/builder-part.sh
          /tmp/root-part.sh
        '

        docker cp "$CID:/home/builder/arch-pkg/." "$STAGE/out/"
        docker rm -f "$CID" >/dev/null 2>&1 || true
        sudo chown -R "$(id -u):$(id -g)" "$STAGE/out"

        mkdir -p dist
        find "$STAGE/out" -maxdepth 1 -type f -name '*.pkg.tar.zst' -exec mv {} dist/ \;
        rm -rf "$STAGE"
        ls -lh dist/
        test -n "$(find dist -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"

    - name: Collect artifacts
      run: |
        mkdir -p dist
        case "${{ matrix.format }}" in
          deb)
            find kernel-source/.. -maxdepth 1 -type f -name 'linux-image-*.deb' \
              ! -name '*-dbg_*.deb' -exec mv {} dist/ \;
            find kernel-source/.. -maxdepth 1 -type f -name 'linux-headers-*.deb' -exec mv {} dist/ \;
            ;;
          rpm)
            find kernel-source/rpmbuild/RPMS -type f -name '*.rpm' -exec mv {} dist/ \;
            ;;
        esac
        ls -lh dist/
        test -n "$(find dist -maxdepth 1 -type f -print -quit)"

    - uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ matrix.format }}-${{ matrix.arch }}
        path: dist/*
        if-no-files-found: error
        retention-days: 7

  publish:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kernel-*
          merge-multiple: true
      - run: ls -lh dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: dist/*
          generate_release_notes: true
          overwrite_files: true
