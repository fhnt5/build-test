name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      x86_64_deb:
        description: '构建 x86_64 deb 包（内核镜像 + 模块）'
        type: boolean
        default: true
      x86_64_rpm:
        description: '构建 x86_64 rpm 包（内核镜像 + 模块）'
        type: boolean
        default: false
      x86_64_tarxz:
        description: '构建 x86_64 tar.xz 通用包（解压即用）'
        type: boolean
        default: false
      x86_64_pkg:
        description: '构建 x86_64 pkg.tar.zst（Arch 风格包）'
        type: boolean
        default: false
      arm64_deb:
        description: '构建 arm64 deb 包（内核镜像 + 模块）'
        type: boolean
        default: false
      arm64_rpm:
        description: '构建 arm64 rpm 包（内核镜像 + 模块）'
        type: boolean
        default: false
      arm64_tarxz:
        description: '构建 arm64 tar.xz 通用包（解压即用）'
        type: boolean
        default: false
      arm64_pkg:
        description: '构建 arm64 pkg.tar.zst（Arch 风格包）'
        type: boolean
        default: false
      config_choice:
        description: '内核配置预设：default=默认 defconfig，tinyconfig=最小配置，或选发行版配置名'
        type: choice
        default: 'default'
        options:
          - 'default'
          - 'allyesconfig'
          - 'allmodconfig'
          - 'allnoconfig'
          - 'tinyconfig'
          - 'configs/G40_45.config'
          - 'alma'
          - 'alpine'
          - 'arch'
          - 'centos'
          - 'debian'
          - 'fedora'
          - 'gentoo'
          - 'kali'
          - 'manjaro'
          - 'nixos'
          - 'opensuse'
          - 'rhel'
          - 'rocky'
          - 'ubuntu'
          - 'void'
      config_custom:
        description: '自定义配置：本地路径（如 arch/x86/configs/my_defconfig）或 HTTP(S) 链接'
        type: string
        default: ''
      respect_config:
        description: '严格模式：原样拷贝 .config，跳过 olddefconfig 和 orphan-warn 修补（推荐开启）'
        type: boolean
        default: true
      include_headers:
        description: '构建独立的 headers 包（外挂模块编译必需）'
        type: boolean
        default: true
      headers_full_tree:
        description: 'headers 包拷贝完整源码树（开启=忠实还原，关闭=仅最小子集）'
        type: boolean
        default: true
      strip_modules:
        description: '剥离模块调试符号（体积更小，但无法调试模块）'
        type: boolean
        default: false
      tarxz_include_headers:
        description: 'tar.xz 包内包含 headers 目录（让 tar.xz 自包含所有内容）'
        type: boolean
        default: true
      parallel_jobs:
        description: '并行编译任务数：auto = 自动检测 CPU 核心数'
        type: choice
        default: 'auto'
        options:
          - 'auto'
          - '1'
          - '2'
          - '4'
          - '8'
          - '16'
      ccache:
        description: '启用 ccache 编译器缓存（重编译加速，但占用更多磁盘）'
        type: boolean
        default: false
      lto_mode:
        description: 'LLVM 链接时优化：none=关闭，full=最大优化，thin=链接更快'
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'full'
          - 'thin'
      tune_profile:
        description: '内核调优预设：none=原版，default=关调试日志刷屏，performance=NO_HZ_FULL+关缓解，lowlatency=抢占+1000Hz，minimal=-Os+关模块签名，debugoff=干掉 KASAN/ftrace/探针'
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'default'
          - 'performance'
          - 'lowlatency'
          - 'minimal'
          - 'debugoff'
      kernel_repo:
        description: '内核源码 git 仓库地址（默认：linux-stable）'
        type: string
        default: 'https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git'
      kernel_ref:
        description: 'git 分支或标签（留空 = stable 仓库自动检测最新稳定版，其他仓库取最新标签）'
        type: string
        default: ''
      release_tag:
        description: '填了就发布 GitHub Release（用这个标签名），留空只上传制品不发布'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: 生成构建矩阵
        id: gen
        run: |
          set -uo pipefail
          MATRIX='{"include":[]}'
          X86_FORMATS="[]"
          if [ "${{ inputs.x86_64_deb }}" = "true" ]; then
            X86_FORMATS=$(echo "$X86_FORMATS" | jq -c '. + ["deb"]')
          fi
          if [ "${{ inputs.x86_64_rpm }}" = "true" ]; then
            X86_FORMATS=$(echo "$X86_FORMATS" | jq -c '. + ["rpm"]')
          fi
          if [ "${{ inputs.x86_64_tarxz }}" = "true" ]; then
            X86_FORMATS=$(echo "$X86_FORMATS" | jq -c '. + ["tarxz"]')
          fi
          if [ "${{ inputs.x86_64_pkg }}" = "true" ]; then
            X86_FORMATS=$(echo "$X86_FORMATS" | jq -c '. + ["pkg"]')
          fi
          if [ "$(echo "$X86_FORMATS" | jq 'length')" -gt 0 ]; then
            MATRIX=$(echo "$MATRIX" | jq -c --argjson f "$X86_FORMATS" '.include += [{"arch":"x86_64","formats":$f}]')
          fi
          ARM_FORMATS="[]"
          if [ "${{ inputs.arm64_deb }}" = "true" ]; then
            ARM_FORMATS=$(echo "$ARM_FORMATS" | jq -c '. + ["deb"]')
          fi
          if [ "${{ inputs.arm64_rpm }}" = "true" ]; then
            ARM_FORMATS=$(echo "$ARM_FORMATS" | jq -c '. + ["rpm"]')
          fi
          if [ "${{ inputs.arm64_tarxz }}" = "true" ]; then
            ARM_FORMATS=$(echo "$ARM_FORMATS" | jq -c '. + ["tarxz"]')
          fi
          if [ "${{ inputs.arm64_pkg }}" = "true" ]; then
            ARM_FORMATS=$(echo "$ARM_FORMATS" | jq -c '. + ["pkg"]')
          fi
          if [ "$(echo "$ARM_FORMATS" | jq 'length')" -gt 0 ]; then
            MATRIX=$(echo "$MATRIX" | jq -c --argjson f "$ARM_FORMATS" '.include += [{"arch":"arm64","formats":$f}]')
          fi
          COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "没选任何构建目标" >&2
            exit 1
          fi

  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      kernel_ref: ${{ steps.resolve.outputs.kernel_ref }}
    steps:
      - name: 解析内核版本引用
        id: resolve
        run: |
          set -uo pipefail
          INPUT_REF="${{ inputs.kernel_ref }}"
          REPO="${{ inputs.kernel_repo }}"
          if [ -n "$INPUT_REF" ]; then
            echo "kernel_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$REPO" | grep -Eq '(^|/)linux-stable(\.git)?$'; then
            STABLE_TAG=$(git ls-remote --tags --refs "$REPO" 2>/dev/null \
              | awk -F/ '{print $NF}' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -Vr \
              | head -1 || true)
            if [ -n "$STABLE_TAG" ]; then
              echo "kernel_ref=$STABLE_TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "ERROR: 找不到 stable 标签" >&2
            exit 1
          fi
          PATTERN='^v?[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z._-]+)?$'
          LATEST=$(git ls-remote --tags --refs --sort=-v:refname "$REPO" 2>/dev/null \
            | awk -F/ '{print $NF}' | grep -E "$PATTERN" | head -1 || true)
          if [ -z "$LATEST" ]; then
            LATEST=$(git ls-remote --symref "$REPO" HEAD 2>/dev/null \
              | awk '/^ref:/ {sub("refs/heads/","",$2); print $2; exit}')
          fi
          if [ -z "$LATEST" ]; then
            LATEST=$(git ls-remote "$REPO" HEAD 2>/dev/null | awk '{print $1; exit}')
          fi
          if [ -z "$LATEST" ]; then
            echo "ERROR: 无法解析版本引用" >&2
            exit 1
          fi
          echo "kernel_ref=$LATEST" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, resolve-ref]
    runs-on: ${{ matrix.arch == 'arm64' && fromJSON('"ubuntu-24.04-arm"') || 'ubuntu-latest' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: 设置架构变量
        id: arch
        run: |
          case "${{ matrix.arch }}" in
            x86_64|amd64)
              echo "karch=x86_64" >> "$GITHUB_OUTPUT"
              echo "deb_arch=amd64" >> "$GITHUB_OUTPUT"
              echo "rpm_arch=x86_64" >> "$GITHUB_OUTPUT"
              echo "arch_boot=arch/x86/boot/bzImage" >> "$GITHUB_OUTPUT"
              ;;
            arm64|aarch64)
              echo "karch=arm64" >> "$GITHUB_OUTPUT"
              echo "deb_arch=arm64" >> "$GITHUB_OUTPUT"
              echo "rpm_arch=aarch64" >> "$GITHUB_OUTPUT"
              echo "arch_boot=arch/arm64/boot/Image" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "不支持的架构" >&2
              exit 1
              ;;
          esac

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex \
            libssl-dev libelf-dev libdw-dev elfutils bc dwarves zstd cpio \
            rsync kmod xz-utils dpkg-dev rpm git jq curl ccache \
            clang lld llvm

      - name: 克隆内核源码
        run: |
          set -euo pipefail
          REF="${{ needs.resolve-ref.outputs.kernel_ref }}"
          REPO="${{ inputs.kernel_repo }}"
          if ! git clone --depth 1 --branch "$REF" "$REPO" kernel-source; then
            rm -rf kernel-source
            git clone --branch "$REF" "$REPO" kernel-source
          fi

      - name: 解析并应用配置
        run: |
          set -euo pipefail
          CHOICE="${{ inputs.config_choice }}"
          CUSTOM="${{ inputs.config_custom }}"
          KARCH="${{ steps.arch.outputs.karch }}"
          CONFIG_OUT="/tmp/kernel.config"

          if [ -n "$CUSTOM" ]; then
            CHOICE="$CUSTOM"
          fi

          if echo "$CHOICE" | grep -qE '^https?://'; then
            curl -fSL "$CHOICE" -o "$CONFIG_OUT"
          elif echo "$CHOICE" | grep -qE '^make:'; then
            TARGET="${CHOICE#make:}"
            cd kernel-source
            make ARCH="$KARCH" "$TARGET"
            cp .config "$CONFIG_OUT"
            cd ..
          elif [ -f "$CHOICE" ]; then
            cp "$CHOICE" "$CONFIG_OUT"
          elif [ -f "configs/$CHOICE" ]; then
            cp "configs/$CHOICE" "$CONFIG_OUT"
          elif echo "$CHOICE" | grep -qE '^(default|allyesconfig|allmodconfig|allnoconfig|tinyconfig)$'; then
            cd kernel-source
            make ARCH="$KARCH" "$CHOICE"
            cp .config "$CONFIG_OUT"
            cd ..
          else
            case "$CHOICE" in
              alma)     URL='https://git.almalinux.org/rpms/kernel/-/raw/c9/f/kernel-x86_64-fedora.config' ;;
              alpine)   URL='https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/linux-lts/config-lts.x86_64' ;;
              arch)     URL='https://gitlab.archlinux.org/archlinux/packaging/packages/linux/-/raw/main/config' ;;
              centos)   URL='https://gitlab.com/redhat/centos-stream/rpms/kernel/-/raw/c9s/f/kernel-x86_64-fedora.config' ;;
              debian)   URL='https://salsa.debian.org/kernel-team/linux/-/raw/debian/latest/debian/config/config' ;;
              fedora)   URL='https://src.fedoraproject.org/rpms/kernel/raw/rawhide/f/kernel-x86_64-fedora.config' ;;
              gentoo)   URL='https://gitweb.gentoo.org/proj/gentoo-kernel.git/plain/default_config' ;;
              kali)     URL='https://gitlab.com/kalilinux/packages/linux/-/raw/kali/master/debian/config/config' ;;
              manjaro)  URL='https://gitlab.manjaro.org/packages/core/linux/-/raw/master/config' ;;
              nixos)    URL='https://raw.githubusercontent.com/NixOS/nixpkgs/master/pkgs/os-specific/linux/kernel/common-config.nix' ;;
              opensuse) URL='https://raw.githubusercontent.com/openSUSE/kernel-source/master/config/x86_64/default' ;;
              rhel)     URL='https://gitlab.com/redhat/centos-stream/rpms/kernel/-/raw/c9s/f/kernel-x86_64-fedora.config' ;;
              rocky)    URL='https://git.rockylinux.org/rocky/kernel/-/raw/r9/f/kernel-x86_64-fedora.config' ;;
              ubuntu)   URL='https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/jammy/plain/debian.master/config/amd64/config.flavour.generic' ;;
              void)     URL='https://raw.githubusercontent.com/void-linux/void-packages/master/srcpkgs/linux/files/x86_64-dotconfig' ;;
              *) echo "未知配置: $CHOICE" >&2; exit 1 ;;
            esac
            if [ "$KARCH" = "arm64" ]; then
              case "$CHOICE" in
                alma|centos|fedora|rhel|rocky)
                  URL='https://git.almalinux.org/rpms/kernel/-/raw/c9/f/kernel-aarch64-fedora.config' ;;
                alpine)
                  URL='https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/linux-lts/config-lts.aarch64' ;;
                opensuse)
                  URL='https://raw.githubusercontent.com/openSUSE/kernel-source/master/config/arm64/default' ;;
                ubuntu)
                  URL='https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/jammy/plain/debian.master/config/arm64/config.flavour.generic' ;;
                void)
                  URL='https://raw.githubusercontent.com/void-linux/void-packages/master/srcpkgs/linux/files/aarch64-dotconfig' ;;
              esac
            fi
            curl -fSL "$URL" -o "$CONFIG_OUT"
          fi

          cd kernel-source
          cp "$CONFIG_OUT" .config

          if [ "${{ inputs.respect_config }}" != "true" ]; then
            sed -i '/^CONFIG_LD_ORPHAN_WARN_LEVEL=/d' .config
            echo 'CONFIG_LD_ORPHAN_WARN_LEVEL="warn"' >> .config
            make ARCH="$KARCH" olddefconfig </dev/null
          fi

      - name: 应用调优预设
        run: |
          set -euo pipefail
          cd kernel-source
          KARCH="${{ steps.arch.outputs.karch }}"
          TWEAKED=false

          case "${{ inputs.tune_profile }}" in
            performance)
              TWEAKED=true
              for c in NO_HZ_FULL RCU_NOCBS PREEMPT_DYNAMIC CPU_FREQ_DEFAULT_GOV_PERFORMANCE; do
                sed -i "/^CONFIG_${c}=/d" .config
                echo "CONFIG_${c}=y" >> .config
              done
              for c in MITIGATION_RETPOLINE MITIGATION_SPECTRE_BHI MITIGATION_IBPB_ENTRY \
                        MITIGATION_IBRS_ENTRY MITIGATION_L1TF MITIGATION_PTI; do
                sed -i "/^CONFIG_${c}=/d" .config
                echo "# CONFIG_${c} is not set" >> .config
              done
              sed -i '/^CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND=/d' .config
              echo "# CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND is not set" >> .config
              ;;
            lowlatency)
              TWEAKED=true
              sed -i '/^CONFIG_PREEMPT=/d' .config
              sed -i '/^CONFIG_PREEMPT_VOLUNTARY=/d' .config
              sed -i '/^CONFIG_PREEMPT_NONE=/d' .config
              echo "CONFIG_PREEMPT=y" >> .config
              sed -i '/^CONFIG_HZ_250=/d' .config
              sed -i '/^CONFIG_HZ_300=/d' .config
              sed -i '/^CONFIG_HZ_100=/d' .config
              echo "CONFIG_HZ_1000=y" >> .config
              sed -i '/^CONFIG_RCU_BOOST=/d' .config
              echo "CONFIG_RCU_BOOST=y" >> .config
              ;;
            minimal)
              TWEAKED=true
              sed -i '/^CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=/d' .config
              echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> .config
              for c in MODULE_SIG MODULE_SIG_ALL MODULE_SIG_FORCE; do
                sed -i "/^CONFIG_${c}=/d" .config
                echo "# CONFIG_${c} is not set" >> .config
              done
              ;;
            debugoff)
              TWEAKED=true
              for c in KASAN KMSAN KCSAN KFENCE KMEMLEAK DEBUG_INFO DWARF_TOOLCHAIN_DEFAULT \
                        FTRACE FUNCTION_TRACER FUNCTION_GRAPH_TRACER STACK_TRACER \
                        KPROBES UPROBES TRACEPOINTS DEBUG_FS SLUB_DEBUG \
                        DEBUG_PAGEALLOC DEBUG_KMEMLEAK DEBUG_STACK_USAGE \
                        SCHEDSTATS LATENCYTOP LOCK_STAT; do
                sed -i "/^CONFIG_${c}=/d" .config
                echo "# CONFIG_${c} is not set" >> .config
              done
              ;;
            default)
              TWEAKED=true
              for c in DEBUG_BUGVERBOSE DEBUG_LIST DEBUG_SG DEBUG_NOTIFIERS DEBUG_CREDENTIALS \
                        RCU_TRACE SCHED_DEBUG PRINTK_TIME DYNAMIC_DEBUG DEBUG_ATOMIC_SLEEP \
                        DEBUG_PREEMPT DEBUG_SPINLOCK DEBUG_MUTEXES DEBUG_RT_MUTEXES \
                        DEBUG_WW_MUTEX_SLOWPATH DEBUG_LOCK_ALLOC DEBUG_LOCKDEP \
                        DEBUG_KOBJECT DEBUG_KOBJECT_RELEASE; do
                sed -i "/^CONFIG_${c}=/d" .config
                echo "# CONFIG_${c} is not set" >> .config
              done
              ;;
            none)
              ;;
          esac

          if [ "$TWEAKED" = "true" ] && [ "${{ inputs.respect_config }}" != "true" ]; then
            make ARCH="$KARCH" olddefconfig </dev/null
          fi

      - name: 编译内核
        run: |
          set -euo pipefail
          cd kernel-source
          KARCH="${{ steps.arch.outputs.karch }}"

          JOBS="${{ inputs.parallel_jobs }}"
          if [ "$JOBS" = "auto" ]; then
            JOBS=$(nproc)
          fi

          MAKE_ARGS="ARCH=$KARCH -j$JOBS"

          if [ "${{ inputs.ccache }}" = "true" ]; then
            export PATH="/usr/lib/ccache:$PATH"
            export CC="ccache gcc"
            export HOSTCC="ccache gcc"
          fi

          LTO="${{ inputs.lto_mode }}"
          if [ "$LTO" != "none" ]; then
            MAKE_ARGS="$MAKE_ARGS LLVM=1"
            sed -i '/^CONFIG_LTO=/d' .config
            echo "CONFIG_LTO=y" >> .config
            if [ "$LTO" = "full" ]; then
              sed -i '/^CONFIG_LTO_CLANG_FULL=/d' .config
              echo "CONFIG_LTO_CLANG_FULL=y" >> .config
            else
              sed -i '/^CONFIG_LTO_CLANG_THIN=/d' .config
              echo "CONFIG_LTO_CLANG_THIN=y" >> .config
            fi
            sed -i '/^CONFIG_LTO_NONE=/d' .config
            echo "# CONFIG_LTO_NONE is not set" >> .config
          fi

          make $MAKE_ARGS

      - name: 暂存内核产物
        id: stage
        run: |
          set -euo pipefail
          cd kernel-source
          KARCH="${{ steps.arch.outputs.karch }}"
          KIMAGE="${{ steps.arch.outputs.arch_boot }}"

          KVER="$(make ARCH="$KARCH" -s kernelrelease)"
          echo "内核版本: $KVER"
          STAGE_DIR="$(mktemp -d)"
          echo "STAGE=$STAGE_DIR" >> "$GITHUB_ENV"
          echo "KVER=$KVER" >> "$GITHUB_ENV"

          mkdir -p "$STAGE_DIR/boot"
          cp "$KIMAGE" "$STAGE_DIR/boot/vmlinuz-${KVER}"
          cp System.map "$STAGE_DIR/boot/System.map-${KVER}"
          cp .config "$STAGE_DIR/boot/config-${KVER}"

          if [ "${{ inputs.strip_modules }}" = "true" ]; then
            make ARCH="$KARCH" modules_install INSTALL_MOD_PATH="$STAGE_DIR" INSTALL_MOD_STRIP=1
          else
            make ARCH="$KARCH" modules_install INSTALL_MOD_PATH="$STAGE_DIR"
          fi
          rm -f "$STAGE_DIR/lib/modules/${KVER}/build" "$STAGE_DIR/lib/modules/${KVER}/source"

      - name: 暂存 headers
        if: inputs.include_headers == 'true'
        run: |
          set -euo pipefail
          cd kernel-source
          KARCH="${{ steps.arch.outputs.karch }}"

          HDR_STAGE_DIR="$(mktemp -d)"
          echo "HDR_STAGE=$HDR_STAGE_DIR" >> "$GITHUB_ENV"

          HDR_DIR="$HDR_STAGE_DIR/usr/src/linux-headers-${KVER}"
          mkdir -p "$HDR_DIR"

          if [ "${{ inputs.headers_full_tree }}" = "true" ]; then
            cp -a include "$HDR_DIR/"
            cp -a scripts "$HDR_DIR/"
            cp -a arch "$HDR_DIR/"
          else
            cp -a include "$HDR_DIR/"
            mkdir -p "$HDR_DIR/scripts"
            for d in basic mod package recordmk kernel; do
              if [ -d "scripts/$d" ]; then
                cp -a "scripts/$d" "$HDR_DIR/scripts/"
              fi
            done
            mkdir -p "$HDR_DIR/arch"
            cp -a "arch/$KARCH" "$HDR_DIR/arch/"
          fi

          cp Makefile .config Module.symvers Kbuild "$HDR_DIR/" 2>/dev/null || true

      - name: 打包 deb
        if: contains(matrix.formats, 'deb')
        run: |
          set -euo pipefail
          DEB_ARCH="${{ steps.arch.outputs.deb_arch }}"
          mkdir -p dist/deb

          IMG_DIR="$(mktemp -d)/linux-image-${KVER}"
          mkdir -p "$IMG_DIR/DEBIAN" "$IMG_DIR/boot" "$IMG_DIR/lib/modules"
          cp "$STAGE/boot/vmlinuz-${KVER}" "$IMG_DIR/boot/vmlinuz-${KVER}" 2>/dev/null || \
            cp "$STAGE/boot/"vmlinuz* "$IMG_DIR/boot/vmlinuz-${KVER}"
          cp "$STAGE/boot/System.map-${KVER}" "$IMG_DIR/boot/"
          cp "$STAGE/boot/config-${KVER}" "$IMG_DIR/boot/"
          cp -a "$STAGE/lib/modules/${KVER}" "$IMG_DIR/lib/modules/"

          cat > "$IMG_DIR/DEBIAN/control" <<CONTROL_EOF
          Package: linux-image-${KVER}
          Version: 1
          Architecture: ${DEB_ARCH}
          Maintainer: CI
          Description: Linux kernel ${KVER}
          CONTROL_EOF

          echo '#!/bin/sh' > "$IMG_DIR/DEBIAN/postinst"
          echo "depmod ${KVER} || true" >> "$IMG_DIR/DEBIAN/postinst"
          chmod 755 "$IMG_DIR/DEBIAN/postinst"

          dpkg-deb --root-owner-group --build "$IMG_DIR" "dist/deb/linux-image-${KVER}_${DEB_ARCH}.deb"

          if [ "${{ inputs.include_headers }}" = "true" ]; then
            HDR_DIR="$(mktemp -d)/linux-headers-${KVER}"
            mkdir -p "$HDR_DIR/DEBIAN" "$HDR_DIR/usr/src/linux-headers-${KVER}"
            cp -a "$HDR_STAGE/usr/src/linux-headers-${KVER}/." "$HDR_DIR/usr/src/linux-headers-${KVER}/"
            cat > "$HDR_DIR/DEBIAN/control" <<CONTROL_EOF
            Package: linux-headers-${KVER}
            Version: 1
            Architecture: ${DEB_ARCH}
            Maintainer: CI
            Description: Headers for ${KVER}
            CONTROL_EOF
            dpkg-deb --root-owner-group --build "$HDR_DIR" "dist/deb/linux-headers-${KVER}_${DEB_ARCH}.deb"
          fi

      - name: 打包 rpm
        if: contains(matrix.formats, 'rpm')
        run: |
          set -euo pipefail
          RPM_ARCH="${{ steps.arch.outputs.rpm_arch }}"
          RPM_VER="$(echo "$KVER" | rev | cut -d'-' -f2- | rev)"
          RPM_REL="$(echo "$KVER" | rev | cut -d'-' -f1 | rev)_1"
          if [ -z "$RPM_VER" ]; then RPM_VER="$KVER"; fi
          if [ -z "$RPM_REL" ]; then RPM_REL="1"; fi

          RPM_TOPDIR="$(mktemp -d)"
          mkdir -p "$RPM_TOPDIR"/{BUILD,RPMS,SOURCES,SPECS,BUILDROOT}

          cat > "$RPM_TOPDIR/SPECS/kernel-image.spec" <<SPEC_EOF
          %global debug_package %{nil}
          %global __strip /bin/true
          %global __find_provides %{nil}
          %global __find_requires %{nil}
          %define _unpackaged_files_terminate_build 0

          Name: kernel-image-${KVER}
          Version: ${RPM_VER}
          Release: ${RPM_REL}
          Summary: Linux kernel ${KVER}
          License: GPL-2.0-only
          AutoReqProv: no
          BuildArch: ${RPM_ARCH}

          %description
          Kernel image and modules

          %install
          rm -rf %{buildroot}
          mkdir -p %{buildroot}/boot %{buildroot}/lib/modules
          cp ${STAGE}/boot/vmlinuz-${KVER} %{buildroot}/boot/ 2>/dev/null || :
          cp ${STAGE}/boot/System.map-${KVER} %{buildroot}/boot/ 2>/dev/null || :
          cp ${STAGE}/boot/config-${KVER} %{buildroot}/boot/ 2>/dev/null || :
          cp -a ${STAGE}/lib/modules/${KVER} %{buildroot}/lib/modules/ 2>/dev/null || :

          %files
          /boot/vmlinuz-${KVER}
          /boot/System.map-${KVER}
          /boot/config-${KVER}
          /lib/modules/${KVER}
          SPEC_EOF

          if [ "${{ inputs.include_headers }}" = "true" ]; then
            cat > "$RPM_TOPDIR/SPECS/kernel-headers.spec" <<SPEC_EOF
            %global debug_package %{nil}
            %global __strip /bin/true
            %global __find_provides %{nil}
            %global __find_requires %{nil}
            %define _unpackaged_files_terminate_build 0

            Name: kernel-headers-${KVER}
            Version: ${RPM_VER}
            Release: ${RPM_REL}
            Summary: Headers for ${KVER}
            License: GPL-2.0-only
            AutoReqProv: no
            BuildArch: ${RPM_ARCH}

            %install
            rm -rf %{buildroot}
            mkdir -p %{buildroot}/usr/src/linux-headers-${KVER}
            cp -a ${HDR_STAGE}/usr/src/linux-headers-${KVER}/. %{buildroot}/usr/src/linux-headers-${KVER}/

            %files
            /usr/src/linux-headers-${KVER}
            SPEC_EOF
            rpmbuild --define "_topdir $RPM_TOPDIR" -bb "$RPM_TOPDIR/SPECS/kernel-headers.spec"
          fi

          rpmbuild --define "_topdir $RPM_TOPDIR" -bb "$RPM_TOPDIR/SPECS/kernel-image.spec"
          mkdir -p dist/rpm
          find "$RPM_TOPDIR/RPMS" -name '*.rpm' -exec cp {} dist/rpm/ \;

      - name: 打包 tar.xz
        if: contains(matrix.formats, 'tarxz')
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          PKG_ROOT="$(mktemp -d)/linux-${KVER}-${ARCH}"
          mkdir -p "$PKG_ROOT/boot" "$PKG_ROOT/lib/modules"

          cp "$STAGE/boot/vmlinuz-${KVER}" "$PKG_ROOT/boot/vmlinuz-${KVER}" 2>/dev/null || \
            cp "$STAGE/boot/"vmlinuz* "$PKG_ROOT/boot/vmlinuz-${KVER}"
          cp "$STAGE/boot/System.map-${KVER}" "$PKG_ROOT/boot/"
          cp "$STAGE/boot/config-${KVER}" "$PKG_ROOT/boot/"
          cp -a "$STAGE/lib/modules/${KVER}" "$PKG_ROOT/lib/modules/"

          if [ "${{ inputs.include_headers }}" = "true" ] && [ "${{ inputs.tarxz_include_headers }}" = "true" ]; then
            mkdir -p "$PKG_ROOT/usr/src"
            cp -a "$HDR_STAGE/usr/src/linux-headers-${KVER}" "$PKG_ROOT/usr/src/"
          fi

          cat > "$PKG_ROOT/install-${KVER}.sh" <<INSTALL_EOF
          #!/bin/sh
          set -e
          [ "\$(id -u)" = "0" ] || { echo "请 root 运行" >&2; exit 1; }
          mkdir -p /boot
          cp -a "$PKG_ROOT/boot/"* /boot/ 2>/dev/null || true
          cp -a "$PKG_ROOT/lib/modules/${KVER}" /lib/modules/ 2>/dev/null || true
          if [ -d "$PKG_ROOT/usr/src/linux-headers-${KVER}" ]; then
            cp -a "$PKG_ROOT/usr/src/linux-headers-${KVER}" /usr/src/
          fi
          depmod ${KVER} 2>/dev/null || true
          echo "完成"
          INSTALL_EOF
          chmod 755 "$PKG_ROOT/install-${KVER}.sh"

          mkdir -p dist/tarxz
          ( cd "$(dirname "$PKG_ROOT")" && tar --owner=0 --group=0 --numeric-owner -cJf \
            "$OLDPWD/dist/tarxz/linux-${KVER}-${ARCH}.tar.xz" "$(basename "$PKG_ROOT")" )

      - name: 打包 pkg.tar.zst
        if: contains(matrix.formats, 'pkg')
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"

          IMG_ROOT="$(mktemp -d)"
          mkdir -p "$IMG_ROOT/boot" "$IMG_ROOT/lib/modules"
          cp "$STAGE/boot/vmlinuz-${KVER}" "$IMG_ROOT/boot/vmlinuz-${KVER}" 2>/dev/null || \
            cp "$STAGE/boot/"vmlinuz* "$IMG_ROOT/boot/vmlinuz-${KVER}"
          cp "$STAGE/boot/System.map-${KVER}" "$IMG_ROOT/boot/"
          cp "$STAGE/boot/config-${KVER}" "$IMG_ROOT/boot/"
          cp -a "$STAGE/lib/modules/${KVER}" "$IMG_ROOT/lib/modules/"

          cat > "$IMG_ROOT/.PKGINFO" <<PKGINFO_EOF
          pkgname = linux-image-${KVER}
          pkgver = ${KVER}-1
          arch = ${ARCH}
          license = GPL-2.0-only
          PKGINFO_EOF

          mkdir -p dist/pkg
          ( cd "$IMG_ROOT" && tar --owner=0 --group=0 --numeric-owner -cf - . | \
            zstd -T0 -19 -o "$OLDPWD/dist/pkg/linux-image-${KVER}-${ARCH}.pkg.tar.zst" -f )

          if [ "${{ inputs.include_headers }}" = "true" ]; then
            HDR_ROOT="$(mktemp -d)"
            mkdir -p "$HDR_ROOT/usr/src/linux-headers-${KVER}"
            cp -a "$HDR_STAGE/usr/src/linux-headers-${KVER}/." "$HDR_ROOT/usr/src/linux-headers-${KVER}/"
            cat > "$HDR_ROOT/.PKGINFO" <<PKGINFO_EOF
            pkgname = linux-headers-${KVER}
            pkgver = ${KVER}-1
            arch = ${ARCH}
            license = GPL-2.0-only
            PKGINFO_EOF
            ( cd "$HDR_ROOT" && tar --owner=0 --group=0 --numeric-owner -cf - . | \
              zstd -T0 -19 -o "$OLDPWD/dist/pkg/linux-headers-${KVER}-${ARCH}.pkg.tar.zst" -f )
          fi

      - name: 上传制品
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}-${{ strategy.job-index }}
          path: dist/**/*
          if-no-files-found: warn
          retention-days: 7

      - name: 统计产物大小
        if: always() && !cancelled()
        run: find dist -type f -exec ls -lh {} \; 2>/dev/null || true

  publish:
    needs: build
    if: inputs.release_tag != '' && !cancelled()
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kernel-*
          merge-multiple: true
      - run: |
          ls -lh dist/
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: dist/*
          generate_release_notes: true
          overwrite_files: true
