name: Package Kernel Core

on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      arch_name:
        type: string
        required: true
      deb_arch:
        type: string
        required: true
      rpm_arch:
        type: string
        required: true
      format:
        type: string
        required: true
      kver:
        type: string
        required: true

jobs:
  package:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 下载编译产物
        uses: actions/download-artifact@v4
        with:
          name: build-${{ inputs.arch }}
          path: build-artifacts

      - name: 安装打包工具
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm zstd xz-utils cpio jq

      - name: 定位产物
        id: locate
        run: |
          set -euo pipefail
          SRC="build-artifacts"
          KVER="${{ inputs.kver }}"

          if [ ! -d "$SRC/boot" ]; then
            echo "未找到编译产物: $SRC/boot" >&2
            find "$SRC" -maxdepth 3 -type d | head -20 >&2
            exit 1
          fi

          # vmlinuz 文件名可能因 LOCALVERSION 略有差异，优先精确匹配
          VMLINUZ="$(ls -1 "$SRC/boot/" | grep -E '^vmlinuz-'"$KVER" | head -1 || true)"
          if [ -z "$VMLINUZ" ]; then
            VMLINUZ="$(ls -1 "$SRC/boot/" | grep -E '^vmlinuz-' | head -1 || true)"
          fi
          if [ -z "$VMLINUZ" ]; then
            echo "未找到 vmlinuz" >&2
            ls -l "$SRC/boot/" >&2
            exit 1
          fi

          echo "SRC=$SRC" >> "$GITHUB_OUTPUT"
          echo "VMLINUZ=$VMLINUZ" >> "$GITHUB_OUTPUT"
          echo "vmlinuz=$VMLINUZ  modules=$(ls "$SRC/lib/modules/" 2>/dev/null | tr '\n' ' ')"

      - name: 打包 deb
        if: ${{ inputs.format == 'deb' }}
        run: |
          set -euo pipefail
          SRC="${{ steps.locate.outputs.SRC }}"
          VMLINUZ="${{ steps.locate.outputs.VMLINUZ }}"
          KVER="${{ inputs.kver }}"
          OUT="dist/${{ inputs.arch }}/deb"
          mkdir -p "$OUT"

          IMG_DIR="$(mktemp -d)/linux-image-${KVER}"
          mkdir -p "$IMG_DIR/DEBIAN" "$IMG_DIR/boot" "$IMG_DIR/lib/modules"
          cp "$SRC/boot/$VMLINUZ"       "$IMG_DIR/boot/vmlinuz-${KVER}"
          cp "$SRC/boot/System.map-${KVER}" "$IMG_DIR/boot/" 2>/dev/null || true
          cp "$SRC/boot/config-${KVER}"    "$IMG_DIR/boot/" 2>/dev/null || true
          cp -a "$SRC/lib/modules/${KVER}" "$IMG_DIR/lib/modules/" 2>/dev/null || true

          printf '%s\n' \
            "Package: linux-image-${KVER}" \
            "Version: 1" \
            "Architecture: ${{ inputs.deb_arch }}" \
            "Maintainer: CI" \
            "Description: Linux kernel ${KVER}" \
            > "$IMG_DIR/DEBIAN/control"

          printf '%s\n' \
            '#!/bin/sh' \
            "depmod ${KVER} || true" \
            > "$IMG_DIR/DEBIAN/postinst"
          chmod 755 "$IMG_DIR/DEBIAN/postinst"

          dpkg-deb --root-owner-group --build "$IMG_DIR" "$OUT/linux-image-${KVER}_${{ inputs.deb_arch }}.deb"

          if [ -d "$SRC/headers" ]; then
            HDR_DIR="$(mktemp -d)/linux-headers-${KVER}"
            mkdir -p "$HDR_DIR/DEBIAN" "$HDR_DIR/usr/src/linux-headers-${KVER}"
            cp -a "$SRC/headers/." "$HDR_DIR/usr/src/linux-headers-${KVER}/"

            printf '%s\n' \
              "Package: linux-headers-${KVER}" \
              "Version: 1" \
              "Architecture: ${{ inputs.deb_arch }}" \
              "Maintainer: CI" \
              "Description: Headers for ${KVER}" \
              > "$HDR_DIR/DEBIAN/control"

            dpkg-deb --root-owner-group --build "$HDR_DIR" "$OUT/linux-headers-${KVER}_${{ inputs.deb_arch }}.deb"
          fi

      - name: 打包 rpm
        if: ${{ inputs.format == 'rpm' }}
        run: |
          set -euo pipefail
          SRC="${{ steps.locate.outputs.SRC }}"
          VMLINUZ="${{ steps.locate.outputs.VMLINUZ }}"
          KVER="${{ inputs.kver }}"
          OUT="dist/${{ inputs.arch }}/rpm"
          mkdir -p "$OUT"

          RPM_VER="$(echo "$KVER" | rev | cut -d'-' -f2- | rev)"
          RPM_REL="$(echo "$KVER" | rev | cut -d'-' -f1  | rev)_1"
          if [ -z "$RPM_VER" ]; then RPM_VER="$KVER"; fi
          if [ -z "$RPM_REL" ]; then RPM_REL="1"; fi

          RPM_TOPDIR="$(mktemp -d)"
          mkdir -p "$RPM_TOPDIR"/{BUILD,RPMS,SOURCES,SPECS,BUILDROOT}

          printf '%s\n' \
            '%global debug_package %{nil}' \
            '%global __strip /bin/true' \
            '%global __find_provides %{nil}' \
            '%global __find_requires %{nil}' \
            '%define _unpackaged_files_terminate_build 0' \
            '' \
            "Name: kernel-image-${KVER}" \
            "Version: ${RPM_VER}" \
            "Release: ${RPM_REL}" \
            "Summary: Linux kernel ${KVER}" \
            'License: GPL-2.0-only' \
            'AutoReqProv: no' \
            "BuildArch: ${{ inputs.rpm_arch }}" \
            '' \
            '%description' \
            'Kernel image and modules' \
            '' \
            '%install' \
            'rm -rf %{buildroot}' \
            'mkdir -p %{buildroot}/boot %{buildroot}/lib/modules' \
            "cp ${SRC}/boot/${VMLINUZ} %{buildroot}/boot/vmlinuz-${KVER} 2>/dev/null || :" \
            "cp ${SRC}/boot/System.map-${KVER} %{buildroot}/boot/ 2>/dev/null || :" \
            "cp ${SRC}/boot/config-${KVER} %{buildroot}/boot/ 2>/dev/null || :" \
            "cp -a ${SRC}/lib/modules/${KVER} %{buildroot}/lib/modules/ 2>/dev/null || :" \
            '' \
            '%files' \
            "/boot/vmlinuz-${KVER}" \
            "/boot/System.map-${KVER}" \
            "/boot/config-${KVER}" \
            "/lib/modules/${KVER}" \
            > "$RPM_TOPDIR/SPECS/kernel-image.spec"

          rpmbuild --define "_topdir $RPM_TOPDIR" -bb "$RPM_TOPDIR/SPECS/kernel-image.spec"

          if [ -d "$SRC/headers" ]; then
            printf '%s\n' \
              '%global debug_package %{nil}' \
              '%global __strip /bin/true' \
              '%global __find_provides %{nil}' \
              '%global __find_requires %{nil}' \
              '%define _unpackaged_files_terminate_build 0' \
              '' \
              "Name: kernel-headers-${KVER}" \
              "Version: ${RPM_VER}" \
              "Release: ${RPM_REL}" \
              "Summary: Headers for ${KVER}" \
              'License: GPL-2.0-only' \
              'AutoReqProv: no' \
              "BuildArch: ${{ inputs.rpm_arch }}" \
              '' \
              '%description' \
              'Kernel headers' \
              '' \
              '%install' \
              'rm -rf %{buildroot}' \
              "mkdir -p %{buildroot}/usr/src/linux-headers-${KVER}" \
              "cp -a ${SRC}/headers/. %{buildroot}/usr/src/linux-headers-${KVER}/" \
              '' \
              '%files' \
              "/usr/src/linux-headers-${KVER}" \
              > "$RPM_TOPDIR/SPECS/kernel-headers.spec"

            rpmbuild --define "_topdir $RPM_TOPDIR" -bb "$RPM_TOPDIR/SPECS/kernel-headers.spec"
          fi

          find "$RPM_TOPDIR/RPMS" -name '*.rpm' -exec cp {} "$OUT/" \;

      - name: 打包 tar.xz
        if: ${{ inputs.format == 'tarxz' }}
        run: |
          set -euo pipefail
          SRC="${{ steps.locate.outputs.SRC }}"
          VMLINUZ="${{ steps.locate.outputs.VMLINUZ }}"
          KVER="${{ inputs.kver }}"
          OUT="dist/${{ inputs.arch }}/tarxz"
          mkdir -p "$OUT"

          PKG_ROOT="$(mktemp -d)/linux-${KVER}-${{ inputs.arch }}"
          mkdir -p "$PKG_ROOT/boot" "$PKG_ROOT/lib/modules"

          cp "$SRC/boot/$VMLINUZ"       "$PKG_ROOT/boot/vmlinuz-${KVER}"
          cp "$SRC/boot/System.map-${KVER}" "$PKG_ROOT/boot/" 2>/dev/null || true
          cp "$SRC/boot/config-${KVER}"    "$PKG_ROOT/boot/" 2>/dev/null || true
          cp -a "$SRC/lib/modules/${KVER}" "$PKG_ROOT/lib/modules/" 2>/dev/null || true

          if [ -d "$SRC/headers" ]; then
            mkdir -p "$PKG_ROOT/usr/src"
            cp -a "$SRC/headers" "$PKG_ROOT/usr/src/linux-headers-${KVER}"
          fi

          printf '%s\n' \
            '#!/bin/sh' \
            'set -e' \
            '[ "$(id -u)" = "0" ] || { echo "请 root 运行" >&2; exit 1; }' \
            "KVER=\"${KVER}\"" \
            'mkdir -p /boot' \
            'cp -a "$0/../boot/"* /boot/ 2>/dev/null || true' \
            'cp -a "$0/../lib/modules/${KVER}" /lib/modules/ 2>/dev/null || true' \
            'if [ -d "$0/../usr/src/linux-headers-${KVER}" ]; then cp -a "$0/../usr/src/linux-headers-${KVER}" /usr/src/; fi' \
            "depmod ${KVER} 2>/dev/null || true" \
            'echo "安装完成: ${KVER}"' \
            > "$PKG_ROOT/install.sh"
          chmod 755 "$PKG_ROOT/install.sh"

          cd "$(dirname "$PKG_ROOT")"
          tar --owner=0 --group=0 --numeric-owner -cJf "$OLDPWD/$OUT/linux-${KVER}-${{ inputs.arch }}.tar.xz" "$(basename "$PKG_ROOT")"

      - name: 打包 pkg.tar.zst
        if: ${{ inputs.format == 'pkg' }}
        run: |
          set -euo pipefail
          SRC="${{ steps.locate.outputs.SRC }}"
          VMLINUZ="${{ steps.locate.outputs.VMLINUZ }}"
          KVER="${{ inputs.kver }}"
          OUT="dist/${{ inputs.arch }}/pkg"
          mkdir -p "$OUT"

          IMG_ROOT="$(mktemp -d)"
          mkdir -p "$IMG_ROOT/boot" "$IMG_ROOT/lib/modules"
          cp "$SRC/boot/$VMLINUZ"       "$IMG_ROOT/boot/vmlinuz-${KVER}"
          cp "$SRC/boot/System.map-${KVER}" "$IMG_ROOT/boot/" 2>/dev/null || true
          cp "$SRC/boot/config-${KVER}"    "$IMG_ROOT/boot/" 2>/dev/null || true
          cp -a "$SRC/lib/modules/${KVER}" "$IMG_ROOT/lib/modules/" 2>/dev/null || true

          printf '%s\n' \
            "pkgname = linux-image-${KVER}" \
            "pkgver = ${KVER}-1" \
            "arch = ${{ inputs.arch }}" \
            "license = GPL-2.0-only" \
            > "$IMG_ROOT/.PKGINFO"

          cd "$IMG_ROOT"
          tar --owner=0 --group=0 --numeric-owner -cf - . \
            | zstd -T0 -19 -o "$OLDPWD/$OUT/linux-image-${KVER}-${{ inputs.arch }}.pkg.tar.zst" --force

          if [ -d "$SRC/headers" ]; then
            HDR_ROOT="$(mktemp -d)"
            mkdir -p "$HDR_ROOT/usr/src/linux-headers-${KVER}"
            cp -a "$SRC/headers/." "$HDR_ROOT/usr/src/linux-headers-${KVER}/"
            printf '%s\n' \
              "pkgname = linux-headers-${KVER}" \
              "pkgver = ${KVER}-1" \
              "arch = ${{ inputs.arch }}" \
              "license = GPL-2.0-only" \
              > "$HDR_ROOT/.PKGINFO"
            cd "$HDR_ROOT"
            tar --owner=0 --group=0 --numeric-owner -cf - . \
              | zstd -T0 -19 -o "$OLDPWD/$OUT/linux-headers-${KVER}-${{ inputs.arch }}.pkg.tar.zst" --force
          fi

      - name: 上传成品
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          # 粒度 = 架构 + 格式，下载时不连带其他格式、其他架构
          name: kernel-${{ inputs.arch }}-${{ inputs.format }}
          path: dist/${{ inputs.arch }}/${{ inputs.format }}/**/*
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0
          include-hidden-files: false

      - name: 统计产物大小
        if: ${{ always() && !cancelled() }}
        run: find dist -type f -exec ls -lh {} \; 2>/dev/null || true
