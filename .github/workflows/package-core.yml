name: Package Kernel

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      arch:
        type: string
        required: true
      deb_arch:
        type: string
        required: true
      rpm_arch:
        type: string
        required: true
      format:
        type: string
        required: true
      include_headers:
        type: boolean
        default: true
      tarxz_include_headers:
        type: boolean
        default: true

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装打包工具
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm zstd xz-utils kmod jq

      - uses: actions/download-artifact@v4
        with:
          name: build-${{ inputs.arch }}
          path: build-artifacts

      - name: 定位产物路径
        id: locate
        run: |
          set -euo pipefail
          SRC="build-artifacts"

          VMLINUZ="$(find "$SRC" -maxdepth 4 -type f -name 'vmlinuz-*' | head -1 || true)"
          SYSTEM_MAP="$(find "$SRC" -maxdepth 4 -type f -name 'System.map-*' | head -1 || true)"
          CONFIG="$(find "$SRC" -maxdepth 4 -type f -name 'config-*' | head -1 || true)"
          MODULES_KVER="$(find "$SRC" -maxdepth 4 -type d -name 'modules' -exec find {} -maxdepth 1 -mindepth 1 -type d \; | head -1 | xargs -I{} basename {} 2>/dev/null || true)"
          MODULES_DIR="$(find "$SRC" -maxdepth 4 -type d -name 'modules' | head -1 || true)"
          HDR_DIR="$(find "$SRC" -maxdepth 3 -type d -name 'headers' | head -1 || true)"

          if [ -z "$VMLINUZ" ] || [ -z "$MODULES_DIR" ]; then
            echo "ERROR: 产物不完整" >&2
            find "$SRC" -maxdepth 5 | head -30 >&2
            exit 1
          fi

          KVER="$(basename "$VMLINUZ" | sed 's/^vmlinuz-//')"
          if [ -z "$MODULES_KVER" ]; then
            MODULES_KVER="$KVER"
          fi

          echo "VMLINUZ=$VMLINUZ" >> "$GITHUB_OUTPUT"
          echo "SYSTEM_MAP=$SYSTEM_MAP" >> "$GITHUB_OUTPUT"
          echo "CONFIG=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "MODULES_DIR=$MODULES_DIR" >> "$GITHUB_OUTPUT"
          echo "MODULES_KVER=$MODULES_KVER" >> "$GITHUB_OUTPUT"
          echo "KVER=$KVER" >> "$GITHUB_OUTPUT"
          echo "HDR=$HDR_DIR" >> "$GITHUB_OUTPUT"

          echo "KVER=$KVER"
          echo "MODULES_KVER=$MODULES_KVER"
          echo "MODULES_DIR=$MODULES_DIR"
          echo "HDR=$HDR_DIR"

      - name: 打包 deb
        if: ${{ inputs.format == 'deb' }}
        run: |
          set -euo pipefail
          KVER="${{ steps.locate.outputs.KVER }}"
          DEB_ARCH="${{ inputs.deb_arch }}"
          OUT="dist/${{ inputs.arch }}/deb"
          mkdir -p "$OUT"

          IMG_DIR="$(mktemp -d)/linux-image-${KVER}"
          mkdir -p "$IMG_DIR/DEBIAN" "$IMG_DIR/boot" "$IMG_DIR/lib/modules"
          cp "${{ steps.locate.outputs.VMLINUZ }}" "$IMG_DIR/boot/vmlinuz-${KVER}"
          cp "${{ steps.locate.outputs.SYSTEM_MAP }}" "$IMG_DIR/boot/System.map-${KVER}"
          cp "${{ steps.locate.outputs.CONFIG }}" "$IMG_DIR/boot/config-${KVER}"
          cp -a "${{ steps.locate.outputs.MODULES_DIR }}/${{ steps.locate.outputs.MODULES_KVER }}" "$IMG_DIR/lib/modules/"

          printf '%s\n' \
            "Package: linux-image-${KVER}" \
            "Version: 1" \
            "Architecture: ${DEB_ARCH}" \
            "Maintainer: CI" \
            "Description: Linux kernel ${KVER}" \
            > "$IMG_DIR/DEBIAN/control"

          printf '#!/bin/sh\ndepmod %s || true\n' "$KVER" > "$IMG_DIR/DEBIAN/postinst"
          chmod 755 "$IMG_DIR/DEBIAN/postinst"

          dpkg-deb --root-owner-group --build "$IMG_DIR" "${OUT}/linux-image-${KVER}_${DEB_ARCH}.deb"

          if [ "${{ inputs.include_headers }}" = "true" ] && [ -n "${{ steps.locate.outputs.HDR }}" ]; then
            HDR_DIR="$(mktemp -d)/linux-headers-${KVER}"
            mkdir -p "$HDR_DIR/DEBIAN" "$HDR_DIR/usr/src/linux-headers-${KVER}"
            cp -a "${{ steps.locate.outputs.HDR }}/." "$HDR_DIR/usr/src/linux-headers-${KVER}/"

            printf '%s\n' \
              "Package: linux-headers-${KVER}" \
              "Version: 1" \
              "Architecture: ${DEB_ARCH}" \
              "Maintainer: CI" \
              "Description: Headers for ${KVER}" \
              > "$HDR_DIR/DEBIAN/control"

            dpkg-deb --root-owner-group --build "$HDR_DIR" "${OUT}/linux-headers-${KVER}_${DEB_ARCH}.deb"
          fi

      - name: 打包 rpm
        if: ${{ inputs.format == 'rpm' }}
        run: |
          set -euo pipefail
          KVER="${{ steps.locate.outputs.KVER }}"
          RPM_ARCH="${{ inputs.rpm_arch }}"
          OUT="dist/${{ inputs.arch }}/rpm"
          mkdir -p "$OUT"

          RPM_VER="$(echo "$KVER" | rev | cut -d'-' -f2- | rev)"
          RPM_REL="$(echo "$KVER" | rev | cut -d'-' -f1 | rev)"
          RPM_REL="${RPM_REL}_1"
          if [ -z "$RPM_VER" ]; then RPM_VER="$KVER"; fi
          if [ -z "$RPM_REL" ]; then RPM_REL="1"; fi

          TOPDIR="$(mktemp -d)"
          mkdir -p "$TOPDIR"/{BUILD,RPMS,SOURCES,SPECS,BUILDROOT}

          if [ "${{ inputs.include_headers }}" = "true" ] && [ -n "${{ steps.locate.outputs.HDR }}" ]; then
            printf '%s\n' \
              '%global debug_package %{nil}' \
              '%global __strip /bin/true' \
              '%global __find_provides %{nil}' \
              '%global __find_requires %{nil}' \
              '%define _unpackaged_files_terminate_build 0' \
              '' \
              "Name: kernel-headers-${KVER}" \
              "Version: ${RPM_VER}" \
              "Release: ${RPM_REL}" \
              "Summary: Headers for ${KVER}" \
              "License: GPL-2.0-only" \
              "AutoReqProv: no" \
              "BuildArch: ${RPM_ARCH}" \
              '' \
              '%description' \
              'Kernel headers' \
              '' \
              '%install' \
              'rm -rf %{buildroot}' \
              "mkdir -p %{buildroot}/usr/src/linux-headers-${KVER}" \
              "cp -a ${{ steps.locate.outputs.HDR }}/. %{buildroot}/usr/src/linux-headers-${KVER}/" \
              '' \
              '%files' \
              '/usr/src/linux-headers-${KVER}' \
              > "$TOPDIR/SPECS/kernel-headers.spec"
            rpmbuild --define "_topdir $TOPDIR" -bb "$TOPDIR/SPECS/kernel-headers.spec"
          fi

          printf '%s\n' \
            '%global debug_package %{nil}' \
            '%global __strip /bin/true' \
            '%global __find_provides %{nil}' \
            '%global __find_requires %{nil}' \
            '%define _unpackaged_files_terminate_build 0' \
            '' \
            "Name: kernel-image-${KVER}" \
            "Version: ${RPM_VER}" \
            "Release: ${RPM_REL}" \
            "Summary: Linux kernel ${KVER}" \
            "License: GPL-2.0-only" \
            "AutoReqProv: no" \
            "BuildArch: ${RPM_ARCH}" \
            '' \
            '%description' \
            'Kernel image and modules' \
            '' \
            '%install' \
            'rm -rf %{buildroot}' \
            'mkdir -p %{buildroot}/boot %{buildroot}/lib/modules' \
            "cp ${{ steps.locate.outputs.VMLINUZ }} %{buildroot}/boot/vmlinuz-${KVER} 2>/dev/null || :" \
            "cp ${{ steps.locate.outputs.SYSTEM_MAP }} %{buildroot}/boot/System.map-${KVER} 2>/dev/null || :" \
            "cp ${{ steps.locate.outputs.CONFIG }} %{buildroot}/boot/config-${KVER} 2>/dev/null || :" \
            "cp -a ${{ steps.locate.outputs.MODULES_DIR }}/${{ steps.locate.outputs.MODULES_KVER }} %{buildroot}/lib/modules/ 2>/dev/null || :" \
            '' \
            '%files' \
            "/boot/vmlinuz-${KVER}" \
            "/boot/System.map-${KVER}" \
            "/boot/config-${KVER}" \
            "/lib/modules/${{ steps.locate.outputs.MODULES_KVER }}" \
            > "$TOPDIR/SPECS/kernel-image.spec"
          rpmbuild --define "_topdir $TOPDIR" -bb "$TOPDIR/SPECS/kernel-image.spec"

          find "$TOPDIR/RPMS" -name '*.rpm' -exec cp {} "$OUT"/ \;

      - name: 打包 tar.xz
        if: ${{ inputs.format == 'tarxz' }}
        run: |
          set -euo pipefail
          KVER="${{ steps.locate.outputs.KVER }}"
          ARCH="${{ inputs.arch }}"
          OUT="dist/${{ inputs.arch }}/tarxz"
          mkdir -p "$OUT"

          PKG_ROOT="$(mktemp -d)/linux-${KVER}-${ARCH}"
          mkdir -p "$PKG_ROOT/boot" "$PKG_ROOT/lib/modules"
          cp "${{ steps.locate.outputs.VMLINUZ }}" "$PKG_ROOT/boot/vmlinuz-${KVER}"
          cp "${{ steps.locate.outputs.SYSTEM_MAP }}" "$PKG_ROOT/boot/"
          cp "${{ steps.locate.outputs.CONFIG }}" "$PKG_ROOT/boot/"
          cp -a "${{ steps.locate.outputs.MODULES_DIR }}/${{ steps.locate.outputs.MODULES_KVER }}" "$PKG_ROOT/lib/modules/"

          if [ "${{ inputs.include_headers }}" = "true" ] && [ "${{ inputs.tarxz_include_headers }}" = "true" ] && [ -n "${{ steps.locate.outputs.HDR }}" ]; then
            mkdir -p "$PKG_ROOT/usr/src/linux-headers-${KVER}"
            cp -a "${{ steps.locate.outputs.HDR }}/." "$PKG_ROOT/usr/src/linux-headers-${KVER}/"
          fi

          printf '%s\n' \
            '#!/bin/sh' \
            'set -e' \
            '[ "$(id -u)" = "0" ] || { echo "请 root 运行" >&2; exit 1; }' \
            "KVER_SUB=\"${KVER}\"" \
            'cp -a boot/* /boot/ 2>/dev/null || true' \
            'cp -a "lib/modules/${KVER_SUB}" /lib/modules/ 2>/dev/null || true' \
            'if [ -d "usr/src/linux-headers-${KVER_SUB}" ]; then' \
            '  cp -a "usr/src/linux-headers-${KVER_SUB}" /usr/src/' \
            'fi' \
            'depmod "${KVER_SUB}" 2>/dev/null || true' \
            'echo "已安装 ${KVER_SUB}"' \
            > "$PKG_ROOT/install-${KVER}.sh"
          chmod 755 "$PKG_ROOT/install-${KVER}.sh"

          cd "$(dirname "$PKG_ROOT")" && tar --owner=0 --group=0 --numeric-owner -cJf "$OLDPWD/${OUT}/linux-${KVER}-${ARCH}.tar.xz" "$(basename "$PKG_ROOT")"

      - name: 打包 pkg.tar.zst
        if: ${{ inputs.format == 'pkg' }}
        run: |
          set -euo pipefail
          KVER="${{ steps.locate.outputs.KVER }}"
          ARCH="${{ inputs.arch }}"
          OUT="dist/${{ inputs.arch }}/pkg"
          mkdir -p "$OUT"

          IMG_ROOT="$(mktemp -d)"
          mkdir -p "$IMG_ROOT/boot" "$IMG_ROOT/lib/modules"
          cp "${{ steps.locate.outputs.VMLINUZ }}" "$IMG_ROOT/boot/vmlinuz-${KVER}"
          cp "${{ steps.locate.outputs.SYSTEM_MAP }}" "$IMG_ROOT/boot/"
          cp "${{ steps.locate.outputs.CONFIG }}" "$IMG_ROOT/boot/"
          cp -a "${{ steps.locate.outputs.MODULES_DIR }}/${{ steps.locate.outputs.MODULES_KVER }}" "$IMG_ROOT/lib/modules/"

          printf '%s\n' \
            "pkgname = linux-image-${KVER}" \
            "pkgver = ${KVER}-1" \
            "arch = ${ARCH}" \
            "license = GPL-2.0-only" \
            > "$IMG_ROOT/.PKGINFO"

          cd "$IMG_ROOT" && tar --owner=0 --group=0 --numeric-owner -cf - . \
            | zstd -T0 -19 --force -o "$OLDPWD/${OUT}/linux-image-${KVER}-${ARCH}.pkg.tar.zst"

          if [ "${{ inputs.include_headers }}" = "true" ] && [ -n "${{ steps.locate.outputs.HDR }}" ]; then
            HDR_ROOT="$(mktemp -d)"
            mkdir -p "$HDR_ROOT/usr/src/linux-headers-${KVER}"
            cp -a "${{ steps.locate.outputs.HDR }}/." "$HDR_ROOT/usr/src/linux-headers-${KVER}/"

            printf '%s\n' \
              "pkgname = linux-headers-${KVER}" \
              "pkgver = ${KVER}-1" \
              "arch = ${ARCH}" \
              "license = GPL-2.0-only" \
              > "$HDR_ROOT/.PKGINFO"

            cd "$HDR_ROOT" && tar --owner=0 --group=0 --numeric-owner -cf - . \
              | zstd -T0 -19 --force -o "$OLDPWD/${OUT}/linux-headers-${KVER}-${ARCH}.pkg.tar.zst"
          fi

      - name: 上传产物
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.arch }}-${{ inputs.format }}
          path: dist/${{ inputs.arch }}/${{ inputs.format }}/**/*
          retention-days: 7
          if-no-files-found: error

      - name: 列出产物
        if: ${{ always() && !cancelled() }}
        run: find "dist/${{ inputs.arch }}/${{ inputs.format }}" -type f -exec ls -lh {} \; 2>/dev/null || true
