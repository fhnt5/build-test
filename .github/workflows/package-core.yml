name: Package Kernel Core

on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      arch_name:
        type: string
        required: true
      deb_arch:
        type: string
        required: true
      rpm_arch:
        type: string
        required: true
      format:
        type: string
        required: true
      kver:
        type: string
        required: true

jobs:
  package:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载编译产物
        uses: actions/download-artifact@v4
        with:
          name: build-${{ inputs.arch }}
          path: build-artifacts

      - name: 安装打包工具
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev rpm zstd xz-utils

      - name: 打包 ${{ inputs.format }}
        run: |
          set -euo pipefail
          KVER="${{ inputs.kver }}"
          DEB_ARCH="${{ inputs.deb_arch }}"
          RPM_ARCH="${{ inputs.rpm_arch }}"
          ARCH="${{ inputs.arch_name }}"
          SRC="$(pwd)/build-artifacts"
          OUT="$(pwd)/dist/${{ inputs.arch }}/${{ inputs.format }}"
          mkdir -p "$OUT"

          case "${{ inputs.format }}" in
            deb)
              IMG_ROOT="$(mktemp -d)/linux-image-${KVER}"
              mkdir -p "$IMG_ROOT/DEBIAN" "$IMG_ROOT/boot" "$IMG_ROOT/lib/modules"
              cp "$SRC/boot/vmlinuz-${KVER}" "$IMG_ROOT/boot/vmlinuz-${KVER}" 2>/dev/null || cp "$SRC/boot/"vmlinuz* "$IMG_ROOT/boot/vmlinuz-${KVER}"
              cp "$SRC/boot/System.map-${KVER}" "$IMG_ROOT/boot/"
              cp "$SRC/boot/config-${KVER}" "$IMG_ROOT/boot/"
              cp -a "$SRC/lib/modules/${KVER}" "$IMG_ROOT/lib/modules/"

              printf '%s\n' \
                "Package: linux-image-${KVER}" \
                "Version: 1" \
                "Architecture: ${DEB_ARCH}" \
                "Maintainer: CI" \
                "Description: Linux kernel ${KVER}" \
                > "$IMG_ROOT/DEBIAN/control"

              printf '%s\n' \
                '#!/bin/sh' \
                "depmod ${KVER} || true" \
                > "$IMG_ROOT/DEBIAN/postinst"
              chmod 755 "$IMG_ROOT/DEBIAN/postinst"

              dpkg-deb --root-owner-group --build "$IMG_ROOT" "$OUT/linux-image-${KVER}_${DEB_ARCH}.deb"

              if [ -d "$SRC/headers" ]; then
                HDR_ROOT="$(mktemp -d)/linux-headers-${KVER}"
                mkdir -p "$HDR_ROOT/DEBIAN" "$HDR_ROOT/usr/src/linux-headers-${KVER}"
                cp -a "$SRC/headers/." "$HDR_ROOT/usr/src/linux-headers-${KVER}/"
                printf '%s\n' \
                  "Package: linux-headers-${KVER}" \
                  "Version: 1" \
                  "Architecture: ${DEB_ARCH}" \
                  "Maintainer: CI" \
                  "Description: Headers for ${KVER}" \
                  > "$HDR_ROOT/DEBIAN/control"
                dpkg-deb --root-owner-group --build "$HDR_ROOT" "$OUT/linux-headers-${KVER}_${DEB_ARCH}.deb"
              fi
              ;;

            rpm)
              RPM_VER="$(echo "$KVER" | rev | cut -d'-' -f2- | rev)"
              RPM_REL="$(echo "$KVER" | rev | cut -d'-' -f1 | rev)"
              [ -z "$RPM_VER" ] && RPM_VER="$KVER"
              [ -z "$RPM_REL" ] && RPM_REL="1"
              RPM_TOPDIR="$(mktemp -d)"
              mkdir -p "$RPM_TOPDIR"/{BUILD,RPMS,SOURCES,SPECS,BUILDROOT}

              SPEC="$RPM_TOPDIR/SPECS/kernel-image.spec"
              : > "$SPEC"
              printf '%s\n' \
                '%global debug_package %{nil}' \
                '%global __strip /bin/true' \
                '%global __find_provides %{nil}' \
                '%global __find_requires %{nil}' \
                '%define _unpackaged_files_terminate_build 0' \
                '' \
                "Name: kernel-image-${KVER}" \
                "Version: ${RPM_VER}" \
                "Release: ${RPM_REL}" \
                "Summary: Linux kernel ${KVER}" \
                "License: GPL-2.0-only" \
                "AutoReqProv: no" \
                "BuildArch: ${RPM_ARCH}" \
                '' \
                '%description' \
                'Kernel image and modules' \
                '' \
                '%install' \
                'rm -rf %{buildroot}' \
                'mkdir -p %{buildroot}/boot %{buildroot}/lib/modules' \
                "cp ${SRC}/boot/vmlinuz-${KVER} %{buildroot}/boot/ 2>/dev/null || :" \
                "cp ${SRC}/boot/System.map-${KVER} %{buildroot}/boot/ 2>/dev/null || :" \
                "cp ${SRC}/boot/config-${KVER} %{buildroot}/boot/ 2>/dev/null || :" \
                "cp -a ${SRC}/lib/modules/${KVER} %{buildroot}/lib/modules/ 2>/dev/null || :" \
                '' \
                '%files' \
                "/boot/vmlinuz-${KVER}" \
                "/boot/System.map-${KVER}" \
                "/boot/config-${KVER}" \
                "/lib/modules/${KVER}" \
                >> "$SPEC"

              rpmbuild --define "_topdir $RPM_TOPDIR" -bb "$SPEC"

              if [ -d "$SRC/headers" ]; then
                HSPEC="$RPM_TOPDIR/SPECS/kernel-headers.spec"
                : > "$HSPEC"
                printf '%s\n' \
                  '%global debug_package %{nil}' \
                  '%global __strip /bin/true' \
                  '%global __find_provides %{nil}' \
                  '%global __find_requires %{nil}' \
                  '%define _unpackaged_files_terminate_build 0' \
                  '' \
                  "Name: kernel-headers-${KVER}" \
                  "Version: ${RPM_VER}" \
                  "Release: ${RPM_REL}" \
                  "Summary: Headers for ${KVER}" \
                  "License: GPL-2.0-only" \
                  "AutoReqProv: no" \
                  "BuildArch: ${RPM_ARCH}" \
                  '' \
                  '%description' \
                  'Kernel headers' \
                  '' \
                  '%install' \
                  'rm -rf %{buildroot}' \
                  'mkdir -p %{buildroot}/usr/src/linux-headers-'${KVER} \
                  "cp -a ${SRC}/headers/. %{buildroot}/usr/src/linux-headers-${KVER}/" \
                  '' \
                  '%files' \
                  "/usr/src/linux-headers-${KVER}" \
                  >> "$HSPEC"
                rpmbuild --define "_topdir $RPM_TOPDIR" -bb "$HSPEC"
              fi

              find "$RPM_TOPDIR/RPMS" -name '*.rpm' -exec cp {} "$OUT/" \;
              ;;

            tarxz)
              PKG_ROOT="$(mktemp -d)/linux-${KVER}-${ARCH}"
              mkdir -p "$PKG_ROOT/boot" "$PKG_ROOT/lib/modules"
              cp "$SRC/boot/vmlinuz-${KVER}" "$PKG_ROOT/boot/vmlinuz-${KVER}" 2>/dev/null || cp "$SRC/boot/"vmlinuz* "$PKG_ROOT/boot/vmlinuz-${KVER}"
              cp "$SRC/boot/System.map-${KVER}" "$PKG_ROOT/boot/"
              cp "$SRC/boot/config-${KVER}" "$PKG_ROOT/boot/"
              cp -a "$SRC/lib/modules/${KVER}" "$PKG_ROOT/lib/modules/"

              if [ -d "$SRC/headers" ]; then
                mkdir -p "$PKG_ROOT/usr/src"
                cp -a "$SRC/headers" "$PKG_ROOT/usr/src/linux-headers-${KVER}"
              fi

              INST="$(pwd)/build-artifacts/install-${KVER}.sh"
              : > "$INST"
              printf '%s\n' \
                '#!/bin/sh' \
                'set -e' \
                '[ "$(id -u)" = "0" ] || { echo "请 root 运行" >&2; exit 1; }' \
                'mkdir -p /boot' \
                "cp -a \"$(basename "$PKG_ROOT")/boot/\"* /boot/ 2>/dev/null || true" \
                "cp -a \"$(basename "$PKG_ROOT")/lib/modules/${KVER}\" /lib/modules/ 2>/dev/null || true" \
                "if [ -d \"$(basename "$PKG_ROOT")/usr/src/linux-headers-${KVER}\" ]; then cp -a \"$(basename "$PKG_ROOT")/usr/src/linux-headers-${KVER}\" /usr/src/; fi" \
                "depmod ${KVER} 2>/dev/null || true" \
                'echo "完成"' \
                >> "$INST"
              cp "$INST" "$PKG_ROOT/"
              chmod 755 "$PKG_ROOT/install-${KVER}.sh"

              cd "$(dirname "$PKG_ROOT")"
              tar --owner=0 --group=0 --numeric-owner -cJf "$OUT/linux-${KVER}-${ARCH}.tar.xz" "$(basename "$PKG_ROOT")"
              ;;

            pkg)
              IMG_ROOT="$(mktemp -d)"
              mkdir -p "$IMG_ROOT/boot" "$IMG_ROOT/lib/modules"
              cp "$SRC/boot/vmlinuz-${KVER}" "$IMG_ROOT/boot/vmlinuz-${KVER}" 2>/dev/null || cp "$SRC/boot/"vmlinuz* "$IMG_ROOT/boot/vmlinuz-${KVER}"
              cp "$SRC/boot/System.map-${KVER}" "$IMG_ROOT/boot/"
              cp "$SRC/boot/config-${KVER}" "$IMG_ROOT/boot/"
              cp -a "$SRC/lib/modules/${KVER}" "$IMG_ROOT/lib/modules/"

              printf '%s\n' \
                "pkgname = linux-image-${KVER}" \
                "pkgver = ${KVER}-1" \
                "arch = ${ARCH}" \
                "license = GPL-2.0-only" \
                > "$IMG_ROOT/.PKGINFO"

              cd "$IMG_ROOT"
              tar --owner=0 --group=0 --numeric-owner -cf - . | zstd -T0 -19 -o "$OUT/linux-image-${KVER}-${ARCH}.pkg.tar.zst" --force

              if [ -d "$SRC/headers" ]; then
                HDR_ROOT="$(mktemp -d)"
                mkdir -p "$HDR_ROOT/usr/src/linux-headers-${KVER}"
                cp -a "$SRC/headers/." "$HDR_ROOT/usr/src/linux-headers-${KVER}/"
                printf '%s\n' \
                  "pkgname = linux-headers-${KVER}" \
                  "pkgver = ${KVER}-1" \
                  "arch = ${ARCH}" \
                  "license = GPL-2.0-only" \
                  > "$HDR_ROOT/.PKGINFO"
                cd "$HDR_ROOT"
                tar --owner=0 --group=0 --numeric-owner -cf - . | zstd -T0 -19 -o "$OUT/linux-headers-${KVER}-${ARCH}.pkg.tar.zst" --force
              fi
              ;;
          esac

      - name: 上传 ${{ inputs.format }} 产物
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.arch }}-${{ inputs.format }}
          path: dist/${{ inputs.arch }}/${{ inputs.format }}/**/*
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: 产物清单
        run: |
          set -euo pipefail
          find "dist/${{ inputs.arch }}/${{ inputs.format }}" -type f -exec ls -lh {} \; | awk '{print $5, $9}'
