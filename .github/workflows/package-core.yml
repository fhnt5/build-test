name: Package Kernel Core

on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      arch_name:
        type: string
        required: true
      deb_arch:
        type: string
        required: true
      rpm_arch:
        type: string
        required: true
      format:
        type: string
        required: true

jobs:
  package:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载编译产物
        uses: actions/download-artifact@v4
        with:
          name: build-${{ inputs.arch }}
          path: build-artifacts

      - name: 定位编译产物
        id: locate
        run: |
          set -euo pipefail
          SRC="$(pwd)/build-artifacts"

          VMLINUZ="$(find "$SRC" -maxdepth 4 -name 'vmlinuz-*' -print -quit)"
          [ -n "$VMLINUZ" ] || { echo "ERROR: 找不到 vmlinuz" >&2; find "$SRC" -maxdepth 4 -type f | head -50 >&2; exit 1; }

          KVER="$(basename "$VMLINUZ" | sed 's/^vmlinuz-//')"
          echo "KVER=$KVER" >> "$GITHUB_OUTPUT"

          BOOT_DIR="$(dirname "$VMLINUZ")"
          ROOT="$(dirname "$BOOT_DIR")"
          echo "ROOT=$ROOT" >> "$GITHUB_OUTPUT"

          MODULES_DIR="$ROOT/lib/modules"
          [ -d "$MODULES_DIR" ] || { echo "ERROR: 找不到 lib/modules" >&2; exit 1; }
          echo "MODULES_DIR=$MODULES_DIR" >> "$GITHUB_OUTPUT"

          SYSTEM_MAP="$(find "$BOOT_DIR" -maxdepth 1 -name 'System.map-*' -print -quit)"
          CONFIG_FILE="$(find "$BOOT_DIR" -maxdepth 1 -name 'config-*' -print -quit)"
          [ -n "$SYSTEM_MAP" ] || { echo "ERROR: 找不到 System.map" >&2; exit 1; }
          [ -n "$CONFIG_FILE" ] || { echo "ERROR: 找不到 config" >&2; exit 1; }
          echo "SYSTEM_MAP=$SYSTEM_MAP" >> "$GITHUB_OUTPUT"
          echo "CONFIG_FILE=$CONFIG_FILE" >> "$GITHUB_OUTPUT"

      - name: 安装打包工具
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev rpm zstd xz-utils

      - name: 打包 ${{ inputs.format }}
        run: |
          set -euo pipefail
          KVER="${{ steps.locate.outputs.KVER }}"
          DEB_ARCH="${{ inputs.deb_arch }}"
          RPM_ARCH="${{ inputs.rpm_arch }}"
          ARCH="${{ inputs.arch_name }}"
          SRC="${{ steps.locate.outputs.ROOT }}"
          MODULES_DIR="${{ steps.locate.outputs.MODULES_DIR }}"
          VMLINUZ="$(find "$SRC/boot" -maxdepth 1 -name 'vmlinuz-*' -print -quit)"
          SYSTEM_MAP="${{ steps.locate.outputs.SYSTEM_MAP }}"
          CONFIG_FILE="${{ steps.locate.outputs.CONFIG_FILE }}"
          OUT="$(pwd)/dist/${{ inputs.arch }}/${{ inputs.format }}"
          mkdir -p "$OUT"

          [ -n "$VMLINUZ" ] || { echo "ERROR: vmlinuz 缺失" >&2; exit 1; }
          [ -n "$SYSTEM_MAP" ] || { echo "ERROR: System.map 缺失" >&2; exit 1; }
          [ -n "$CONFIG_FILE" ] || { echo "ERROR: config 缺失" >&2; exit 1; }

          MODULES_KVER="$(basename "$(find "$MODULES_DIR" -mindepth 1 -maxdepth 1 -type d -print -quit)")"
          [ -n "$MODULES_KVER" ] && [ -d "$MODULES_DIR/$MODULES_KVER" ] || { echo "ERROR: modules 目录缺失" >&2; exit 1; }
          echo "MODULES_KVER=$MODULES_KVER" >&2

          case "${{ inputs.format }}" in
            deb)
              IMG_ROOT="$(mktemp -d)/linux-image-${KVER}"
              mkdir -p "$IMG_ROOT/DEBIAN" "$IMG_ROOT/boot" "$IMG_ROOT/lib/modules"
              cp "$VMLINUZ" "$IMG_ROOT/boot/vmlinuz-${KVER}"
              cp "$SYSTEM_MAP" "$IMG_ROOT/boot/"
              cp "$CONFIG_FILE" "$IMG_ROOT/boot/"
              cp -a "$MODULES_DIR/$MODULES_KVER" "$IMG_ROOT/lib/modules/${KVER}"

              printf '%s\n' \
                "Package: linux-image-${KVER}" \
                "Version: 1" \
                "Architecture: ${DEB_ARCH}" \
                "Maintainer: CI" \
                "Description: Linux kernel ${KVER}" \
                " Self-built kernel image and modules." \
                > "$IMG_ROOT/DEBIAN/control"

              # 安装后：depmod + 触发发行版钩子（含 initramfs-tools / zz-update-grub）+ 兜底生成 initrd 与更新引导
              printf '%s\n' \
                '#!/bin/sh' \
                "depmod ${KVER} 2>/dev/null || true" \
                'if [ -d /etc/kernel/postinst.d ]; then' \
                "  run-parts --report /etc/kernel/postinst.d -- '${KVER}' '/boot/vmlinuz-${KVER}' || true" \
                'fi' \
                'if command -v update-initramfs >/dev/null 2>&1; then' \
                "  update-initramfs -c -k '${KVER}' || true" \
                'fi' \
                'if command -v update-grub >/dev/null 2>&1; then' \
                '  update-grub 2>/dev/null || true' \
                'fi' \
                'exit 0' \
                > "$IMG_ROOT/DEBIAN/postinst"
              chmod 755 "$IMG_ROOT/DEBIAN/postinst"

              # 卸载后：清 initrd + 触发发行版清理钩子
              printf '%s\n' \
                '#!/bin/sh' \
                'if command -v update-initramfs >/dev/null 2>&1; then' \
                "  update-initramfs -d -k '${KVER}' 2>/dev/null || true" \
                'fi' \
                "rm -f '/boot/initramfs-${KVER}.img' '/boot/initramfs-${KVER}-fallback.img' '/boot/initrd.img-${KVER}' '/boot/initrd-${KVER}' 2>/dev/null || true" \
                'if [ -d /etc/kernel/postrm.d ]; then' \
                "  run-parts --report /etc/kernel/postrm.d -- '${KVER}' || true" \
                'fi' \
                'if command -v update-grub >/dev/null 2>&1; then' \
                '  update-grub 2>/dev/null || true' \
                'fi' \
                'exit 0' \
                > "$IMG_ROOT/DEBIAN/postrm"
              chmod 755 "$IMG_ROOT/DEBIAN/postrm"

              dpkg-deb --root-owner-group --build "$IMG_ROOT" "$OUT/linux-image-${KVER}_${DEB_ARCH}.deb"

              if [ -d "$SRC/headers" ]; then
                HDR_ROOT="$(mktemp -d)/linux-headers-${KVER}"
                mkdir -p "$HDR_ROOT/DEBIAN" "$HDR_ROOT/usr/src/linux-headers-${KVER}"
                cp -a "$SRC/headers/." "$HDR_ROOT/usr/src/linux-headers-${KVER}/"
                printf '%s\n' \
                  "Package: linux-headers-${KVER}" \
                  "Version: 1" \
                  "Architecture: ${DEB_ARCH}" \
                  "Maintainer: CI" \
                  "Description: Headers for ${KVER}" \
                  " Header files for self-built kernel ${KVER}." \
                  > "$HDR_ROOT/DEBIAN/control"
                dpkg-deb --root-owner-group --build "$HDR_ROOT" "$OUT/linux-headers-${KVER}_${DEB_ARCH}.deb"
              fi
              ;;

            rpm)
              RPM_VER="$(echo "$KVER" | rev | cut -d'-' -f2- | rev)"
              RPM_REL="$(echo "$KVER" | rev | cut -d'-' -f1 | rev)"
              [ -z "$RPM_VER" ] && RPM_VER="$KVER"
              [ -z "$RPM_REL" ] && RPM_REL="1"
              RPM_TOPDIR="$(mktemp -d)"
              mkdir -p "$RPM_TOPDIR"/{BUILD,RPMS,SOURCES,SPECS,BUILDROOT}

              SPEC="$RPM_TOPDIR/SPECS/kernel-image.spec"
              : > "$SPEC"
              printf '%s\n' \
                '%global debug_package %{nil}' \
                '%global __strip /bin/true' \
                '%global __find_provides %{nil}' \
                '%global __find_requires %{nil}' \
                '%define _unpackaged_files_terminate_build 0' \
                '' \
                "Name: kernel-image-${KVER}" \
                "Version: ${RPM_VER}" \
                "Release: ${RPM_REL}" \
                "Summary: Linux kernel ${KVER}" \
                "License: GPL-2.0-only" \
                "AutoReqProv: no" \
                "BuildArch: ${RPM_ARCH}" \
                '' \
                '%description' \
                'Kernel image and modules' \
                '' \
                '%install' \
                'rm -rf %{buildroot}' \
                'mkdir -p %{buildroot}/boot %{buildroot}/lib/modules' \
                "cp ${VMLINUZ} %{buildroot}/boot/vmlinuz-${KVER}" \
                "cp ${SYSTEM_MAP} %{buildroot}/boot/System.map-${KVER}" \
                "cp ${CONFIG_FILE} %{buildroot}/boot/config-${KVER}" \
                "cp -a ${MODULES_DIR}/${MODULES_KVER} %{buildroot}/lib/modules/${KVER}" \
                '' \
                '%files' \
                "/boot/vmlinuz-${KVER}" \
                "/boot/System.map-${KVER}" \
                "/boot/config-${KVER}" \
                "/lib/modules/${KVER}" \
                '' \
                '%post' \
                "/sbin/depmod -a ${KVER} 2>/dev/null || true" \
                'if [ -x /usr/bin/dracut ]; then' \
                "  /usr/bin/dracut --force --kver ${KVER} /boot/initramfs-${KVER}.img 2>/dev/null || true" \
                'fi' \
                'if [ -x /usr/sbin/grub2-mkconfig ] && [ -d /boot/grub2 ]; then' \
                '  /usr/sbin/grub2-mkconfig -o /boot/grub2/grub.cfg >/dev/null 2>&1 || true' \
                'elif [ -x /usr/sbin/grub-mkconfig ] && [ -d /boot/grub ]; then' \
                '  /usr/sbin/grub-mkconfig -o /boot/grub/grub.cfg >/dev/null 2>&1 || true' \
                'fi' \
                'if [ -x /usr/sbin/grubby ]; then' \
                '  /usr/sbin/grubby --update-kernel=ALL >/dev/null 2>&1 || true' \
                'fi' \
                '' \
                '%postun' \
                "/sbin/depmod -a ${KVER} 2>/dev/null || true" \
                "rm -f /boot/initramfs-${KVER}.img /boot/initramfs-${KVER}-fallback.img /boot/initrd-${KVER} 2>/dev/null || true" \
                'if [ -x /usr/sbin/grub2-mkconfig ] && [ -d /boot/grub2 ]; then' \
                '  /usr/sbin/grub2-mkconfig -o /boot/grub2/grub.cfg >/dev/null 2>&1 || true' \
                'elif [ -x /usr/sbin/grub-mkconfig ] && [ -d /boot/grub ]; then' \
                '  /usr/sbin/grub-mkconfig -o /boot/grub/grub.cfg >/dev/null 2>&1 || true' \
                'fi' \
                >> "$SPEC"

              rpmbuild --define "_topdir $RPM_TOPDIR" -bb "$SPEC" \
                || { echo "ERROR: rpmbuild kernel-image 失败" >&2; exit 1; }

              if [ -d "$SRC/headers" ]; then
                HSPEC="$RPM_TOPDIR/SPECS/kernel-headers.spec"
                : > "$HSPEC"
                printf '%s\n' \
                  '%global debug_package %{nil}' \
                  '%global __strip /bin/true' \
                  '%global __find_provides %{nil}' \
                  '%global __find_requires %{nil}' \
                  '%define _unpackaged_files_terminate_build 0' \
                  '' \
                  "Name: kernel-headers-${KVER}" \
                  "Version: ${RPM_VER}" \
                  "Release: ${RPM_REL}" \
                  "Summary: Headers for ${KVER}" \
                  "License: GPL-2.0-only" \
                  "AutoReqProv: no" \
                  "BuildArch: ${RPM_ARCH}" \
                  '' \
                  '%description' \
                  'Kernel headers' \
                  '' \
                  '%install' \
                  'rm -rf %{buildroot}' \
                  "mkdir -p %{buildroot}/usr/src/linux-headers-${KVER}" \
                  "cp -a ${SRC}/headers/. %{buildroot}/usr/src/linux-headers-${KVER}/" \
                  '' \
                  '%files' \
                  "/usr/src/linux-headers-${KVER}" \
                  >> "$HSPEC"
                rpmbuild --define "_topdir $RPM_TOPDIR" -bb "$HSPEC" \
                  || { echo "ERROR: rpmbuild kernel-headers 失败" >&2; exit 1; }
              fi

              find "$RPM_TOPDIR/RPMS" -name '*.rpm' -exec cp {} "$OUT/" \;
              [ -n "$(find "$OUT" -name '*.rpm' -print -quit)" ] \
                || { echo "ERROR: 未生成 rpm" >&2; exit 1; }
              ;;

            tarxz)
              PKG_ROOT="$(mktemp -d)/linux-${KVER}-${ARCH}"
              mkdir -p "$PKG_ROOT/boot" "$PKG_ROOT/lib/modules"
              cp "$VMLINUZ" "$PKG_ROOT/boot/vmlinuz-${KVER}"
              cp "$SYSTEM_MAP" "$PKG_ROOT/boot/"
              cp "$CONFIG_FILE" "$PKG_ROOT/boot/"
              cp -a "$MODULES_DIR/$MODULES_KVER" "$PKG_ROOT/lib/modules/${KVER}"

              if [ -d "$SRC/headers" ]; then
                mkdir -p "$PKG_ROOT/usr/src"
                cp -a "$SRC/headers" "$PKG_ROOT/usr/src/linux-headers-${KVER}"
              fi

              PKG_BASENAME="$(basename "$PKG_ROOT")"

              # 安装脚本：只拷贝文件 + depmod，initrd 与引导交给用户手动处理
              INST="$(pwd)/build-artifacts/install-${KVER}.sh"
              : > "$INST"
              printf '%s\n' \
                '#!/bin/sh' \
                'set -e' \
                '[ "$(id -u)" = "0" ] || { echo "请 root 运行" >&2; exit 1; }' \
                'mkdir -p /boot /lib/modules' \
                "cp -a \"${PKG_BASENAME}/boot/\"* /boot/ 2>/dev/null || true" \
                "cp -a \"${PKG_BASENAME}/lib/modules/${KVER}\" /lib/modules/ 2>/dev/null || true" \
                "if [ -d \"${PKG_BASENAME}/usr/src/linux-headers-${KVER}\" ]; then mkdir -p /usr/src; cp -a \"${PKG_BASENAME}/usr/src/linux-headers-${KVER}\" /usr/src/; fi" \
                "depmod ${KVER} 2>/dev/null || depmod -a 2>/dev/null || true" \
                'echo "内核文件已安装到 /boot 与 /lib/modules。请手动生成 initrd 并更新引导："' \
                "echo \"  Debian/Ubuntu : update-initramfs -c -k ${KVER} && update-grub\"" \
                "echo \"  Fedora/RHEL   : dracut --force --kver ${KVER} && grub2-mkconfig -o /boot/grub2/grub.cfg\"" \
                "echo \"  Arch/Manjaro  : mkinitcpio -k ${KVER} -g /boot/initramfs-${KVER}.img && grub-mkconfig -o /boot/grub/grub.cfg\"" \
                "echo \"  Alpine        : mkinitfs -k ${KVER}\"" \
                'echo "完成"' \
                >> "$INST"

              # 卸载脚本：自动清 initrd（覆盖各发行版命名）+ 删内核/模块/headers + depmod + 更新引导
              UNINST="$(pwd)/build-artifacts/uninstall-${KVER}.sh"
              : > "$UNINST"
              printf '%s\n' \
                '#!/bin/sh' \
                'set -e' \
                '[ "$(id -u)" = "0" ] || { echo "请 root 运行" >&2; exit 1; }' \
                'echo "清理 initrd ..."' \
                "rm -f '/boot/initramfs-${KVER}.img' '/boot/initramfs-${KVER}-fallback.img' '/boot/initrd.img-${KVER}' '/boot/initrd-${KVER}' '/boot/initramfs-genkernel-${KVER}' '/boot/initramfs-genkernel-x86_64-${KVER}' '/boot/initramfs-genkernel-aarch64-${KVER}' 2>/dev/null || true" \
                'if command -v update-initramfs >/dev/null 2>&1; then' \
                "  update-initramfs -d -k '${KVER}' 2>/dev/null || true" \
                'fi' \
                'echo "清理内核文件 ..."' \
                "rm -f '/boot/vmlinuz-${KVER}' '/boot/System.map-${KVER}' '/boot/config-${KVER}' 2>/dev/null || true" \
                "rm -rf '/lib/modules/${KVER}' 2>/dev/null || true" \
                "rm -rf '/usr/src/linux-headers-${KVER}' 2>/dev/null || true" \
                'command -v depmod >/dev/null 2>&1 && { depmod -a 2>/dev/null || true; }' \
                'echo "更新引导 ..."' \
                'if command -v update-grub >/dev/null 2>&1; then' \
                '  update-grub 2>/dev/null || true' \
                'elif command -v grub2-mkconfig >/dev/null 2>&1 && [ -d /boot/grub2 ]; then' \
                '  grub2-mkconfig -o /boot/grub2/grub.cfg 2>/dev/null || true' \
                'elif command -v grub-mkconfig >/dev/null 2>&1 && [ -d /boot/grub ]; then' \
                '  grub-mkconfig -o /boot/grub/grub.cfg 2>/dev/null || true' \
                'fi' \
                'if [ -x /usr/sbin/grubby ]; then' \
                '  /usr/sbin/grubby --update-kernel=ALL >/dev/null 2>&1 || true' \
                'fi' \
                'echo "卸载完成"' \
                >> "$UNINST"

              cp "$INST" "$PKG_ROOT/"
              cp "$UNINST" "$PKG_ROOT/"
              chmod 755 "$PKG_ROOT/install-${KVER}.sh" "$PKG_ROOT/uninstall-${KVER}.sh"

              cd "$(dirname "$PKG_ROOT")"
              tar --owner=0 --group=0 --numeric-owner -cJf "$OUT/linux-${KVER}-${ARCH}.tar.xz" "$PKG_BASENAME"
              ;;

            pkg)
              IMG_ROOT="$(mktemp -d)"
              mkdir -p "$IMG_ROOT/boot" "$IMG_ROOT/lib/modules"
              cp "$VMLINUZ" "$IMG_ROOT/boot/vmlinuz-${KVER}"
              cp "$SYSTEM_MAP" "$IMG_ROOT/boot/"
              cp "$CONFIG_FILE" "$IMG_ROOT/boot/"
              cp -a "$MODULES_DIR/$MODULES_KVER" "$IMG_ROOT/lib/modules/${KVER}"

              # .INSTALL：安装/升级时生成 initrd + 更新引导；卸载时清 initrd + 更新引导
              printf '%s\n' \
                'post_install() {' \
                "  depmod ${KVER} 2>/dev/null || true" \
                '  if command -v mkinitcpio >/dev/null 2>&1; then' \
                "    mkinitcpio -k ${KVER} -g /boot/initramfs-${KVER}.img 2>/dev/null || true" \
                '  fi' \
                '  if command -v grub-mkconfig >/dev/null 2>&1; then' \
                '    grub-mkconfig -o /boot/grub/grub.cfg >/dev/null 2>&1 || true' \
                '  fi' \
                '}' \
                'post_upgrade() {' \
                '  post_install' \
                '}' \
                'pre_remove() {' \
                "  rm -f /boot/initramfs-${KVER}.img /boot/initramfs-${KVER}-fallback.img 2>/dev/null || true" \
                '}' \
                'post_remove() {' \
                '  depmod -a 2>/dev/null || true' \
                '  if command -v grub-mkconfig >/dev/null 2>&1; then' \
                '    grub-mkconfig -o /boot/grub/grub.cfg >/dev/null 2>&1 || true' \
                '  fi' \
                '}' \
                > "$IMG_ROOT/linux-image-${KVER}.install"

              printf '%s\n' \
                "pkgname = linux-image-${KVER}" \
                "pkgver = ${KVER}-1" \
                "arch = ${ARCH}" \
                "license = GPL-2.0-only" \
                "install = linux-image-${KVER}.install" \
                > "$IMG_ROOT/.PKGINFO"

              cd "$IMG_ROOT"
              tar --owner=0 --group=0 --numeric-owner -cf - . | zstd -T0 -19 -o "$OUT/linux-image-${KVER}-${ARCH}.pkg.tar.zst" --force

              if [ -d "$SRC/headers" ]; then
                HDR_ROOT="$(mktemp -d)"
                mkdir -p "$HDR_ROOT/usr/src/linux-headers-${KVER}"
                cp -a "$SRC/headers/." "$HDR_ROOT/usr/src/linux-headers-${KVER}/"
                printf '%s\n' \
                  "pkgname = linux-headers-${KVER}" \
                  "pkgver = ${KVER}-1" \
                  "arch = ${ARCH}" \
                  "license = GPL-2.0-only" \
                  > "$HDR_ROOT/.PKGINFO"
                cd "$HDR_ROOT"
                tar --owner=0 --group=0 --numeric-owner -cf - . | zstd -T0 -19 -o "$OUT/linux-headers-${KVER}-${ARCH}.pkg.tar.zst" --force
              fi
              ;;
          esac

      - name: 上传 ${{ inputs.format }} 产物
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.arch }}-${{ inputs.format }}
          path: dist/${{ inputs.arch }}/${{ inputs.format }}/**/*
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: 产物清单
        run: |
          set -euo pipefail
          find "dist/${{ inputs.arch }}/${{ inputs.format }}" -type f -exec ls -lh {} \; | awk '{print $5, $9}'
