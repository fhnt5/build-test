name: Build LQX Kernel (v7.2.6-lqx1)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          bc \
          dwarves \
          zstd \
          cpio \
          rsync \
          kmod \
          debhelper \
          fakeroot \
          git

    - name: Clone zen-kernel at v7.2.6-lqx1
      run: |
        git clone --depth 1 --branch v7.2.6-lqx1 \
          https://github.com/zen-kernel/zen-kernel.git kernel-source

    - name: Apply custom .config
      run: |
        cd kernel-source
        cp ../.config .config
        make olddefconfig

    - name: Build kernel packages
      run: |
        cd kernel-source
        make -j$(nproc) bindeb-pkg

    - name: List generated .deb packages
      run: ls -lh *.deb

    - name: Upload kernel packages
      uses: actions/upload-artifact@v4
      with:
        name: lqx-kernel-deb
        path: "*.deb"
        if-no-files-found: error
