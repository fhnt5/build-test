name: Build Kernel Core

# 被调用方（workflow_call）
#
# 拆分理由
#   build.yml       入口。workflow_dispatch 的 inputs 上限为 25（GitHub 硬限制），
#                  因此只放用户最常用的开关。
#   build-core.yml  本文件。workflow_call 的 inputs 无上限，所有"精细化 / 进阶"
#                  选项都应加在这里，而不是入口文件。
#
# 配置冲突处理规则（执行顺序固定）
#   应用 .config  -->  应用调优预设  -->  应用 LTO  -->  make olddefconfig（唯一收敛点）
#   1) respect_config=true（默认，严格模式）
#      - 不改动 .config 的任何既有选择
#      - 只补两个链接期必选项：CONFIG_LD_ORPHAN_WARN_LEVEL、CONFIG_LOCALVERSION_AUTO
#      - 直接跳过"应用调优"与"应用 LTO"两步
#   2) 预设之间互斥项（如 performance 与 lowlatency 都要改 CONFIG_PREEMPT）
#      - 统一"先 sed 删旧值、再 echo 写新值"，后写覆盖先写，以当前所选预设为准
#   3) LTO 四选一（CONFIG_LTO / _CLANG_FULL / _CLANG_THIN / _NONE）
#      - 独立 step 强制写齐四个，避免"开了 LTO 但 _NONE 还开着"的链接期报错
#   4) make olddefconfig 让 Kconfig 自己处理 select / depends on

on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      formats:
        type: string
        required: true
      config_choice:
        type: string
        default: 'default'
      config_custom:
        type: string
        default: ''
      respect_config:
        type: boolean
        default: true
      include_headers:
        type: boolean
        default: true
      headers_full_tree:
        type: boolean
        default: true
      strip_modules:
        type: boolean
        default: false
      tarxz_include_headers:
        type: boolean
        default: true
      parallel_jobs:
        type: string
        default: 'auto'
      ccache:
        type: boolean
        default: false
      lto_mode:
        type: string
        default: 'none'
      tune_profile:
        type: string
        default: 'none'
      kernel_repo:
        type: string
        default: 'https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git'
      kernel_ref:
        type: string
        required: true
      release_tag:
        type: string
        default: ''

jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 设置架构变量
        id: arch
        run: |
          set -euo pipefail
          case "${{ inputs.arch }}" in
            x86_64|amd64)
              echo "karch=x86_64"    >> "$GITHUB_OUTPUT"
              echo "deb_arch=amd64"  >> "$GITHUB_OUTPUT"
              echo "rpm_arch=x86_64" >> "$GITHUB_OUTPUT"
              echo "arch_name=x86_64"  >> "$GITHUB_OUTPUT"
              echo "image=arch/x86/boot/bzImage" >> "$GITHUB_OUTPUT"
              ;;
            arm64|aarch64)
              echo "karch=arm64"      >> "$GITHUB_OUTPUT"
              echo "deb_arch=arm64"    >> "$GITHUB_OUTPUT"
              echo "rpm_arch=aarch64"  >> "$GITHUB_OUTPUT"
              echo "arch_name=arm64"  >> "$GITHUB_OUTPUT"
              echo "image=arch/arm64/boot/Image" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "不支持的架构: ${{ inputs.arch }}" >&2
              exit 1
              ;;
          esac

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            libdw-dev elfutils bc dwarves zstd cpio rsync kmod xz-utils \
            dpkg-dev rpm git jq curl ccache clang lld llvm

      - name: 克隆内核源码
        id: clone
        run: |
          set -euo pipefail
          REF="${{ inputs.kernel_ref }}"
          REPO="${{ inputs.kernel_repo }}"
          if ! git clone --depth 1 --branch "$REF" "$REPO" kernel-source 2>/dev/null; then
            rm -rf kernel-source
            git clone --branch "$REF" "$REPO" kernel-source
          fi
          cd kernel-source
          echo "KVER=$(make -s kernelrelease)" >> "$GITHUB_OUTPUT"

      - name: 解析并应用配置
        id: config
        run: |
          set -euo pipefail
          CHOICE="${{ inputs.config_choice }}"
          CUSTOM="${{ inputs.config_custom }}"
          KARCH="${{ steps.arch.outputs.karch }}"
          OUT="/tmp/kernel.config"

          if [ -n "$CUSTOM" ]; then
            CHOICE="$CUSTOM"
          fi

          resolve_url() {
            case "$1" in
              alma)     echo 'https://git.almalinux.org/rpms/kernel/-/raw/c9/f/kernel-x86_64-fedora.config' ;;
              alpine)   echo 'https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/linux-lts/config-lts.x86_64' ;;
              arch)     echo 'https://gitlab.archlinux.org/archlinux/packaging/packages/linux/-/raw/main/config' ;;
              centos)   echo 'https://gitlab.com/redhat/centos-stream/rpms/kernel/-/raw/c9s/f/kernel-x86_64-fedora.config' ;;
              debian)   echo 'https://salsa.debian.org/kernel-team/linux/-/raw/debian/latest/debian/config/config' ;;
              fedora)   echo 'https://src.fedoraproject.org/rpms/kernel/raw/rawhide/f/kernel-x86_64-fedora.config' ;;
              gentoo)   echo 'https://gitweb.gentoo.org/proj/gentoo-kernel.git/plain/default_config' ;;
              kali)     echo 'https://gitlab.com/kalilinux/packages/linux/-/raw/kali/master/debian/config/config' ;;
              manjaro)  echo 'https://gitlab.manjaro.org/packages/core/linux/-/raw/master/config' ;;
              nixos)    echo 'https://raw.githubusercontent.com/NixOS/nixpkgs/master/pkgs/os-specific/linux/kernel/common-config.nix' ;;
              opensuse) echo 'https://raw.githubusercontent.com/openSUSE/kernel-source/master/config/x86_64/default' ;;
              rhel)     echo 'https://gitlab.com/redhat/centos-stream/rpms/kernel/-/raw/c9s/f/kernel-x86_64-fedora.config' ;;
              rocky)    echo 'https://git.rockylinux.org/rocky/kernel/-/raw/r9/f/kernel-x86_64-fedora.config' ;;
              ubuntu)   echo 'https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/jammy/plain/debian.master/config/amd64/config.flavour.generic' ;;
              void)     echo 'https://raw.githubusercontent.com/void-linux/void-packages/master/srcpkgs/linux/files/x86_64-dotconfig' ;;
              *)        echo "" ;;
            esac
          }

          if echo "$CHOICE" | grep -qE '^https?://'; then
            curl -fSL "$CHOICE" -o "$OUT"
          elif echo "$CHOICE" | grep -qE '^make:'; then
            cd kernel-source && make ARCH="$KARCH" "${CHOICE#make:}" && cp .config "$OUT" && cd ..
          elif [ -f "$CHOICE" ]; then
            cp "$CHOICE" "$OUT"
          elif [ -f "configs/$CHOICE" ]; then
            cp "configs/$CHOICE" "$OUT"
          elif echo "$CHOICE" | grep -qE '^(default|allyesconfig|allmodconfig|allnoconfig|tinyconfig)$'; then
            cd kernel-source && make ARCH="$KARCH" "$CHOICE" && cp .config "$OUT" && cd ..
          else
            URL="$(resolve_url "$CHOICE")"
            if [ "$KARCH" = "arm64" ]; then
              case "$CHOICE" in
                alma|centos|fedora|rhel|rocky)
                  URL='https://git.almalinux.org/rpms/kernel/-/raw/c9/f/kernel-aarch64-fedora.config' ;;
                alpine)
                  URL='https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/linux-lts/config-lts.aarch64' ;;
                opensuse)
                  URL='https://raw.githubusercontent.com/openSUSE/kernel-source/master/config/arm64/default' ;;
                ubuntu)
                  URL='https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/jammy/plain/debian.master/config/arm64/config.flavour.generic' ;;
                void)
                  URL='https://raw.githubusercontent.com/void-linux/void-packages/master/srcpkgs/linux/files/aarch64-dotconfig' ;;
              esac
            fi
            if [ -z "$URL" ]; then
              echo "未知配置预设: $CHOICE" >&2
              exit 1
            fi
            curl -fSL "$URL" -o "$OUT"
          fi

          cd kernel-source
          cp "$OUT" .config

          # 必选项：无论是否严格模式都要保证，否则链接期直接失败
          grep -q '^CONFIG_LD_ORPHAN_WARN_LEVEL=' .config \
            || echo 'CONFIG_LD_ORPHAN_WARN_LEVEL="warn"' >> .config
          grep -q '^CONFIG_LOCALVERSION_AUTO=' .config \
            || echo 'CONFIG_LOCALVERSION_AUTO=y' >> .config

          if [ "${{ inputs.respect_config }}" != "true" ]; then
            make ARCH="$KARCH" olddefconfig </dev/null
          fi

      - name: 应用调优预设
        if: ${{ inputs.respect_config != true }}
        run: |
          set -euo pipefail
          cd kernel-source
          KARCH="${{ steps.arch.outputs.karch }}"

          set_yes() {
            sed -i "/^CONFIG_$1=/d" .config
            echo "CONFIG_$1=y" >> .config
          }
          set_no() {
            sed -i "/^CONFIG_$1=/d" .config
            echo "# CONFIG_$1 is not set" >> .config
          }

          case "${{ inputs.tune_profile }}" in
            performance)
              set_yes NO_HZ_FULL
              set_yes RCU_NOCBS
              set_yes PREEMPT_DYNAMIC
              set_yes CPU_FREQ_DEFAULT_GOV_PERFORMANCE
              set_no MITIGATION_RETPOLINE
              set_no MITIGATION_SPECTRE_BHI
              set_no MITIGATION_IBPB_ENTRY
              set_no MITIGATION_IBRS_ENTRY
              set_no MITIGATION_L1TF
              set_no MITIGATION_PTI
              set_no CPU_FREQ_DEFAULT_GOV_ONDEMAND
              ;;
            lowlatency)
              set_yes PREEMPT
              set_no PREEMPT_VOLUNTARY
              set_no PREEMPT_NONE
              set_yes HZ_1000
              set_no HZ_250
              set_no HZ_300
              set_no HZ_100
              set_yes RCU_BOOST
              ;;
            minimal)
              sed -i '/^CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=/d' .config
              echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> .config
              set_no MODULE_SIG
              set_no MODULE_SIG_ALL
              set_no MODULE_SIG_FORCE
              ;;
            debugoff)
              for c in KASAN KMSAN KCSAN KFENCE KMEMLEAK DEBUG_INFO DWARF_TOOLCHAIN_DEFAULT \
                        FTRACE FUNCTION_TRACER FUNCTION_GRAPH_TRACER STACK_TRACER KPROBES \
                        UPROBES TRACEPOINTS DEBUG_FS SLUB_DEBUG DEBUG_PAGEALLOC \
                        DEBUG_KMEMLEAK DEBUG_STACK_USAGE SCHEDSTATS LATENCYTOP LOCK_STAT; do
                set_no "$c"
              done
              ;;
            default)
              for c in DEBUG_BUGVERBOSE DEBUG_LIST DEBUG_SG DEBUG_NOTIFIERS DEBUG_CREDENTIALS \
                        RCU_TRACE SCHED_DEBUG PRINTK_TIME DYNAMIC_DEBUG DEBUG_ATOMIC_SLEEP \
                        DEBUG_PREEMPT DEBUG_SPINLOCK DEBUG_MUTEXES DEBUG_RT_MUTEXES \
                        DEBUG_WW_MUTEX_SLOWPATH DEBUG_LOCK_ALLOC DEBUG_LOCKDEP \
                        DEBUG_KOBJECT DEBUG_KOBJECT_RELEASE; do
                set_no "$c"
              done
              ;;
            none)
              ;;
          esac

      - name: 应用 LTO
        if: ${{ inputs.respect_config != true }}
        run: |
          set -euo pipefail
          cd kernel-source
          LTO="${{ inputs.lto_mode }}"

          # 四个 LTO 相关符号必须全部显式写齐，否则链接期报
          # "multiple definitions of module layout" 或 "LTO enabled but no LLVM"
          sed -i '/^CONFIG_LTO=/d' .config
          sed -i '/^CONFIG_LTO_CLANG_FULL=/d' .config
          sed -i '/^CONFIG_LTO_CLANG_THIN=/d' .config
          sed -i '/^CONFIG_LTO_NONE=/d' .config

          if [ "$LTO" = "none" ]; then
            echo "CONFIG_LTO_NONE=y" >> .config
          else
            echo "CONFIG_LTO=y" >> .config
            echo "# CONFIG_LTO_NONE is not set" >> .config
            if [ "$LTO" = "full" ]; then
              echo "CONFIG_LTO_CLANG_FULL=y" >> .config
              echo "# CONFIG_LTO_CLANG_THIN is not set" >> .config
            else
              echo "# CONFIG_LTO_CLANG_FULL is not set" >> .config
              echo "CONFIG_LTO_CLANG_THIN=y" >> .config
            fi
          fi

      - name: 收敛配置
        if: ${{ inputs.respect_config != true }}
        run: |
          set -euo pipefail
          cd kernel-source
          make ARCH="${{ steps.arch.outputs.karch }}" olddefconfig </dev/null

      - name: 编译内核
        id: compile
        run: |
          set -euo pipefail
          cd kernel-source
          KARCH="${{ steps.arch.outputs.karch }}"

          JOBS="${{ inputs.parallel_jobs }}"
          [ "$JOBS" = "auto" ] && JOBS="$(nproc)"

          ARGS="ARCH=$KARCH -j$JOBS"

          if [ "${{ inputs.ccache }}" = "true" ]; then
            export PATH="/usr/lib/ccache:$PATH"
            export CC="ccache gcc"
            export HOSTCC="ccache gcc"
          fi

          if [ "${{ inputs.lto_mode }}" != "none" ]; then
            ARGS="$ARGS LLVM=1"
          fi

          make $ARGS
          echo "KVER=$(make -s kernelrelease)" >> "$GITHUB_OUTPUT"

      - name: 安装内核模块
        id: stage
        run: |
          set -euo pipefail
          cd kernel-source
          KARCH="${{ steps.arch.outputs.karch }}"
          KVER="${{ steps.compile.outputs.KVER }}"
          KIMAGE="${{ steps.arch.outputs.image }}"
          STAGE="$(mktemp -d)"

          mkdir -p "$STAGE/boot"
          cp "$KIMAGE" "$STAGE/boot/vmlinuz-${KVER}"
          cp System.map "$STAGE/boot/System.map-${KVER}"
          cp .config "$STAGE/boot/config-${KVER}"

          if [ "${{ inputs.strip_modules }}" = "true" ]; then
            make ARCH="$KARCH" modules_install INSTALL_MOD_PATH="$STAGE" INSTALL_MOD_STRIP=1
          else
            make ARCH="$KARCH" modules_install INSTALL_MOD_PATH="$STAGE"
          fi
          rm -f "$STAGE/lib/modules/${KVER}/build" "$STAGE/lib/modules/${KVER}/source"

          # 关键：用 GITHUB_OUTPUT（不是 GITHUB_ENV）跨 step 传值。
          # GITHUB_ENV 是环境变量命名空间，set -u 下 $STAGE 在当前 shell 未定义
          # 会直接报 "STAGE: unbound variable"
          echo "STAGE=$STAGE" >> "$GITHUB_OUTPUT"
          echo "KVER=$KVER"   >> "$GITHUB_OUTPUT"

      - name: 准备 headers
        id: headers
        if: ${{ inputs.include_headers == 'true' }}
        run: |
          set -euo pipefail
          cd kernel-source
          KARCH="${{ steps.arch.outputs.karch }}"
          KVER="${{ steps.compile.outputs.KVER }}"
          HDR="$(mktemp -d)"

          DEST="$HDR/usr/src/linux-headers-${KVER}"
          mkdir -p "$DEST"

          if [ "${{ inputs.headers_full_tree }}" = "true" ]; then
            cp -a include scripts arch "$DEST/"
          else
            cp -a include "$DEST/"
            mkdir -p "$DEST/scripts"
            for d in basic mod package recordmk kernel; do
              [ -d "scripts/$d" ] && cp -a "scripts/$d" "$DEST/scripts/"
            done
            mkdir -p "$DEST/arch"
            cp -a "arch/$KARCH" "$DEST/arch/"
          fi
          for f in Makefile .config Module.symvers Kbuild; do
            [ -f "$f" ] && cp "$f" "$DEST/"
          done

          echo "HDR=$HDR" >> "$GITHUB_OUTPUT"

      - name: 打包 deb
        if: ${{ contains(fromJSON(inputs.formats), 'deb') }}
        run: |
          set -euo pipefail
          DEB_ARCH="${{ steps.arch.outputs.deb_arch }}"
          KVER="${{ steps.compile.outputs.KVER }}"
          STAGE="${{ steps.stage.outputs.STAGE }}"
          OUT="dist/${{ steps.arch.outputs.arch_name }}/deb"
          mkdir -p "$OUT"

          IMG="$(mktemp -d)/linux-image-${KVER}"
          mkdir -p "$IMG/DEBIAN" "$IMG/boot" "$IMG/lib/modules"
          cp "$STAGE/boot/vmlinuz-${KVER}" "$IMG/boot/" 2>/dev/null \
            || cp "$STAGE/boot/"vmlinuz-* "$IMG/boot/vmlinuz-${KVER}"
          cp "$STAGE/boot/System.map-${KVER}" "$IMG/boot/"
          cp "$STAGE/boot/config-${KVER}"  "$IMG/boot/"
          cp -a "$STAGE/lib/modules/${KVER}" "$IMG/lib/modules/"

          # 控制文件一律逐行 printf，不用 heredoc。
          # 原因：heredoc 结束标记在 YAML 块标量里若带缩进，bash 匹配不到，
          #       报 "delimited by end-of-file (wanted XXX)"，进而 syntax error
          write_control() {
            local F="$1"; shift
            printf '%s\n' "$@" > "$F"
          }
          write_control "$IMG/DEBIAN/control" \
            "Package: linux-image-${KVER}" \
            'Version: 1' \
            "Architecture: ${DEB_ARCH}" \
            'Maintainer: CI' \
            "Description: Linux kernel ${KVER}"

          printf '%s\n' \
            '#!/bin/sh' \
            "depmod ${KVER} || true" \
            > "$IMG/DEBIAN/postinst"
          chmod 755 "$IMG/DEBIAN/postinst"

          dpkg-deb --root-owner-group --build "$IMG" \
            "$OUT/linux-image-${KVER}_${DEB_ARCH}.deb"

          if [ "${{ inputs.include_headers }}" = "true" ]; then
            HDR="${{ steps.headers.outputs.HDR }}"
            H="$(mktemp -d)/linux-headers-${KVER}"
            mkdir -p "$H/DEBIAN" "$H/usr/src/linux-headers-${KVER}"
            cp -a "$HDR/usr/src/linux-headers-${KVER}/." "$H/usr/src/linux-headers-${KVER}/"
            write_control "$H/DEBIAN/control" \
              "Package: linux-headers-${KVER}" \
              'Version: 1' \
              "Architecture: ${DEB_ARCH}" \
              'Maintainer: CI' \
              "Description: Headers for ${KVER}"
            dpkg-deb --root-owner-group --build "$H" \
              "$OUT/linux-headers-${KVER}_${DEB_ARCH}.deb"
          fi

      - name: 打包 rpm
        if: ${{ contains(fromJSON(inputs.formats), 'rpm') }}
        run: |
          set -euo pipefail
          RPM_ARCH="${{ steps.arch.outputs.rpm_arch }}"
          KVER="${{ steps.compile.outputs.KVER }}"
          STAGE="${{ steps.stage.outputs.STAGE }}"
          VER="$(echo "$KVER" | sed -E 's/-[^-]*$//')"
          REL="$(echo "$KVER" | sed -E 's/.*-//')_1"
          [ -z "$VER" ] && VER="$KVER"
          [ -z "$REL" ] && REL="1"
          TOP="$(mktemp -d)"
          mkdir -p "$TOP"/{BUILD,RPMS,SOURCES,SPECS,BUILDROOT}
          OUT="dist/${{ steps.arch.outputs.arch_name }}/rpm"
          mkdir -p "$OUT"

          # spec 用 printf 数组逐行生成，占位符（大写）写完再 sed 替换。
          # 彻底规避三类 YAML 雷：heredoc 结束标记 / 多行字符串 / 反斜杠续行
          write_spec() {
            local SPEC="$1"; local NAME="$2"; local SUMMARY="$3"
            local I1="$4"; local I2="$5"; local I3="$6"
            shift 6
            printf '%s\n' \
              '%global debug_package %{nil}' \
              '%global __strip /bin/true' \
              '%global __find_provides %{nil}' \
              '%global __find_requires %{nil}' \
              '%define _unpackaged_files_terminate_build 0' \
              "Name: KNAME" \
              "Version: VER" \
              "Release: REL" \
              "Summary: KSUMMARY" \
              'License: GPL-2.0-only' \
              'AutoReqProv: no' \
              'BuildArch: ARCH' \
              '' \
              '%description' \
              'KSUMMARY' \
              '' \
              '%install' \
              'rm -rf %{buildroot}' \
              'mkdir -p %{buildroot}/boot %{buildroot}/lib/modules' \
              "${I1}" \
              "${I2}" \
              "${I3}" \
              '' \
              '%files' \
              "$@" \
              > "$SPEC"
            sed -i "s|KNAME|${NAME}|g"     "$SPEC"
            sed -i "s|KSUMMARY|${SUMMARY}|g" "$SPEC"
            sed -i "s|KVER|${KVER}|g"      "$SPEC"
            sed -i "s|VER|${VER}|g"        "$SPEC"
            sed -i "s|REL|${REL}|g"        "$SPEC"
            sed -i "s|ARCH|${RPM_ARCH}|g"  "$SPEC"
          }

          if [ "${{ inputs.include_headers }}" = "true" ]; then
            HDR="${{ steps.headers.outputs.HDR }}"
            write_spec "$TOP/SPECS/kernel-headers.spec" \
              "kernel-headers-${KVER}" \
              "Headers for ${KVER}" \
              'mkdir -p %{buildroot}/usr/src/linux-headers-KVER' \
              'cp -a HDR/* %{buildroot}/usr/src/linux-headers-KVER/' \
              '' \
              "/usr/src/linux-headers-${KVER}"
            sed -i "s|HDR|${HDR}|g" "$TOP/SPECS/kernel-headers.spec"
            rpmbuild --define "_topdir $TOP" -bb "$TOP/SPECS/kernel-headers.spec"
          fi

          write_spec "$TOP/SPECS/kernel-image.spec" \
            "kernel-image-${KVER}" \
            "Linux kernel ${KVER}" \
            'cp STAGE/boot/vmlinuz-KVER %{buildroot}/boot/ 2>/dev/null || :' \
            'cp STAGE/boot/System.map-KVER %{buildroot}/boot/ 2>/dev/null || :' \
            'cp -a STAGE/lib/modules/KVER %{buildroot}/lib/modules/ 2>/dev/null || :' \
            "/boot/vmlinuz-KVER" \
            "/boot/System.map-KVER" \
            "/boot/config-KVER" \
            "/lib/modules/KVER"
          sed -i "s|STAGE|${STAGE}|g" "$TOP/SPECS/kernel-image.spec"
          rpmbuild --define "_topdir $TOP" -bb "$TOP/SPECS/kernel-image.spec"
          find "$TOP/RPMS" -name '*.rpm' -exec cp {} "$OUT"/ \;

      - name: 打包 tar.xz
        if: ${{ contains(fromJSON(inputs.formats), 'tarxz') }}
        run: |
          set -euo pipefail
          ARCH_NAME="${{ steps.arch.outputs.arch_name }}"
          KVER="${{ steps.compile.outputs.KVER }}"
          STAGE="${{ steps.stage.outputs.STAGE }}"
          OUT="dist/${ARCH_NAME}/tarxz"
          mkdir -p "$OUT"
          PKG_NAME="linux-${KVER}-${ARCH_NAME}"
          PKG="$(mktemp -d)/${PKG_NAME}"
          mkdir -p "$PKG/boot" "$PKG/lib/modules"

          cp "$STAGE/boot/vmlinuz-${KVER}" "$PKG/boot/" 2>/dev/null \
            || cp "$STAGE/boot/"vmlinuz-* "$PKG/boot/vmlinuz-${KVER}"
          cp "$STAGE/boot/System.map-${KVER}" "$PKG/boot/"
          cp "$STAGE/boot/config-${KVER}"  "$PKG/boot/"
          cp -a "$STAGE/lib/modules/${KVER}" "$PKG/lib/modules/"

          if [ "${{ inputs.include_headers }}" = "true" ] && [ "${{ inputs.tarxz_include_headers }}" = "true" ]; then
            HDR="${{ steps.headers.outputs.HDR }}"
            mkdir -p "$PKG/usr/src"
            cp -a "$HDR/usr/src/linux-headers-${KVER}" "$PKG/usr/src/"
          fi

          # install 脚本内所有 $ 前加 \ 转义，避免被 GitHub Actions 的 ${{ }} 解析误伤
          printf '%s\n' \
            '#!/bin/sh' \
            'set -e' \
            '[ "$(id -u)" = "0" ] || { echo "need root" >&2; exit 1; }' \
            'mkdir -p /boot' \
            "cp -a \"${PKG_NAME}/boot/\"* /boot/ 2>/dev/null || true" \
            "cp -a \"${PKG_NAME}/lib/modules/${KVER}\" /lib/modules/ 2>/dev/null || true" \
            "if [ -d \"${PKG_NAME}/usr/src/linux-headers-${KVER}\" ]; then cp -a \"${PKG_NAME}/usr/src/linux-headers-${KVER}\" /usr/src/; fi" \
            "depmod ${KVER} 2>/dev/null || true" \
            'echo done' \
            > "$PKG/install-${KVER}.sh"
          chmod 755 "$PKG/install-${KVER}.sh"

          # 拆成 cd + tar 两步，不用 ( ... ) 子 shell：
          # 子 shell 在 YAML 块标量里会被误判为列表开始
          cd "$(dirname "$PKG")"
          tar --owner=0 --group=0 --numeric-owner \
            -cJf "$OLDPWD/$OUT/${PKG_NAME}.tar.xz" "$PKG_NAME"

      - name: 打包 pkg.tar.zst
        if: ${{ contains(fromJSON(inputs.formats), 'pkg') }}
        run: |
          set -euo pipefail
          ARCH_NAME="${{ steps.arch.outputs.arch_name }}"
          KVER="${{ steps.compile.outputs.KVER }}"
          STAGE="${{ steps.stage.outputs.STAGE }}"
          OUT="dist/${ARCH_NAME}/pkg"
          mkdir -p "$OUT"

          IMG="$(mktemp -d)"
          mkdir -p "$IMG/boot" "$IMG/lib/modules"
          cp "$STAGE/boot/vmlinuz-${KVER}" "$IMG/boot/" 2>/dev/null \
            || cp "$STAGE/boot/"vmlinuz-* "$IMG/boot/vmlinuz-${KVER}"
          cp "$STAGE/boot/System.map-${KVER}" "$IMG/boot/"
          cp "$STAGE/boot/config-${KVER}"  "$IMG/boot/"
          cp -a "$STAGE/lib/modules/${KVER}" "$IMG/lib/modules/"

          write_pkginfo() {
            local F="$1"; shift
            printf '%s\n' "$@" > "$F"
          }
          write_pkginfo "$IMG/.PKGINFO" \
            "pkgname = linux-image-${KVER}" \
            "pkgver = ${KVER}-1" \
            "arch = ${ARCH_NAME}" \
            'license = GPL-2.0-only'

          cd "$IMG"
          tar --owner=0 --group=0 --numeric-owner -cf - . \
            | zstd -T0 -19 --force \
            -o "$OLDPWD/$OUT/linux-image-${KVER}-${ARCH_NAME}.pkg.tar.zst"

          if [ "${{ inputs.include_headers }}" = "true" ]; then
            HDR="${{ steps.headers.outputs.HDR }}"
            H="$(mktemp -d)"
            mkdir -p "$H/usr/src/linux-headers-${KVER}"
            cp -a "$HDR/usr/src/linux-headers-${KVER}/." "$H/usr/src/linux-headers-${KVER}/"
            write_pkginfo "$H/.PKGINFO" \
              "pkgname = linux-headers-${KVER}" \
              "pkgver = ${KVER}-1" \
              "arch = ${ARCH_NAME}" \
              'license = GPL-2.0-only'
            cd "$H"
            tar --owner=0 --group=0 --numeric-owner -cf - . \
              | zstd -T0 -19 --force \
              -o "$OLDPWD/$OUT/linux-headers-${KVER}-${ARCH_NAME}.pkg.tar.zst"
          fi

      - name: 按架构分别上传制品
        # 关键：不能把四个格式的产出合成一个 artifact。
        # strategy.matrix 会产生 x86_64 与 arm64 两个独立 job，跑在不同 runner。
        # 若共用一个 artifact 名，下载 x86_64 的 rpm 会被迫连带下载 arm64 的 GB 级产物。
        if: ${{ always() && !cancelled() }}
        strategy:
          matrix:
            fmt: [deb, rpm, tarxz, pkg]
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ steps.arch.outputs.arch_name }}-${{ matrix.fmt }}
          path: dist/${{ steps.arch.outputs.arch_name }}/${{ matrix.fmt }}/**/*
          if-no-files-found: warn
          retention-days: 7

      - name: 统计产物
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          KVER="${{ steps.compile.outputs.KVER }}"
          ARCH_NAME="${{ steps.arch.outputs.arch_name }}"
          echo "KVER=${KVER}"
          echo "ARCH=${ARCH_NAME}"
          find "dist/${ARCH_NAME}" -type f -printf '%s\t%p\n' 2>/dev/null \
            | awk '{printf "  %.2f MiB  %s\n", $1/1048576, $2}' \
            || find "dist/${ARCH_NAME}" -type f -exec ls -lh {} \;
