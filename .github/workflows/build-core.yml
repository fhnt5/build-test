name: Build Kernel Core

# 被 build.yml 通过 workflow_call 调用。inputs 无 25 个上限。
# 关键约定：
#   1) KVER / STAGE / HDR_STAGE 一律走 step outputs (GITHUB_OUTPUT)，不靠 GITHUB_ENV 隐式传递
#   2) run: | 块内禁止行首出现 ( { - ? : 等 YAML 特殊字符
#   3) 禁止 heredoc 写文件，一律用 printf / echo 重定向
#   4) 每个 arch 独立一个 artifact，绝不把 x86_64 与 arm64 产物混在一个包里

on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      formats:
        type: string
        required: true
      config_choice:
        type: string
        default: 'default'
      config_custom:
        type: string
        default: ''
      respect_config:
        type: boolean
        default: true
      include_headers:
        type: boolean
        default: true
      headers_full_tree:
        type: boolean
        default: true
      strip_modules:
        type: boolean
        default: false
      tarxz_include_headers:
        type: boolean
        default: true
      parallel_jobs:
        type: string
        default: 'auto'
      ccache:
        type: boolean
        default: false
      lto_mode:
        type: string
        default: 'none'
      tune_profile:
        type: string
        default: 'none'
      kernel_repo:
        type: string
        default: 'https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git'
      kernel_ref:
        type: string
        required: true
      release_tag:
        type: string
        default: ''

jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 架构变量
        id: arch
        run: |
          case "${{ inputs.arch }}" in
            x86_64|amd64)
              echo "karch=x86_64" >> "$GITHUB_OUTPUT"
              echo "deb_arch=amd64" >> "$GITHUB_OUTPUT"
              echo "rpm_arch=x86_64" >> "$GITHUB_OUTPUT"
              echo "arch_boot=arch/x86/boot/bzImage" >> "$GITHUB_OUTPUT"
              echo "arch_name=x86_64" >> "$GITHUB_OUTPUT"
              ;;
            arm64|aarch64)
              echo "karch=arm64" >> "$GITHUB_OUTPUT"
              echo "deb_arch=arm64" >> "$GITHUB_OUTPUT"
              echo "rpm_arch=aarch64" >> "$GITHUB_OUTPUT"
              echo "arch_boot=arch/arm64/boot/Image" >> "$GITHUB_OUTPUT"
              echo "arch_name=arm64" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "不支持的架构: ${{ inputs.arch }}" >&2
              exit 1
              ;;
          esac

      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libncurses-dev \
            bison flex libssl-dev libelf-dev libdw-dev elfutils bc dwarves zstd cpio \
            rsync kmod xz-utils dpkg-dev rpm git jq curl ccache \
            clang lld llvm

      - name: 克隆源码
        run: |
          set -euo pipefail
          REF="${{ inputs.kernel_ref }}"
          REPO="${{ inputs.kernel_repo }}"
          if ! git clone --depth 1 --branch "$REF" "$REPO" kernel-source; then
            rm -rf kernel-source
            git clone --branch "$REF" "$REPO" kernel-source
          fi

      - name: 应用配置
        id: config
        run: |
          set -euo pipefail
          CHOICE="${{ inputs.config_choice }}"
          CUSTOM="${{ inputs.config_custom }}"
          KARCH="${{ steps.arch.outputs.karch }}"
          OUT="/tmp/kernel.config"

          if [ -n "$CUSTOM" ]; then
            CHOICE="$CUSTOM"
          fi

          if echo "$CHOICE" | grep -qE '^https?://'; then
            curl -fSL "$CHOICE" -o "$OUT"
          elif echo "$CHOICE" | grep -qE '^make:'; then
            cd kernel-source && make ARCH="$KARCH" "${CHOICE#make:}" && cp .config "$OUT" && cd ..
          elif [ -f "$CHOICE" ]; then
            cp "$CHOICE" "$OUT"
          elif [ -f "configs/$CHOICE" ]; then
            cp "configs/$CHOICE" "$OUT"
          elif echo "$CHOICE" | grep -qE '^(default|allyesconfig|allmodconfig|allnoconfig|tinyconfig)$'; then
            cd kernel-source && make ARCH="$KARCH" "$CHOICE" && cp .config "$OUT" && cd ..
          else
            case "$CHOICE" in
              alma)     U='https://git.almalinux.org/rpms/kernel/-/raw/c9/f/kernel-x86_64-fedora.config' ;;
              alpine)   U='https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/linux-lts/config-lts.x86_64' ;;
              arch)     U='https://gitlab.archlinux.org/archlinux/packaging/packages/linux/-/raw/main/config' ;;
              centos)   U='https://gitlab.com/redhat/centos-stream/rpms/kernel/-/raw/c9s/f/kernel-x86_64-fedora.config' ;;
              debian)   U='https://salsa.debian.org/kernel-team/linux/-/raw/debian/latest/debian/config/config' ;;
              fedora)   U='https://src.fedoraproject.org/rpms/kernel/raw/rawhide/f/kernel-x86_64-fedora.config' ;;
              gentoo)   U='https://gitweb.gentoo.org/proj/gentoo-kernel.git/plain/default_config' ;;
              kali)     U='https://gitlab.com/kalilinux/packages/linux/-/raw/kali/master/debian/config/config' ;;
              manjaro)  U='https://gitlab.manjaro.org/packages/core/linux/-/raw/master/config' ;;
              nixos)    U='https://raw.githubusercontent.com/NixOS/nixpkgs/master/pkgs/os-specific/linux/kernel/common-config.nix' ;;
              opensuse) U='https://raw.githubusercontent.com/openSUSE/kernel-source/master/config/x86_64/default' ;;
              rhel)     U='https://gitlab.com/redhat/centos-stream/rpms/kernel/-/raw/c9s/f/kernel-x86_64-fedora.config' ;;
              rocky)    U='https://git.rockylinux.org/rocky/kernel/-/raw/r9/f/kernel-x86_64-fedora.config' ;;
              ubuntu)   U='https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/jammy/plain/debian.master/config/amd64/config.flavour.generic' ;;
              void)     U='https://raw.githubusercontent.com/void-linux/void-packages/master/srcpkgs/linux/files/x86_64-dotconfig' ;;
              *) echo "未知配置: $CHOICE" >&2; exit 1 ;;
            esac
            if [ "$KARCH" = "arm64" ]; then
              case "$CHOICE" in
                alma|centos|fedora|rhel|rocky) U='https://git.almalinux.org/rpms/kernel/-/raw/c9/f/kernel-aarch64-fedora.config' ;;
                alpine)   U='https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/linux-lts/config-lts.aarch64' ;;
                opensuse) U='https://raw.githubusercontent.com/openSUSE/kernel-source/master/config/arm64/default' ;;
                ubuntu)   U='https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/jammy/plain/debian.master/config/arm64/config.flavour.generic' ;;
                void)     U='https://raw.githubusercontent.com/void-linux/void-packages/master/srcpkgs/linux/files/aarch64-dotconfig' ;;
              esac
            fi
            curl -fSL "$U" -o "$OUT"
          fi

          cd kernel-source
          cp "$OUT" .config

          # 配置冲突处理（顺序即规则）：
          #   应用 .config → 应用调优预设 → 应用 LTO → make olddefconfig（唯一收敛点）
          # respect_config=true 时跳过 2、3 步，只补缺失的必选项，绝不改动用户既有选择
          if [ "${{ inputs.respect_config }}" != "true" ]; then
            sed -i '/^CONFIG_LD_ORPHAN_WARN_LEVEL=/d' .config
            echo 'CONFIG_LD_ORPHAN_WARN_LEVEL="warn"' >> .config
            make ARCH="$KARCH" olddefconfig </dev/null
          else
            grep -q '^CONFIG_LD_ORPHAN_WARN_LEVEL=' .config \
              || echo 'CONFIG_LD_ORPHAN_WARN_LEVEL="warn"' >> .config
            grep -q '^CONFIG_LOCALVERSION_AUTO=' .config \
              || echo 'CONFIG_LOCALVERSION_AUTO=y' >> .config
          fi

      - name: 调优预设
        if: ${{ inputs.respect_config != true }}
        run: |
          set -euo pipefail
          cd kernel-source
          KARCH="${{ steps.arch.outputs.karch }}"

          case "${{ inputs.tune_profile }}" in
            performance)
              for c in NO_HZ_FULL RCU_NOCBS PREEMPT_DYNAMIC CPU_FREQ_DEFAULT_GOV_PERFORMANCE; do
                sed -i "/^CONFIG_${c}=/d" .config; echo "CONFIG_${c}=y" >> .config
              done
              for c in MITIGATION_RETPOLINE MITIGATION_SPECTRE_BHI MITIGATION_IBPB_ENTRY \
                       MITIGATION_IBRS_ENTRY MITIGATION_L1TF MITIGATION_PTI; do
                sed -i "/^CONFIG_${c}=/d" .config; echo "# CONFIG_${c} is not set" >> .config
              done
              sed -i '/^CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND=/d' .config
              echo "# CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND is not set" >> .config
              ;;
            lowlatency)
              sed -i '/^CONFIG_PREEMPT_VOLUNTARY=/d' .config
              sed -i '/^CONFIG_PREEMPT_NONE=/d' .config
              echo "CONFIG_PREEMPT=y" >> .config
              sed -i '/^CONFIG_HZ_250=/d' .config
              sed -i '/^CONFIG_HZ_300=/d' .config
              sed -i '/^CONFIG_HZ_100=/d' .config
              echo "CONFIG_HZ_1000=y" >> .config
              sed -i '/^CONFIG_RCU_BOOST=/d' .config
              echo "CONFIG_RCU_BOOST=y" >> .config
              ;;
            minimal)
              sed -i '/^CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=/d' .config
              echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> .config
              for c in MODULE_SIG MODULE_SIG_ALL MODULE_SIG_FORCE; do
                sed -i "/^CONFIG_${c}=/d" .config; echo "# CONFIG_${c} is not set" >> .config
              done
              ;;
            debugoff)
              for c in KASAN KMSAN KCSAN KFENCE KMEMLEAK DEBUG_INFO DWARF_TOOLCHAIN_DEFAULT \
                       FTRACE FUNCTION_TRACER FUNCTION_GRAPH_TRACER STACK_TRACER \
                       KPROBES UPROBES TRACEPOINTS DEBUG_FS SLUB_DEBUG \
                       DEBUG_PAGEALLOC DEBUG_KMEMLEAK DEBUG_STACK_USAGE \
                       SCHEDSTATS LATENCYTOP LOCK_STAT; do
                sed -i "/^CONFIG_${c}=/d" .config; echo "# CONFIG_${c} is not set" >> .config
              done
              ;;
            default)
              for c in DEBUG_BUGVERBOSE DEBUG_LIST DEBUG_SG DEBUG_NOTIFIERS DEBUG_CREDENTIALS \
                       RCU_TRACE SCHED_DEBUG PRINTK_TIME DYNAMIC_DEBUG DEBUG_ATOMIC_SLEEP \
                       DEBUG_PREEMPT DEBUG_SPINLOCK DEBUG_MUTEXES DEBUG_RT_MUTEXES \
                       DEBUG_WW_MUTEX_SLOWPATH DEBUG_LOCK_ALLOC DEBUG_LOCKDEP \
                       DEBUG_KOBJECT DEBUG_KOBJECT_RELEASE; do
                sed -i "/^CONFIG_${c}=/d" .config; echo "# CONFIG_${c} is not set" >> .config
              done
              ;;
            none)
              ;;
          esac

      - name: 应用 LTO
        if: ${{ inputs.respect_config != true }}
        run: |
          set -euo pipefail
          cd kernel-source
          case "${{ inputs.lto_mode }}" in
            full)
              sed -i '/^CONFIG_LTO=/d' .config;                 echo "CONFIG_LTO=y" >> .config
              sed -i '/^CONFIG_LTO_CLANG_FULL=/d' .config;      echo "CONFIG_LTO_CLANG_FULL=y" >> .config
              sed -i '/^CONFIG_LTO_CLANG_THIN=/d' .config;      echo "# CONFIG_LTO_CLANG_THIN is not set" >> .config
              sed -i '/^CONFIG_LTO_NONE=/d' .config;            echo "# CONFIG_LTO_NONE is not set" >> .config
              ;;
            thin)
              sed -i '/^CONFIG_LTO=/d' .config;                 echo "CONFIG_LTO=y" >> .config
              sed -i '/^CONFIG_LTO_CLANG_THIN=/d' .config;      echo "CONFIG_LTO_CLANG_THIN=y" >> .config
              sed -i '/^CONFIG_LTO_CLANG_FULL=/d' .config;      echo "# CONFIG_LTO_CLANG_FULL is not set" >> .config
              sed -i '/^CONFIG_LTO_NONE=/d' .config;            echo "# CONFIG_LTO_NONE is not set" >> .config
              ;;
            *)
              sed -i '/^CONFIG_LTO=/d' .config
              sed -i '/^CONFIG_LTO_CLANG_FULL=/d' .config
              sed -i '/^CONFIG_LTO_CLANG_THIN=/d' .config
              echo "CONFIG_LTO_NONE=y" >> .config
              ;;
          esac

      - name: 收敛配置
        if: ${{ inputs.respect_config != true }}
        run: |
          set -euo pipefail
          cd kernel-source
          make ARCH="${{ steps.arch.outputs.karch }}" olddefconfig </dev/null

      - name: 编译
        id: compile
        run: |
          set -euo pipefail
          cd kernel-source
          KARCH="${{ steps.arch.outputs.karch }}"

          JOBS="${{ inputs.parallel_jobs }}"
          if [ "$JOBS" = "auto" ]; then JOBS=$(nproc); fi
          MAKE_ARGS="ARCH=$KARCH -j$JOBS"

          if [ "${{ inputs.ccache }}" = "true" ]; then
            export PATH="/usr/lib/ccache:$PATH"
            export CC="ccache gcc"
            export HOSTCC="ccache gcc"
          fi
          if [ "${{ inputs.lto_mode }}" != "none" ]; then
            MAKE_ARGS="$MAKE_ARGS LLVM=1"
          fi

          make $MAKE_ARGS

          KVER="$(make ARCH="$KARCH" -s kernelrelease)"
          echo "KVER=$KVER" >> "$GITHUB_OUTPUT"
          echo "内核版本: $KVER"

      - name: 暂存产物
        id: stage
        run: |
          set -euo pipefail
          cd kernel-source
          KARCH="${{ steps.arch.outputs.karch }}"
          KVER="${{ steps.compile.outputs.KVER }}"
          KIMAGE="${{ steps.arch.outputs.arch_boot }}"

          STAGE_DIR="$(mktemp -d)"
          echo "STAGE=$STAGE_DIR" >> "$GITHUB_OUTPUT"

          mkdir -p "$STAGE_DIR/boot"
          cp "$KIMAGE" "$STAGE_DIR/boot/vmlinuz-${KVER}"
          cp System.map "$STAGE_DIR/boot/System.map-${KVER}"
          cp .config "$STAGE_DIR/boot/config-${KVER}"

          if [ "${{ inputs.strip_modules }}" = "true" ]; then
            make ARCH="$KARCH" modules_install INSTALL_MOD_PATH="$STAGE_DIR" INSTALL_MOD_STRIP=1
          else
            make ARCH="$KARCH" modules_install INSTALL_MOD_PATH="$STAGE_DIR"
          fi
          rm -f "$STAGE_DIR/lib/modules/${KVER}/build" "$STAGE_DIR/lib/modules/${KVER}/source"

      - name: 准备 headers
        id: headers
        if: ${{ inputs.include_headers == 'true' }}
        run: |
          set -euo pipefail
          cd kernel-source
          KARCH="${{ steps.arch.outputs.karch }}"
          KVER="${{ steps.compile.outputs.KVER }}"

          HDR_STAGE_DIR="$(mktemp -d)"
          echo "HDR_STAGE=$HDR_STAGE_DIR" >> "$GITHUB_OUTPUT"

          HDR_DIR="$HDR_STAGE_DIR/usr/src/linux-headers-${KVER}"
          mkdir -p "$HDR_DIR"

          if [ "${{ inputs.headers_full_tree }}" = "true" ]; then
            cp -a include scripts arch "$HDR_DIR/"
          else
            cp -a include "$HDR_DIR/"
            mkdir -p "$HDR_DIR/scripts"
            for d in basic mod package recordmk kernel; do
              if [ -d "scripts/$d" ]; then cp -a "scripts/$d" "$HDR_DIR/scripts/"; fi
            done
            mkdir -p "$HDR_DIR/arch"
            cp -a "arch/$KARCH" "$HDR_DIR/arch/"
          fi
          for f in Makefile .config Module.symvers Kbuild; do
            [ -f "$f" ] && cp "$f" "$HDR_DIR/"
          done

      # ============ 以下四个打包 step：产物严格按 arch 分目录，绝不混装 ============

      - name: 打包 deb
        if: ${{ contains(fromJSON(inputs.formats), 'deb') }}
        run: |
          set -euo pipefail
          DEB_ARCH="${{ steps.arch.outputs.deb_arch }}"
          ARCH_NAME="${{ steps.arch.outputs.arch_name }}"
          STAGE="${{ steps.stage.outputs.STAGE }}"
          KVER="${{ steps.compile.outputs.KVER }}"
          OUT="dist/${ARCH_NAME}/deb"
          mkdir -p "$OUT"

          IMG_DIR="$(mktemp -d)/linux-image-${KVER}"
          mkdir -p "$IMG_DIR/DEBIAN" "$IMG_DIR/boot" "$IMG_DIR/lib/modules"
          cp "$STAGE/boot/vmlinuz-${KVER}" "$IMG_DIR/boot/vmlinuz-${KVER}" 2>/dev/null \
            || cp "$STAGE/boot/"vmlinuz* "$IMG_DIR/boot/vmlinuz-${KVER}"
          cp "$STAGE/boot/System.map-${KVER}" "$IMG_DIR/boot/"
          cp "$STAGE/boot/config-${KVER}" "$IMG_DIR/boot/"
          cp -a "$STAGE/lib/modules/${KVER}" "$IMG_DIR/lib/modules/"

          printf '%s\n' \
            "Package: linux-image-${KVER}" \
            "Version: 1" \
            "Architecture: ${DEB_ARCH}" \
            "Maintainer: CI" \
            "Description: Linux kernel ${KVER}" \
            > "$IMG_DIR/DEBIAN/control"

          printf '%s\n' '#!/bin/sh' "depmod ${KVER} || true" > "$IMG_DIR/DEBIAN/postinst"
          chmod 755 "$IMG_DIR/DEBIAN/postinst"

          dpkg-deb --root-owner-group --build "$IMG_DIR" "${OUT}/linux-image-${KVER}_${DEB_ARCH}.deb"

          if [ "${{ inputs.include_headers }}" = "true" ]; then
            HDR_STAGE="${{ steps.headers.outputs.HDR_STAGE }}"
            HDR_DIR="$(mktemp -d)/linux-headers-${KVER}"
            mkdir -p "$HDR_DIR/DEBIAN" "$HDR_DIR/usr/src/linux-headers-${KVER}"
            cp -a "$HDR_STAGE/usr/src/linux-headers-${KVER}/." "$HDR_DIR/usr/src/linux-headers-${KVER}/"
            printf '%s\n' \
              "Package: linux-headers-${KVER}" \
              "Version: 1" \
              "Architecture: ${DEB_ARCH}" \
              "Maintainer: CI" \
              "Description: Headers for ${KVER}" \
              > "$HDR_DIR/DEBIAN/control"
            dpkg-deb --root-owner-group --build "$HDR_DIR" "${OUT}/linux-headers-${KVER}_${DEB_ARCH}.deb"
          fi

      - name: 打包 rpm
        if: ${{ contains(fromJSON(inputs.formats), 'rpm') }}
        run: |
          set -euo pipefail
          RPM_ARCH="${{ steps.arch.outputs.rpm_arch }}"
          ARCH_NAME="${{ steps.arch.outputs.arch_name }}"
          STAGE="${{ steps.stage.outputs.STAGE }}"
          KVER="${{ steps.compile.outputs.KVER }}"
          OUT="dist/${ARCH_NAME}/rpm"
          mkdir -p "$OUT"

          RPM_VER="$(echo "$KVER" | rev | cut -d'-' -f2- | rev)"
          RPM_REL="$(echo "$KVER" | rev | cut -d'-' -f1 | rev)_1"
          [ -z "$RPM_VER" ] && RPM_VER="$KVER"
          [ -z "$RPM_REL" ] && RPM_REL="1"

          TOP="$(mktemp -d)"
          mkdir -p "$TOP"/{BUILD,RPMS,SOURCES,SPECS,BUILDROOT}

          SPEC="$TOP/SPECS/kernel-image.spec"
          printf '%s\n' \
            '%global debug_package %{nil}' \
            '%global __strip /bin/true' \
            '%global __find_provides %{nil}' \
            '%global __find_requires %{nil}' \
            '%define _unpackaged_files_terminate_build 0' \
            "Name: kernel-image-${KVER}" \
            "Version: ${RPM_VER}" \
            "Release: ${RPM_REL}" \
            "Summary: Linux kernel ${KVER}" \
            "License: GPL-2.0-only" \
            "AutoReqProv: no" \
            "BuildArch: ${RPM_ARCH}" \
            '' \
            '%description' \
            'Kernel image and modules' \
            '' \
            '%install' \
            'rm -rf %{buildroot}' \
            'mkdir -p %{buildroot}/boot %{buildroot}/lib/modules' \
            "cp ${STAGE}/boot/vmlinuz-${KVER} %{buildroot}/boot/ 2>/dev/null || :" \
            "cp ${STAGE}/boot/System.map-${KVER} %{buildroot}/boot/ 2>/dev/null || :" \
            "cp ${STAGE}/boot/config-${KVER} %{buildroot}/boot/ 2>/dev/null || :" \
            "cp -a ${STAGE}/lib/modules/${KVER} %{buildroot}/lib/modules/ 2>/dev/null || :" \
            '' \
            '%files' \
            "/boot/vmlinuz-${KVER}" \
            "/boot/System.map-${KVER}" \
            "/boot/config-${KVER}" \
            "/lib/modules/${KVER}" \
            > "$SPEC"
          rpmbuild --define "_topdir $TOP" -bb "$SPEC"

          if [ "${{ inputs.include_headers }}" = "true" ]; then
            HDR_STAGE="${{ steps.headers.outputs.HDR_STAGE }}"
            SPEC2="$TOP/SPECS/kernel-headers.spec"
            printf '%s\n' \
              '%global debug_package %{nil}' \
              '%global __strip /bin/true' \
              '%global __find_provides %{nil}' \
              '%global __find_requires %{nil}' \
              '%define _unpackaged_files_terminate_build 0' \
              "Name: kernel-headers-${KVER}" \
              "Version: ${RPM_VER}" \
              "Release: ${RPM_REL}" \
              "Summary: Headers for ${KVER}" \
              "License: GPL-2.0-only" \
              "AutoReqProv: no" \
              "BuildArch: ${RPM_ARCH}" \
              '' \
              '%install' \
              'rm -rf %{buildroot}' \
              'mkdir -p %{buildroot}/usr/src/linux-headers-'${KVER} \
              "cp -a ${HDR_STAGE}/usr/src/linux-headers-${KVER}/. %{buildroot}/usr/src/linux-headers-${KVER}/" \
              '' \
              '%files' \
              "/usr/src/linux-headers-${KVER}" \
              > "$SPEC2"
            rpmbuild --define "_topdir $TOP" -bb "$SPEC2"
          fi

          find "$TOP/RPMS" -name '*.rpm' -exec cp {} "$OUT"/ \;

      - name: 打包 tar.xz
        if: ${{ contains(fromJSON(inputs.formats), 'tarxz') }}
        run: |
          set -euo pipefail
          ARCH_NAME="${{ steps.arch.outputs.arch_name }}"
          STAGE="${{ steps.stage.outputs.STAGE }}"
          KVER="${{ steps.compile.outputs.KVER }}"
          OUT="dist/${ARCH_NAME}/tarxz"
          mkdir -p "$OUT"

          PKG="$(mktemp -d)/linux-${KVER}-${ARCH_NAME}"
          mkdir -p "$PKG/boot" "$PKG/lib/modules"
          cp "$STAGE/boot/vmlinuz-${KVER}" "$PKG/boot/vmlinuz-${KVER}" 2>/dev/null \
            || cp "$STAGE/boot/"vmlinuz* "$PKG/boot/vmlinuz-${KVER}"
          cp "$STAGE/boot/System.map-${KVER}" "$PKG/boot/"
          cp "$STAGE/boot/config-${KVER}" "$PKG/boot/"
          cp -a "$STAGE/lib/modules/${KVER}" "$PKG/lib/modules/"

          if [ "${{ inputs.include_headers }}" = "true" ] && [ "${{ inputs.tarxz_include_headers }}" = "true" ]; then
            HDR_STAGE="${{ steps.headers.outputs.HDR_STAGE }}"
            mkdir -p "$PKG/usr/src"
            cp -a "$HDR_STAGE/usr/src/linux-headers-${KVER}" "$PKG/usr/src/"
          fi

          INST="$PKG/install-${KVER}.sh"
          printf '%s\n' \
            '#!/bin/sh' \
            'set -e' \
            '[ "$(id -u)" = "0" ] || { echo "请 root 运行" >&2; exit 1; }' \
            'mkdir -p /boot' \
            "cp -a \"$PKG/boot/\"* /boot/ 2>/dev/null || true" \
            "cp -a \"$PKG/lib/modules/${KVER}\" /lib/modules/ 2>/dev/null || true" \
            "if [ -d \"$PKG/usr/src/linux-headers-${KVER}\" ]; then cp -a \"$PKG/usr/src/linux-headers-${KVER}\" /usr/src/; fi" \
            "depmod ${KVER} 2>/dev/null || true" \
            'echo "完成"' \
            > "$INST"
          chmod 755 "$INST"

          cd "$(dirname "$PKG")" \
            && tar --owner=0 --group=0 --numeric-owner -cJf "$OLDPWD/${OUT}/linux-${KVER}-${ARCH_NAME}.tar.xz" "$(basename "$PKG")"

      - name: 打包 pkg.tar.zst
        if: ${{ contains(fromJSON(inputs.formats), 'pkg') }}
        run: |
          set -euo pipefail
          ARCH_NAME="${{ steps.arch.outputs.arch_name }}"
          STAGE="${{ steps.stage.outputs.STAGE }}"
          KVER="${{ steps.compile.outputs.KVER }}"
          OUT="dist/${ARCH_NAME}/pkg"
          mkdir -p "$OUT"

          ROOT="$(mktemp -d)"
          mkdir -p "$ROOT/boot" "$ROOT/lib/modules"
          cp "$STAGE/boot/vmlinuz-${KVER}" "$ROOT/boot/vmlinuz-${KVER}" 2>/dev/null \
            || cp "$STAGE/boot/"vmlinuz* "$ROOT/boot/vmlinuz-${KVER}"
          cp "$STAGE/boot/System.map-${KVER}" "$ROOT/boot/"
          cp "$STAGE/boot/config-${KVER}" "$ROOT/boot/"
          cp -a "$STAGE/lib/modules/${KVER}" "$ROOT/lib/modules/"

          printf '%s\n' \
            "pkgname = linux-image-${KVER}" \
            "pkgver = ${KVER}-1" \
            "arch = ${ARCH_NAME}" \
            "license = GPL-2.0-only" \
            > "$ROOT/.PKGINFO"

          cd "$ROOT" \
            && tar --owner=0 --group=0 --numeric-owner -cf - . \
              | zstd -T0 -19 --force -o "$OLDPWD/${OUT}/linux-image-${KVER}-${ARCH_NAME}.pkg.tar.zst"

          if [ "${{ inputs.include_headers }}" = "true" ]; then
            HDR_STAGE="${{ steps.headers.outputs.HDR_STAGE }}"
            HROOT="$(mktemp -d)"
            mkdir -p "$HROOT/usr/src/linux-headers-${KVER}"
            cp -a "$HDR_STAGE/usr/src/linux-headers-${KVER}/." "$HROOT/usr/src/linux-headers-${KVER}/"
            printf '%s\n' \
              "pkgname = linux-headers-${KVER}" \
              "pkgver = ${KVER}-1" \
              "arch = ${ARCH_NAME}" \
              "license = GPL-2.0-only" \
              > "$HROOT/.PKGINFO"
            cd "$HROOT" \
              && tar --owner=0 --group=0 --numeric-owner -cf - . \
                | zstd -T0 -19 --force -o "$OLDPWD/${OUT}/linux-headers-${KVER}-${ARCH_NAME}.pkg.tar.zst"
          fi

      - name: 上传产物
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          # 每个 arch 一个独立 artifact，下载时无需拉取另一个架构的产物
          name: kernel-${{ steps.arch.outputs.arch_name }}
          path: dist/${{ steps.arch.outputs.arch_name }}/**/*
          if-no-files-found: warn
          retention-days: 7

      - name: 产物大小
        if: ${{ always() && !cancelled() }}
        run: find dist -type f -printf '%s\t%p\n' 2>/dev/null | sort -n | tail -20 || true
