name: Build Kernel Core

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      arch:
        type: string
        required: true
      deb_arch:
        type: string
        required: true
      rpm_arch:
        type: string
        required: true
      arch_boot:
        type: string
        required: true
      formats:
        type: string
        required: true
      config_choice:
        type: string
        default: 'default'
      config_custom:
        type: string
        default: ''
      respect_config:
        type: boolean
        default: true
      include_headers:
        type: boolean
        default: true
      headers_full_tree:
        type: boolean
        default: true
      strip_modules:
        type: boolean
        default: false
      tarxz_include_headers:
        type: boolean
        default: true
      parallel_jobs:
        type: string
        default: 'auto'
      ccache:
        type: boolean
        default: false
      lto_mode:
        type: string
        default: 'none'
      tune_profile:
        type: string
        default: 'none'
      kernel_repo:
        type: string
        default: 'https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git'
      kernel_ref:
        type: string
        required: true
      release_tag:
        type: string
        default: ''

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 设置架构变量
        id: arch
        run: |
          set -euo pipefail
          echo "arch_name=${{ inputs.arch }}" >> "$GITHUB_OUTPUT"
          echo "karch=${{ inputs.arch }}" >> "$GITHUB_OUTPUT"
          echo "deb_arch=${{ inputs.deb_arch }}" >> "$GITHUB_OUTPUT"
          echo "rpm_arch=${{ inputs.rpm_arch }}" >> "$GITHUB_OUTPUT"
          echo "arch_boot=${{ inputs.arch_boot }}" >> "$GITHUB_OUTPUT"

      - name: 清理磁盘空间
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: 安装构建依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex \
            libssl-dev libelf-dev libdw-dev elfutils bc dwarves zstd cpio \
            rsync kmod xz-utils dpkg-dev rpm git jq curl ccache \
            clang lld llvm

      - name: 克隆内核源码
        id: clone
        run: |
          set -euo pipefail
          REF="${{ inputs.kernel_ref }}"
          REPO="${{ inputs.kernel_repo }}"
          if ! git clone --depth 1 --branch "$REF" "$REPO" kernel-source; then
            rm -rf kernel-source
            git clone --branch "$REF" "$REPO" kernel-source
          fi
          echo "src=$(pwd)/kernel-source" >> "$GITHUB_OUTPUT"

      - name: 解析并应用配置
        id: config
        run: |
          set -euo pipefail
          CHOICE="${{ inputs.config_choice }}"
          CUSTOM="${{ inputs.config_custom }}"
          KARCH="${{ inputs.arch }}"
          CONFIG_OUT="/tmp/kernel.config"

          if [ -n "$CUSTOM" ]; then
            CHOICE="$CUSTOM"
          fi

          if echo "$CHOICE" | grep -qE '^https?://'; then
            curl -fSL "$CHOICE" -o "$CONFIG_OUT"
          elif echo "$CHOICE" | grep -qE '^make:'; then
            TARGET="${CHOICE#make:}"
            cd kernel-source
            make ARCH="$KARCH" "$TARGET"
            cp .config "$CONFIG_OUT"
            cd ..
          elif [ -f "$CHOICE" ]; then
            cp "$CHOICE" "$CONFIG_OUT"
          elif [ -f "configs/$CHOICE" ]; then
            cp "configs/$CHOICE" "$CONFIG_OUT"
          elif echo "$CHOICE" | grep -qE '^(default|allyesconfig|allmodconfig|allnoconfig|tinyconfig)$'; then
            cd kernel-source
            make ARCH="$KARCH" "$CHOICE"
            cp .config "$CONFIG_OUT"
            cd ..
          else
            case "$CHOICE" in
              alma)     URL='https://git.almalinux.org/rpms/kernel/-/raw/c9/f/kernel-x86_64-fedora.config' ;;
              alpine)   URL='https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/linux-lts/config-lts.x86_64' ;;
              arch)     URL='https://gitlab.archlinux.org/archlinux/packaging/packages/linux/-/raw/main/config' ;;
              centos)   URL='https://gitlab.com/redhat/centos-stream/rpms/kernel/-/raw/c9s/f/kernel-x86_64-fedora.config' ;;
              debian)   URL='https://salsa.debian.org/kernel-team/linux/-/raw/debian/latest/debian/config/config' ;;
              fedora)   URL='https://src.fedoraproject.org/rpms/kernel/raw/rawhide/f/kernel-x86_64-fedora.config' ;;
              gentoo)   URL='https://gitweb.gentoo.org/proj/gentoo-kernel.git/plain/default_config' ;;
              kali)     URL='https://gitlab.com/kalilinux/packages/linux/-/raw/kali/master/debian/config/config' ;;
              manjaro)  URL='https://gitlab.manjaro.org/packages/core/linux/-/raw/master/config' ;;
              nixos)    URL='https://raw.githubusercontent.com/NixOS/nixpkgs/master/pkgs/os-specific/linux/kernel/common-config.nix' ;;
              opensuse) URL='https://raw.githubusercontent.com/openSUSE/kernel-source/master/config/x86_64/default' ;;
              rhel)     URL='https://gitlab.com/redhat/centos-stream/rpms/kernel/-/raw/c9s/f/kernel-x86_64-fedora.config' ;;
              rocky)    URL='https://git.rockylinux.org/rocky/kernel/-/raw/r9/f/kernel-x86_64-fedora.config' ;;
              ubuntu)   URL='https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/jammy/plain/debian.master/config/amd64/config.flavour.generic' ;;
              void)     URL='https://raw.githubusercontent.com/void-linux/void-packages/master/srcpkgs/linux/files/x86_64-dotconfig' ;;
              *) echo "未知配置: $CHOICE" >&2; exit 1 ;;
            esac
            if [ "$KARCH" = "arm64" ]; then
              case "$CHOICE" in
                alma|centos|fedora|rhel|rocky)
                  URL='https://git.almalinux.org/rpms/kernel/-/raw/c9/f/kernel-aarch64-fedora.config' ;;
                alpine)
                  URL='https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/linux-lts/config-lts.aarch64' ;;
                opensuse)
                  URL='https://raw.githubusercontent.com/openSUSE/kernel-source/master/config/arm64/default' ;;
                ubuntu)
                  URL='https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/jammy/plain/debian.master/config/arm64/config.flavour.generic' ;;
                void)
                  URL='https://raw.githubusercontent.com/void-linux/void-packages/master/srcpkgs/linux/files/aarch64-dotconfig' ;;
              esac
            fi
            curl -fSL "$URL" -o "$CONFIG_OUT"
          fi

          cd kernel-source
          cp "$CONFIG_OUT" .config

          if [ "${{ inputs.respect_config }}" != "true" ]; then
            sed -i '/^CONFIG_LD_ORPHAN_WARN_LEVEL=/d' .config
            printf '%s\n' 'CONFIG_LD_ORPHAN_WARN_LEVEL="warn"' >> .config
            make ARCH="$KARCH" olddefconfig </dev/null
          else
            grep -q '^CONFIG_LD_ORPHAN_WARN_LEVEL=' .config || printf '%s\n' 'CONFIG_LD_ORPHAN_WARN_LEVEL="warn"' >> .config
            grep -q '^CONFIG_LOCALVERSION_AUTO=' .config || printf '%s\n' 'CONFIG_LOCALVERSION_AUTO=y' >> .config
          fi

      - name: 应用调优预设
        if: ${{ inputs.respect_config != true }}
        run: |
          set -euo pipefail
          cd kernel-source

          case "${{ inputs.tune_profile }}" in
            performance)
              for c in NO_HZ_FULL RCU_NOCBS PREEMPT_DYNAMIC CPU_FREQ_DEFAULT_GOV_PERFORMANCE; do
                sed -i "/^CONFIG_${c}=/d" .config
                printf '%s\n' "CONFIG_${c}=y" >> .config
              done
              for c in MITIGATION_RETPOLINE MITIGATION_SPECTRE_BHI MITIGATION_IBPB_ENTRY MITIGATION_IBRS_ENTRY MITIGATION_L1TF MITIGATION_PTI; do
                sed -i "/^CONFIG_${c}=/d" .config
                printf '%s\n' "# CONFIG_${c} is not set" >> .config
              done
              sed -i '/^CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND=/d' .config
              printf '%s\n' "# CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND is not set" >> .config
              ;;
            lowlatency)
              sed -i '/^CONFIG_PREEMPT_VOLUNTARY=/d' .config
              sed -i '/^CONFIG_PREEMPT_NONE=/d' .config
              printf '%s\n' "CONFIG_PREEMPT=y" >> .config
              sed -i '/^CONFIG_HZ_250=/d' .config
              sed -i '/^CONFIG_HZ_300=/d' .config
              sed -i '/^CONFIG_HZ_100=/d' .config
              printf '%s\n' "CONFIG_HZ_1000=y" >> .config
              sed -i '/^CONFIG_RCU_BOOST=/d' .config
              printf '%s\n' "CONFIG_RCU_BOOST=y" >> .config
              ;;
            minimal)
              sed -i '/^CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=/d' .config
              printf '%s\n' "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> .config
              for c in MODULE_SIG MODULE_SIG_ALL MODULE_SIG_FORCE; do
                sed -i "/^CONFIG_${c}=/d" .config
                printf '%s\n' "# CONFIG_${c} is not set" >> .config
              done
              ;;
            debugoff)
              for c in KASAN KMSAN KCSAN KFENCE KMEMLEAK DEBUG_INFO DWARF_TOOLCHAIN_DEFAULT FTRACE FUNCTION_TRACER FUNCTION_GRAPH_TRACER STACK_TRACER KPROBES UPROBES TRACEPOINTS DEBUG_FS SLUB_DEBUG DEBUG_PAGEALLOC DEBUG_KMEMLEAK DEBUG_STACK_USAGE SCHEDSTATS LATENCYTOP LOCK_STAT; do
                sed -i "/^CONFIG_${c}=/d" .config
                printf '%s\n' "# CONFIG_${c} is not set" >> .config
              done
              ;;
            default)
              for c in DEBUG_BUGVERBOSE DEBUG_LIST DEBUG_SG DEBUG_NOTIFIERS DEBUG_CREDENTIALS RCU_TRACE SCHED_DEBUG PRINTK_TIME DYNAMIC_DEBUG DEBUG_ATOMIC_SLEEP DEBUG_PREEMPT DEBUG_SPINLOCK DEBUG_MUTEXES DEBUG_RT_MUTEXES DEBUG_WW_MUTEX_SLOWPATH DEBUG_LOCK_ALLOC DEBUG_LOCKDEP DEBUG_KOBJECT DEBUG_KOBJECT_RELEASE; do
                sed -i "/^CONFIG_${c}=/d" .config
                printf '%s\n' "# CONFIG_${c} is not set" >> .config
              done
              ;;
            none)
              ;;
          esac

      - name: 应用 LTO
        if: ${{ inputs.respect_config != true }}
        run: |
          set -euo pipefail
          cd kernel-source
          LTO="${{ inputs.lto_mode }}"
          if [ "$LTO" = "none" ]; then
            sed -i '/^CONFIG_LTO=/d' .config
            sed -i '/^CONFIG_LTO_CLANG_FULL=/d' .config
            sed -i '/^CONFIG_LTO_CLANG_THIN=/d' .config
            printf '%s\n' "CONFIG_LTO_NONE=y" >> .config
          else
            sed -i '/^CONFIG_LTO=/d' .config
            printf '%s\n' "CONFIG_LTO=y" >> .config
            sed -i '/^CONFIG_LTO_NONE=/d' .config
            printf '%s\n' "# CONFIG_LTO_NONE is not set" >> .config
            if [ "$LTO" = "full" ]; then
              sed -i '/^CONFIG_LTO_CLANG_FULL=/d' .config
              printf '%s\n' "CONFIG_LTO_CLANG_FULL=y" >> .config
              sed -i '/^CONFIG_LTO_CLANG_THIN=/d' .config
              printf '%s\n' "# CONFIG_LTO_CLANG_THIN is not set" >> .config
            else
              sed -i '/^CONFIG_LTO_CLANG_THIN=/d' .config
              printf '%s\n' "CONFIG_LTO_CLANG_THIN=y" >> .config
              sed -i '/^CONFIG_LTO_CLANG_FULL=/d' .config
              printf '%s\n' "# CONFIG_LTO_CLANG_FULL is not set" >> .config
            fi
          fi

      - name: 收敛配置
        if: ${{ inputs.respect_config != true }}
        run: |
          set -euo pipefail
          cd kernel-source
          make ARCH="${{ inputs.arch }}" olddefconfig </dev/null

      - name: 编译内核
        id: compile
        run: |
          set -euo pipefail
          cd kernel-source
          KARCH="${{ inputs.arch }}"

          JOBS="${{ inputs.parallel_jobs }}"
          if [ "$JOBS" = "auto" ]; then
            JOBS="$(nproc)"
          fi

          MAKE_ARGS="ARCH=$KARCH -j$JOBS"

          if [ "${{ inputs.ccache }}" = "true" ]; then
            export PATH="/usr/lib/ccache:$PATH"
            export CC="ccache gcc"
            export HOSTCC="ccache gcc"
          fi

          if [ "${{ inputs.lto_mode }}" != "none" ]; then
            MAKE_ARGS="$MAKE_ARGS LLVM=1"
          fi

          make $MAKE_ARGS

          KVER="$(make ARCH="$KARCH" -s kernelrelease)"
          echo "KVER=$KVER" >> "$GITHUB_OUTPUT"
          echo "内核版本: $KVER"

      - name: 暂存内核产物
        id: stage
        run: |
          set -euo pipefail
          cd kernel-source
          KARCH="${{ inputs.arch }}"
          KVER="${{ steps.compile.outputs.KVER }}"
          KIMAGE="${{ inputs.arch_boot }}"

          STAGE_DIR="$(mktemp -d)"
          echo "STAGE=$STAGE_DIR" >> "$GITHUB_OUTPUT"

          mkdir -p "$STAGE_DIR/boot"
          cp "$KIMAGE" "$STAGE_DIR/boot/vmlinuz-${KVER}"
          cp System.map "$STAGE_DIR/boot/System.map-${KVER}"
          cp .config "$STAGE_DIR/boot/config-${KVER}"

          if [ "${{ inputs.strip_modules }}" = "true" ]; then
            make ARCH="$KARCH" modules_install INSTALL_MOD_PATH="$STAGE_DIR" INSTALL_MOD_STRIP=1
          else
            make ARCH="$KARCH" modules_install INSTALL_MOD_PATH="$STAGE_DIR"
          fi
          rm -f "$STAGE_DIR/lib/modules/${KVER}/build" "$STAGE_DIR/lib/modules/${KVER}/source"

      - name: 暂存 headers
        id: headers
        if: ${{ inputs.include_headers == 'true' }}
        run: |
          set -euo pipefail
          cd kernel-source
          KARCH="${{ inputs.arch }}"
          KVER="${{ steps.compile.outputs.KVER }}"

          HDR_STAGE_DIR="$(mktemp -d)"
          echo "HDR=$HDR_STAGE_DIR" >> "$GITHUB_OUTPUT"

          HDR_DIR="$HDR_STAGE_DIR/usr/src/linux-headers-${KVER}"
          mkdir -p "$HDR_DIR"

          if [ "${{ inputs.headers_full_tree }}" = "true" ]; then
            cp -a include "$HDR_DIR/"
            cp -a scripts "$HDR_DIR/"
            cp -a arch "$HDR_DIR/"
          else
            cp -a include "$HDR_DIR/"
            mkdir -p "$HDR_DIR/scripts"
            for d in basic mod package recordmk kernel; do
              if [ -d "scripts/$d" ]; then
                cp -a "scripts/$d" "$HDR_DIR/scripts/"
              fi
            done
            mkdir -p "$HDR_DIR/arch"
            cp -a "arch/$KARCH" "$HDR_DIR/arch/"
          fi

          cp Makefile .config Module.symvers Kbuild "$HDR_DIR/" 2>/dev/null || true

      - name: 打包 deb
        if: ${{ contains(fromJSON(inputs.formats), 'deb') }}
        run: |
          set -euo pipefail
          DEB_ARCH="${{ inputs.deb_arch }}"
          STAGE="${{ steps.stage.outputs.STAGE }}"
          KVER="${{ steps.compile.outputs.KVER }}"
          OUT="dist/${{ inputs.arch }}/deb"
          mkdir -p "$OUT"

          IMG_DIR="$(mktemp -d)/linux-image-${KVER}"
          mkdir -p "$IMG_DIR/DEBIAN" "$IMG_DIR/boot" "$IMG_DIR/lib/modules"
          cp "$STAGE/boot/vmlinuz-${KVER}" "$IMG_DIR/boot/vmlinuz-${KVER}" 2>/dev/null || cp "$STAGE/boot/"vmlinuz* "$IMG_DIR/boot/vmlinuz-${KVER}"
          cp "$STAGE/boot/System.map-${KVER}" "$IMG_DIR/boot/"
          cp "$STAGE/boot/config-${KVER}" "$IMG_DIR/boot/"
          cp -a "$STAGE/lib/modules/${KVER}" "$IMG_DIR/lib/modules/"

          printf '%s\n' \
            "Package: linux-image-${KVER}" \
            "Version: 1" \
            "Architecture: ${DEB_ARCH}" \
            "Maintainer: CI" \
            "Description: Linux kernel ${KVER}" \
            > "$IMG_DIR/DEBIAN/control"

          printf '%s\n' '#!/bin/sh' "depmod ${KVER} || true" > "$IMG_DIR/DEBIAN/postinst"
          chmod 755 "$IMG_DIR/DEBIAN/postinst"

          dpkg-deb --root-owner-group --build "$IMG_DIR" "$OUT/linux-image-${KVER}_${DEB_ARCH}.deb"

          if [ "${{ inputs.include_headers }}" = "true" ]; then
            HDR="${{ steps.headers.outputs.HDR }}"
            HDR_DIR="$(mktemp -d)/linux-headers-${KVER}"
            mkdir -p "$HDR_DIR/DEBIAN" "$HDR_DIR/usr/src/linux-headers-${KVER}"
            cp -a "$HDR/usr/src/linux-headers-${KVER}/." "$HDR_DIR/usr/src/linux-headers-${KVER}/"

            printf '%s\n' \
              "Package: linux-headers-${KVER}" \
              "Version: 1" \
              "Architecture: ${DEB_ARCH}" \
              "Maintainer: CI" \
              "Description: Headers for ${KVER}" \
              > "$HDR_DIR/DEBIAN/control"

            dpkg-deb --root-owner-group --build "$HDR_DIR" "$OUT/linux-headers-${KVER}_${DEB_ARCH}.deb"
          fi

      - name: 打包 rpm
        if: ${{ contains(fromJSON(inputs.formats), 'rpm') }}
        run: |
          set -euo pipefail
          RPM_ARCH="${{ inputs.rpm_arch }}"
          STAGE="${{ steps.stage.outputs.STAGE }}"
          KVER="${{ steps.compile.outputs.KVER }}"
          OUT="dist/${{ inputs.arch }}/rpm"
          RPM_VER="$(printf '%s' "$KVER" | rev | cut -d'-' -f2- | rev)"
          RPM_REL="$(printf '%s' "$KVER" | rev | cut -d'-' -f1 | rev)_1"
          if [ -z "$RPM_VER" ]; then RPM_VER="$KVER"; fi
          if [ -z "$RPM_REL" ]; then RPM_REL="1"; fi

          RPM_TOPDIR="$(mktemp -d)"
          mkdir -p "$RPM_TOPDIR"/{BUILD,RPMS,SOURCES,SPECS,BUILDROOT}
          mkdir -p "$OUT"

          SPEC_IMAGE="$RPM_TOPDIR/SPECS/kernel-image.spec"
          printf '%s\n' \
            '%global debug_package %{nil}' \
            '%global __strip /bin/true' \
            '%global __find_provides %{nil}' \
            '%global __find_requires %{nil}' \
            '%define _unpackaged_files_terminate_build 0' \
            '' \
            "Name: kernel-image-${KVER}" \
            "Version: ${RPM_VER}" \
            "Release: ${RPM_REL}" \
            "Summary: Linux kernel ${KVER}" \
            "License: GPL-2.0-only" \
            "AutoReqProv: no" \
            "BuildArch: ${RPM_ARCH}" \
            '' \
            '%description' \
            'Kernel image and modules' \
            '' \
            '%install' \
            'rm -rf %{buildroot}' \
            'mkdir -p %{buildroot}/boot %{buildroot}/lib/modules' \
            "cp ${STAGE}/boot/vmlinuz-${KVER} %{buildroot}/boot/ 2>/dev/null || :" \
            "cp ${STAGE}/boot/System.map-${KVER} %{buildroot}/boot/ 2>/dev/null || :" \
            "cp ${STAGE}/boot/config-${KVER} %{buildroot}/boot/ 2>/dev/null || :" \
            "cp -a ${STAGE}/lib/modules/${KVER} %{buildroot}/lib/modules/ 2>/dev/null || :" \
            '' \
            '%files' \
            "/boot/vmlinuz-${KVER}" \
            "/boot/System.map-${KVER}" \
            "/boot/config-${KVER}" \
            "/lib/modules/${KVER}" \
            > "$SPEC_IMAGE"

          if [ "${{ inputs.include_headers }}" = "true" ]; then
            HDR="${{ steps.headers.outputs.HDR }}"
            SPEC_HDR="$RPM_TOPDIR/SPECS/kernel-headers.spec"
            printf '%s\n' \
              '%global debug_package %{nil}' \
              '%global __strip /bin/true' \
              '%global __find_provides %{nil}' \
              '%global __find_requires %{nil}' \
              '%define _unpackaged_files_terminate_build 0' \
              '' \
              "Name: kernel-headers-${KVER}" \
              "Version: ${RPM_VER}" \
              "Release: ${RPM_REL}" \
              "Summary: Headers for ${KVER}" \
              "License: GPL-2.0-only" \
              "AutoReqProv: no" \
              "BuildArch: ${RPM_ARCH}" \
              '' \
              '%install' \
              'rm -rf %{buildroot}' \
              "mkdir -p %{buildroot}/usr/src/linux-headers-${KVER}" \
              "cp -a ${HDR}/usr/src/linux-headers-${KVER}/. %{buildroot}/usr/src/linux-headers-${KVER}/" \
              '' \
              '%files' \
              "/usr/src/linux-headers-${KVER}" \
              > "$SPEC_HDR"
            rpmbuild --define "_topdir $RPM_TOPDIR" -bb "$SPEC_HDR"
          fi

          rpmbuild --define "_topdir $RPM_TOPDIR" -bb "$SPEC_IMAGE"
          find "$RPM_TOPDIR/RPMS" -name '*.rpm' -exec cp {} "$OUT/" \;

      - name: 打包 tar.xz
        if: ${{ contains(fromJSON(inputs.formats), 'tarxz') }}
        run: |
          set -euo pipefail
          ARCH="${{ inputs.arch }}"
          STAGE="${{ steps.stage.outputs.STAGE }}"
          KVER="${{ steps.compile.outputs.KVER }}"
          OUT="dist/${ARCH}/tarxz"
          mkdir -p "$OUT"

          PKG_ROOT="$(mktemp -d)/linux-${KVER}-${ARCH}"
          mkdir -p "$PKG_ROOT/boot" "$PKG_ROOT/lib/modules"

          cp "$STAGE/boot/vmlinuz-${KVER}" "$PKG_ROOT/boot/vmlinuz-${KVER}" 2>/dev/null || cp "$STAGE/boot/"vmlinuz* "$PKG_ROOT/boot/vmlinuz-${KVER}"
          cp "$STAGE/boot/System.map-${KVER}" "$PKG_ROOT/boot/"
          cp "$STAGE/boot/config-${KVER}" "$PKG_ROOT/boot/"
          cp -a "$STAGE/lib/modules/${KVER}" "$PKG_ROOT/lib/modules/"

          if [ "${{ inputs.include_headers }}" = "true" ] && [ "${{ inputs.tarxz_include_headers }}" = "true" ]; then
            HDR="${{ steps.headers.outputs.HDR }}"
            mkdir -p "$PKG_ROOT/usr/src"
            cp -a "$HDR/usr/src/linux-headers-${KVER}" "$PKG_ROOT/usr/src/"
          fi

          SCRIPT="$PKG_ROOT/install-${KVER}.sh"
          printf '%s\n' \
            '#!/bin/sh' \
            'set -e' \
            '[ "$(id -u)" = "0" ] || { echo "请 root 运行" >&2; exit 1; }' \
            'mkdir -p /boot' \
            "cp -a \"$PKG_ROOT/boot/\"* /boot/ 2>/dev/null || true" \
            "cp -a \"$PKG_ROOT/lib/modules/${KVER}\" /lib/modules/ 2>/dev/null || true" \
            "if [ -d \"$PKG_ROOT/usr/src/linux-headers-${KVER}\" ]; then cp -a \"$PKG_ROOT/usr/src/linux-headers-${KVER}\" /usr/src/; fi" \
            "depmod ${KVER} 2>/dev/null || true" \
            'echo "完成"' \
            > "$SCRIPT"
          chmod 755 "$SCRIPT"

          cd "$(dirname "$PKG_ROOT")"
          tar --owner=0 --group=0 --numeric-owner -cJf "$OLDPWD/$OUT/linux-${KVER}-${ARCH}.tar.xz" "$(basename "$PKG_ROOT")"

      - name: 打包 pkg.tar.zst
        if: ${{ contains(fromJSON(inputs.formats), 'pkg') }}
        run: |
          set -euo pipefail
          ARCH="${{ inputs.arch }}"
          STAGE="${{ steps.stage.outputs.STAGE }}"
          KVER="${{ steps.compile.outputs.KVER }}"
          OUT="dist/${ARCH}/pkg"
          mkdir -p "$OUT"

          IMG_ROOT="$(mktemp -d)"
          mkdir -p "$IMG_ROOT/boot" "$IMG_ROOT/lib/modules"
          cp "$STAGE/boot/vmlinuz-${KVER}" "$IMG_ROOT/boot/vmlinuz-${KVER}" 2>/dev/null || cp "$STAGE/boot/"vmlinuz* "$IMG_ROOT/boot/vmlinuz-${KVER}"
          cp "$STAGE/boot/System.map-${KVER}" "$IMG_ROOT/boot/"
          cp "$STAGE/boot/config-${KVER}" "$IMG_ROOT/boot/"
          cp -a "$STAGE/lib/modules/${KVER}" "$IMG_ROOT/lib/modules/"

          printf '%s\n' \
            "pkgname = linux-image-${KVER}" \
            "pkgver = ${KVER}-1" \
            "arch = ${ARCH}" \
            "license = GPL-2.0-only" \
            > "$IMG_ROOT/.PKGINFO"

          cd "$IMG_ROOT"
          tar --owner=0 --group=0 --numeric-owner -cf - . | zstd -T0 --fast -o "$OLDPWD/$OUT/linux-image-${KVER}-${ARCH}.pkg.tar.zst" --force

          if [ "${{ inputs.include_headers }}" = "true" ]; then
            HDR="${{ steps.headers.outputs.HDR }}"
            HDR_ROOT="$(mktemp -d)"
            mkdir -p "$HDR_ROOT/usr/src/linux-headers-${KVER}"
            cp -a "$HDR/usr/src/linux-headers-${KVER}/." "$HDR_ROOT/usr/src/linux-headers-${KVER}/"
            printf '%s\n' \
              "pkgname = linux-headers-${KVER}" \
              "pkgver = ${KVER}-1" \
              "arch = ${ARCH}" \
              "license = GPL-2.0-only" \
              > "$HDR_ROOT/.PKGINFO"
            cd "$HDR_ROOT"
            tar --owner=0 --group=0 --numeric-owner -cf - . | zstd -T0 --fast -o "$OLDPWD/$OUT/linux-headers-${KVER}-${ARCH}.pkg.tar.zst" --force
          fi

      - name: 上传制品
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.arch }}
          path: dist/${{ inputs.arch }}/**/*
          if-no-files-found: warn
          retention-days: 7

      - name: 统计产物大小
        if: ${{ always() && !cancelled() }}
        run: find dist -type f -exec ls -lh {} \; 2>/dev/null || true
